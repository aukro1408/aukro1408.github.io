<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Просто Кино</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:#0f0f14;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button{font-family:inherit;cursor:pointer}
button:focus,input:focus{outline:none}
/* Верхнее меню: мягкое свечение из файла Denis, белая пилюля убрана полностью */
.topmenu{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;gap:clamp(18px,4vw,44px);align-items:center;
  padding:1.1em 2em;background:linear-gradient(180deg,rgba(0,0,0,.75),rgba(0,0,0,0));overflow-x:auto;
  scrollbar-width:none}
.topmenu::-webkit-scrollbar{display:none}
.menu-btn{position:relative;flex:0 0 auto;background:transparent;border:0;color:rgba(255,255,255,.74);
  font-size:clamp(17px,3vw,25px);font-weight:400;padding:10px 0 13px;white-space:nowrap;
  text-shadow:0 0 8px rgba(255,255,255,.06);transition:color .3s ease,text-shadow .3s ease}
.menu-btn.active{color:#fff;font-weight:600;text-shadow:0 0 8px rgba(255,255,255,.18),0 0 18px rgba(255,255,255,.08)}
.menu-btn:hover,.menu-btn.focused{color:#fff;text-shadow:0 0 8px rgba(255,255,255,.25),0 0 16px rgba(255,255,255,.12)}
.menu-btn:after{content:"";position:absolute;left:25%;right:25%;bottom:3px;height:2px;border-radius:2px;
  background:rgba(255,255,255,.88);transform:scaleX(0);opacity:0;transition:transform .3s ease,opacity .3s ease;
  box-shadow:0 0 8px rgba(255,255,255,.22)}
.menu-btn.active:after,.menu-btn:hover:after,.menu-btn.focused:after{transform:scaleX(1);opacity:.7}
@media(prefers-reduced-motion:reduce){.menu-btn,.menu-btn:after{transition:none}}
/* Логотип pawflix в меню: lockup из файла Denis 1:1 (только логотип, не демо-сцена) */
.pk-logo{position:relative;z-index:1;display:flex;align-items:center;gap:.1em;font-size:calc(clamp(17px,3vw,25px) * 1.3);line-height:1;flex:none;cursor:pointer;margin-right:calc(.5em - clamp(18px,4vw,44px))}
.pk-logo .paw{width:1.15em;height:1.15em;flex:none;overflow:visible;filter:drop-shadow(0 .06em .18em rgba(66,133,244,.5))}
.pk-logo .word{display:flex;font-family:'Fredoka',system-ui,sans-serif;font-weight:600;letter-spacing:-.02em;padding-bottom:.04em}
.pk-logo .word span{display:inline-block;transform-origin:50% 100%;opacity:0}
.pk-logo .word .f{color:#b4d0fb}.pk-logo .word .f2{color:#8ab4f8}.pk-logo .word .f3{color:#6b9ff5}.pk-logo .word .f4{color:#4f8bf2}
.pk-logo .body,.pk-logo .toe,.pk-logo .tri,.pk-logo .ring,.pk-logo .dot{opacity:0}
.pk-logo.go .body{transform-box:fill-box;transform-origin:50% 100%;animation:stamp .95s cubic-bezier(.3,.7,.4,1) both .1s}
.pk-logo.go .toe{transform-box:fill-box;transform-origin:50% 100%;animation:splay .7s cubic-bezier(.3,1.5,.5,1) both calc(.78s + var(--k) * .06s),wig 5.5s ease-in-out infinite calc(4.2s + var(--k) * .16s)}
.pk-logo.go .tri{transform-box:fill-box;transform-origin:center;animation:tri .7s cubic-bezier(.3,1.5,.5,1) both 1.15s,beat 3.2s ease-in-out infinite 3s}
.pk-logo.go .ring{transform-box:fill-box;transform-origin:center;animation:ring .9s ease-out both .78s}
.pk-logo.go .dot{animation:burst .8s ease-out both .78s}
.pk-logo.go .word span{animation:lt .75s cubic-bezier(.3,1.5,.5,1) both calc(1.05s + var(--k) * .08s)}
@keyframes stamp{0%{transform:translateY(-.55em) scale(1.45);opacity:0}40%{opacity:1}68%{transform:translateY(0) scale(1.05,.92);opacity:1}84%{transform:scale(.98,1.03);opacity:1}100%{transform:none;opacity:1}}
@keyframes splay{from{transform:translate(var(--tx),var(--ty)) scale(.4);opacity:0}to{transform:none;opacity:1}}
@keyframes wig{0%,88%,100%{transform:none}91%{transform:translateY(-3px) rotate(-9deg)}95%{transform:translateY(0) rotate(4deg)}}
@keyframes tri{from{transform:scale(0) rotate(-60deg);opacity:1}to{transform:none;opacity:1}}
@keyframes beat{0%,70%,100%{transform:none}80%{transform:scale(1.14)}90%{transform:scale(.96)}}
@keyframes ring{from{transform:scale(.4);opacity:.7}to{transform:scale(7);opacity:0}}
@keyframes burst{from{transform:translate(0,0) scale(1);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
@keyframes lt{0%{opacity:0;transform:translateY(.5em) rotate(12deg) scale(.5)}60%{opacity:1;transform:translateY(-.09em) rotate(-3deg) scale(1.08)}100%{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.pk-logo .body,.pk-logo .toe,.pk-logo .tri,.pk-logo .word span{opacity:1!important}.pk-logo.go *{animation:none!important}}
body.phone .topmenu{padding:.9em 1em}
/* Экраны */
main{padding-top:0}
section.screen{display:none}
section.screen.show{display:block}
/* Hero: фон на весь экран, НЕ кликабелен, НЕ фокусируем */
.hero{position:relative;height:62vh;min-height:340px;overflow:hidden;background:#181820}
body.phone .hero{height:46vh;min-height:260px}
.hero img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.35),rgba(0,0,0,0) 30%,rgba(15,15,20,0) 55%,rgba(15,15,20,.92) 88%,#0f0f14)}
.hero-info{position:absolute;left:2em;bottom:2.2em;max-width:44em;z-index:2}
body.phone .hero-info{left:1em;right:1em;bottom:1.4em}
.hero-info h1{margin:0 0 .25em;font-size:3em;line-height:1.05;text-transform:uppercase}
body.phone .hero-info h1{font-size:1.8em}
.hero-meta{font-size:1.1em;color:#e8eaf0;margin-bottom:.5em}
.hero-meta .star{color:#ffb340}
.hero-overview{margin:0;color:#d5d8e0;font-size:1.05em;line-height:1.45;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.hero-dots{display:flex;gap:.45em;margin-top:1em}
.hero-dots span{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.35)}
.hero-dots span.on{background:#fff}
/* Ряды и широкие карточки: название ПОД карточкой */
.rows{padding:1em 2em 3em}
body.phone .rows{padding:.5em 1em 2em}
.row-title{font-size:1.4em;font-weight:700;margin:1.2em 0 .6em}
.row{display:flex;gap:1em;overflow-x:auto;padding:.4em .2em 1em;scrollbar-width:none;scroll-behavior:smooth}
.row::-webkit-scrollbar{display:none}
.card{flex:0 0 auto;width:320px;background:none;border:0;padding:0;text-align:left;color:#fff}
body.phone .card{width:78vw;max-width:380px}
.card .thumb{display:block;width:100%;aspect-ratio:16/9;border-radius:14px;overflow:hidden;
  background:#22222c;box-shadow:0 14px 30px rgba(0,0,0,.55),0 2px 8px rgba(0,0,0,.45);transition:transform .15s}
.card .thumb img{width:100%;height:100%;object-fit:cover;display:block}
.card .ctitle{display:block;margin-top:.55em;font-size:1.02em;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.focused .thumb{outline:3px solid #fff;outline-offset:3px;transform:scale(1.03)}
/* Маленькая пилюля «Ещё» в конце жанрового ряда — НЕ карточка */
.more-wrap{flex:0 0 auto;width:320px;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center}
body.phone .more-wrap{width:78vw;max-width:380px}
.more-pill{height:2.6em;padding:0 1.5em;border:0;border-radius:999px;background:#26262e;color:#fff;font-size:1em}
.more-pill.focused{background:#ff7a29}
/* Сетки */
.grid{display:grid;gap:1em;padding:1.5em 2em 3em}
body.tv .grid{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
body.phone .grid{grid-template-columns:1fr;padding:1em 1em 2em}
.grid .card{width:auto}
/* Полный список жанра: фиксированный фон-бэкдроп, карточки листаются поверх */
.list-bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:#0f0f14}
.list-bg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:blur(24px) saturate(1.2);transform:scale(1.12)}
.list-bg-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(15,15,20,.82),rgba(15,15,20,.88) 55%,rgba(15,15,20,.94))}
#screen-list .back-btn,#screen-list .loader,#screen-list .grid,#screen-list #list-more,#screen-list #list-sentinel{position:relative;z-index:1}
#list-sentinel{height:8px}
#list-more{text-align:center;padding:1em 2em 3em}
/* Плитки жанров */
.tiles{display:grid;gap:1em;padding:5.5em 2em 3em}
body.tv .tiles{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
body.phone .tiles{grid-template-columns:1fr 1fr;padding:5em 1em 2em}
.tile{background:#1e1e28;border:0;border-radius:16px;color:#fff;font-size:1.15em;padding:1.2em .5em;text-align:center}
.tile.focused{outline:3px solid #fff;outline-offset:2px}
/* Кнопки, поля, тексты */
.back-btn{margin:5em 0 0 2em;background:#26262e;border:0;border-radius:999px;color:#fff;font-size:1em;padding:.6em 1.4em}
body.phone .back-btn{margin:4.5em 0 0 1em}
.back-btn.focused{background:#ff7a29}
.fav-btn{background:#26262e;border:0;border-radius:999px;color:#fff;font-size:1.05em;padding:.7em 1.6em}
.fav-btn.in{background:#ff7a29}
.fav-btn.focused{outline:3px solid #fff;outline-offset:2px}
.save-btn{background:#ff7a29;border:0;border-radius:999px;color:#fff;font-size:1.05em;padding:.7em 1.8em}
.save-btn.focused{outline:3px solid #fff;outline-offset:2px}
.field{background:#1e1e28;border:1px solid #33333f;border-radius:12px;color:#fff;font-size:1.05em;padding:.8em 1em;width:min(28em,90vw)}
.field:focus{border-color:#ff7a29}
.hint{color:#9aa3b5;font-size:1.05em;line-height:1.5;padding:2em}
.empty{color:#9aa3b5;font-size:1.1em;padding:2em}
.loader{color:#9aa3b5;padding:1.5em 2em}
.settings,.searchbox{padding:6em 2em 3em}
body.phone .settings,body.phone .searchbox{padding:5em 1em 2em}
.settings h2,.searchbox h2{margin:0 0 .8em}
.rowline{display:flex;gap:.8em;flex-wrap:wrap;align-items:center}
.status{color:#8be9a4;margin-top:1em}
/* Экран фильма */
.detail{padding:0 0 3em}
.detail .backdrop{position:relative;height:56vh;min-height:300px;overflow:hidden;background:#181820}
body.phone .detail .backdrop{height:38vh}
.detail .backdrop img{width:100%;height:100%;object-fit:cover}
.detail .backdrop .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.3),rgba(0,0,0,0) 40%,rgba(15,15,20,.95) 90%,#0f0f14)}
.detail-info{padding:0 2em}
body.phone .detail-info{padding:0 1em}
.detail-info h1{margin:.2em 0 .3em;font-size:2.2em}
.detail-info .meta{color:#e8eaf0;margin-bottom:.8em}
.detail-info .meta .star{color:#ffb340}
.detail-info p{color:#d5d8e0;line-height:1.6;max-width:50em}
/* v0.5: плитки сервисов — механика из файла Denis 1:1, геометрия — широкие прямоугольники ~3:1 */
.src-tiles{display:flex;gap:1em;flex-wrap:wrap;margin:1.2em 0}
.src-tile{position:relative;overflow:hidden;isolation:isolate;width:15rem;height:4.8rem;padding:0;border:0;border-radius:1.1rem;background:var(--g);cursor:pointer;outline:none;-webkit-tap-highlight-color:transparent;box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 .6rem 1.4rem rgba(0,0,0,.45);transition:transform .3s cubic-bezier(.2,0,0,1),box-shadow .35s}
body.phone .src-tile{width:100%;height:4.4rem}
.src-tile::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(120% 90% at 20% 0%,rgba(255,255,255,.22),transparent 60%)}
.src-tile::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg)}
.src-tile:hover,.src-tile.focused,.src-tile:focus{transform:scale(1.06) translateY(-.1rem);box-shadow:0 0 0 .26rem #fff,0 1.2rem 2.4rem rgba(0,0,0,.65)}
.src-tile.focused::after,.src-tile:focus::after{animation:shine .9s cubic-bezier(.2,0,0,1) .05s}
.src-tile:active{transform:scale(1.02);transition-duration:.1s}
.src-tile .in{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:.7rem;font-size:1.15rem;font-weight:800;letter-spacing:-.02em;color:#fff}
.src-tile .ic{width:1.9rem;height:1.9rem;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;transition:transform .55s cubic-bezier(.3,1.4,.5,1)}
.src-tile:hover .ic,.src-tile.focused .ic,.src-tile:focus .ic{transform:scale(1.15) rotate(var(--r,0deg))}
.src-tile .out{position:absolute;top:.6rem;right:.7rem;width:1rem;height:1rem;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;opacity:0;transform:translate(-5px,5px);transition:opacity .25s,transform .35s cubic-bezier(.3,1.4,.5,1)}
.src-tile:hover .out,.src-tile.focused .out,.src-tile:focus .out{opacity:.85;transform:none}
.src-tile .bar{position:absolute;left:0;bottom:0;height:.28rem;width:100%;background:#fff;transform:scaleX(0);transform-origin:left;opacity:0}
.src-tile.busy .bar{opacity:1;animation:fill 1.35s cubic-bezier(.6,0,.2,1) forwards}
.src-tile.busy .in{opacity:.6}
.src-tile .rip{position:absolute;border-radius:50%;pointer-events:none;background:rgba(255,255,255,.3);transform:scale(0);animation:ripple .6s ease-out forwards;z-index:-1}
.src-film{--g:linear-gradient(135deg,#2a5ad0,#0f2a6e);--r:-12deg}
.src-alpac{--g:linear-gradient(135deg,#f0a832,#8a5a00);--r:45deg}
.src-tor{--g:linear-gradient(135deg,#17a06b,#0a4a33);--r:180deg}
@keyframes shine{from{left:-60%}to{left:140%}}
@keyframes fill{to{transform:scaleX(1)}}
@keyframes ripple{to{transform:scale(1);opacity:0}}
@media (prefers-reduced-motion:reduce){.src-tile,.src-tile::after{animation:none!important;transition:none!important}}
.src-status{color:#9aa3b5;font-size:1em;line-height:1.5;margin:.5em 0 1em;max-width:50em}
.src-status.err{color:#ff9a90}
/* Блоки страницы фильма */
.block-title{font-size:1.35em;font-weight:700;margin:1.6em 0 .7em}
.detail-actions{margin:1.2em 0 .2em}
.dir-item{display:flex;align-items:center;gap:1em;background:#1e1e28;border:0;border-radius:16px;color:#fff;padding:.8em 1.2em .8em .8em;text-align:left}
.dir-item img{width:88px;height:110px;object-fit:cover;border-radius:12px;background:#26262e}
.dir-item .dname{font-size:1.15em;font-weight:600}
.dir-item.focused{outline:3px solid #fff;outline-offset:2px}
.cast-row{display:flex;gap:1.1em;overflow-x:auto;padding:.3em .2em 1em;scrollbar-width:none}
.cast-row::-webkit-scrollbar{display:none}
.cast-item{flex:0 0 auto;width:120px;background:none;border:0;padding:0;color:#fff;text-align:center}
.cast-item img{width:104px;height:104px;object-fit:cover;border-radius:50%;background:#26262e;display:block;margin:0 auto}
.cast-item .cname{display:block;margin-top:.5em;font-weight:600;font-size:.98em;line-height:1.25}
.cast-item .crole{display:block;margin-top:.2em;color:#9aa3b5;font-size:.88em;line-height:1.25}
.cast-item.focused img{outline:3px solid #fff;outline-offset:3px}
/* Портретные карточки (Похожие, фильмы персоны) */
.pcard{flex:0 0 auto;width:200px;background:none;border:0;padding:0;text-align:left;color:#fff}
body.phone .pcard{width:40vw}
.pcard .pthumb{display:block;width:100%;aspect-ratio:2/3;border-radius:14px;overflow:hidden;background:#22222c;box-shadow:0 14px 30px rgba(0,0,0,.55)}
.pcard .pthumb img{width:100%;height:100%;object-fit:cover;display:block}
.pcard .ptitle{display:block;margin-top:.55em;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard .prate{display:block;margin-top:.2em;color:#e8eaf0}
.pcard .prate .star{color:#ffb340}
.pcard.focused .pthumb{outline:3px solid #fff;outline-offset:3px}
.pgrid{display:grid;gap:1em;padding:1.5em 2em 3em}
body.tv .pgrid{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
body.phone .pgrid{grid-template-columns:1fr 1fr;padding:1em 1em 2em}
.pgrid .pcard{width:auto}
/* Экран персоны */
.person{padding:5.5em 2em 3em}
body.phone .person{padding:5em 1em 2em}
.person-head{display:flex;gap:1.5em;align-items:flex-start}
.person-head img{width:200px;border-radius:16px;background:#22222c}
body.phone .person-head img{width:130px}
.person-head h1{margin:0 0 .4em;font-size:2em}
.person-bio{color:#d5d8e0;line-height:1.6;max-width:50em;margin-top:1em}
/* v0.6: экран раздач как в «Кино» + рамка + золотой акцент */
/* Фрейм-контейнер: сплошная чуть более светлая подложка, тонкая светлая граница, без blur (стекла нет) */
.framed{background:#1a1a22;border:1px solid rgba(255,255,255,.14);border-radius:18px;padding:1em}
body.phone .framed{padding:.8em}
.picker-box.framed{padding:1.2em}
/* Экран раздач */
.tor-screen{padding:5.5em 2em 3em}
body.phone .tor-screen{padding:5em 1em 2em}
.tor-screen .back-btn{margin:0 0 1.2em}
.tor-kicker{font-size:.85em;font-weight:800;letter-spacing:2.5px;color:#8ab4f8;text-transform:uppercase;margin-bottom:.5em}
.tor-screen h1{margin:0 0 .3em;font-size:2em;line-height:1.1}
body.phone .tor-screen h1{font-size:1.5em}
.tor-meta{color:#e8eaf0;margin-bottom:1em}
.tor-meta .star{color:#ffb340}
.best-btn{display:flex;align-items:center;justify-content:center;gap:.6em;width:100%;padding:1em;border:0;border-radius:18px;background:linear-gradient(135deg,#3b8cff,#7b5cff);color:#fff;font-size:1.15em;font-weight:800;letter-spacing:.2px;box-shadow:0 12px 30px rgba(70,110,255,.40),inset 0 1px 0 rgba(255,255,255,.25);margin-bottom:1em}
.best-btn:active{transform:scale(.98)}
.best-btn.focused{outline:3px solid #fff;outline-offset:2px}
.tor-sub{color:#9aa3b5;font-size:1em;margin-bottom:1em}
.tor-sub b{color:#fff}
.tor-filters{display:flex;gap:.8em;flex-wrap:wrap;margin-bottom:1.2em}
.filter-pill{display:flex;align-items:center;gap:.5em;background:#1e1e28;border:1px solid rgba(255,255,255,.10);border-radius:14px;color:#fff;font-size:1em;font-weight:700;padding:.7em 1em}
.filter-pill .pv{color:#8ab4f8;max-width:14em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.filter-pill.focused{outline:3px solid #fff;outline-offset:2px}
.tor-status{color:#9aa3b5;font-size:1em;line-height:1.5;margin-bottom:1em;max-width:50em}
.tor-status.err{color:#ff9a90}
.tor-card{display:block;width:100%;background:#26262e;border:1px solid rgba(255,255,255,.06);border-radius:14px;color:#fff;padding:.85em 1em;margin-bottom:.7em;text-align:left}
.tor-card:last-child{margin-bottom:0}
.tor-card.focused{outline:3px solid #fff;outline-offset:2px}
.tor-card.busy{opacity:.6}
.tor-card.premium{border-color:rgba(255,210,90,.55);box-shadow:0 0 18px rgba(255,210,90,.15)}
.tor-t{display:block;font-size:1.02em;font-weight:700;line-height:1.35}
.tor-pills{display:flex;flex-wrap:wrap;gap:.4em;margin:.55em 0 .2em}
.tpill{display:inline-block;padding:.2em .6em;border-radius:999px;font-size:.85em;font-weight:800;letter-spacing:.3px}
.tpill.res{background:rgba(77,163,255,.16);color:#8dbcff;border:1px solid rgba(77,163,255,.35)}
.tpill.au{background:rgba(255,255,255,.07);color:#9aa3b5;border:1px solid rgba(255,255,255,.12)}
.tpill.sub{background:rgba(90,220,170,.12);color:#7fe0b2;border:1px solid rgba(90,220,170,.35)}
.tpill.top{background:rgba(255,210,90,.15);color:#ffd25e;border:1px solid rgba(255,210,90,.45)}
.tpill.gold{background:rgba(255,210,90,.15);color:#ffd25e;border:1px solid rgba(255,210,90,.55)}

/* Экран привязки Alpac */
.alp-screen{padding:5.5em 2em 3em}

.alp-screen .back-btn{margin:0 0 1.2em}
.alp-kicker{font-size:.85em;font-weight:800;letter-spacing:2.5px;color:#f0a832;text-transform:uppercase;margin-bottom:.5em}
.alp-screen h1{margin:0 0 1em;font-size:2em;line-height:1.1}
body.phone .alp-screen h1{font-size:1.5em}
.alp-auth{max-width:26em;margin:0 auto;text-align:center;padding:1.6em 1.4em}
.alp-qr{width:200px;height:200px;border-radius:16px;background:#fff;padding:10px;display:block;margin:0 auto 1.1em;box-shadow:0 0 34px rgba(240,168,50,.25)}

.alp-msg b{color:#fff}
.alp-status{display:flex;align-items:center;justify-content:center;gap:.5em;font-size:1em;font-weight:700;color:#f0c060;margin-bottom:1.2em}
.alp-dot{width:9px;height:9px;border-radius:50%;background:#f0a832;box-shadow:0 0 10px #f0a832;animation:alp-blink 1.2s ease-in-out infinite;flex:none}
@keyframes alp-blink{50%{opacity:.35}}
.alp-btns{display:flex;gap:.8em;justify-content:center;flex-wrap:wrap}
/* Пикер (озвучка/качество/сезон/серия/источник/файл) */
#picker{position:fixed;inset:0;z-index:200;display:none;background:rgba(0,0,0,.78);overflow-y:auto}
#picker.open{display:block}
.picker-box{max-width:34em;margin:6em auto 3em;padding:0 1em}
.picker-box h2{margin:0 0 .8em;font-size:1.4em}

.pick-btn .sub{display:block;color:#9aa3b5;font-size:.9em;margin-top:.2em}

/* Плеер и трейлер-оверлеи */
#player-ov,#trailer-ov{position:fixed;inset:0;z-index:300;display:none;background:#000}
#trailer-ov{background:rgba(0,0,0,.94)}

</style>

<script>
const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];
const LS_KEY='prostokino.tmdb_key', LS_FAV='prostokino.favs';
const TMDB='https://api.themoviedb.org/3', IMG='https://image.tmdb.org/t/p';
let genreMovie={}, currentScreen='home', hist=[];
const HOME_GENRES=[['28','Боевики'],['35','Комедии'],['18','Драмы'],['878','Фантастика'],['53','Триллеры']];

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function getKey(){return (localStorage.getItem(LS_KEY)||'').trim();}
function hasKey(){return !!getKey();}
function imgUrl(p,size){return p?IMG+'/'+size+p:'';}
function getFavs(){try{return JSON.parse(localStorage.getItem(LS_FAV)||'[]');}catch(e){return [];}}
function setFavs(f){localStorage.setItem(LS_FAV,JSON.stringify(f));}
function isFav(type,id){return getFavs().some(f=>f.type===type&&String(f.id)===String(id));}

/* ТВ или телефон — автоматически */
function detectTV(){
  const ua=navigator.userAgent||'';
  if(/TV|MiBox|Android TV|BRAVIA|AFT|GoogleTV/i.test(ua)) return true;
  const coarse=window.matchMedia('(pointer: coarse)').matches;
  const touch=('ontouchstart' in window)||navigator.maxTouchPoints>0;
  return window.innerWidth>=960 && !coarse && !touch;
}
function applyMode(){document.body.classList.toggle('tv',detectTV());document.body.classList.toggle('phone',!detectTV());}
applyMode();
let rsT=null;window.addEventListener('resize',()=>{clearTimeout(rsT);rsT=setTimeout(applyMode,200);});

/* Пространственная навигация (D-pad) */
let cur=null;
function setFocus(el){
  if(!el) return;
  if(cur) cur.classList.remove('focused');
  cur=el; cur.classList.add('focused');
  try{cur.scrollIntoView({block:'nearest',inline:'nearest'});}catch(e){}
}
function visibleFocusable(){
  const ov=currentOverlay();
  return $$('.focusable').filter(el=>{
    if(el.disabled) return false;
    if(ov){
      if(!el.closest(ov)) return false;
    }else{
      if(el.closest('#picker,#player-ov,#trailer-ov')) return false;
    }
    const s=el.closest('section.screen');
    if(s && !s.classList.contains('show')) return false;
    return el.offsetParent!==null;
  });
}
function moveFocus(dir){
  const list=visibleFocusable();
  if(!cur){if(list.length) setFocus(list[0]);return;}
  const r=cur.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/2;
  let best=null,bd=1e15;
  for(const el of list){
    if(el===cur) continue;
    const q=el.getBoundingClientRect(), ex=q.left+q.width/2, ey=q.top+q.height/2;
    const dx=ex-cx, dy=ey-cy;
    let ok=false;
    if(dir==='right') ok=dx>0&&Math.abs(dy)<=Math.abs(dx);
    if(dir==='left') ok=dx<0&&Math.abs(dy)<=Math.abs(dx);
    if(dir==='down') ok=dy>0&&Math.abs(dx)<=Math.abs(dy);
    if(dir==='up') ok=dy<0&&Math.abs(dx)<=Math.abs(dy);
    if(!ok) continue;
    const d=dx*dx+dy*dy;
    if(d<bd){bd=d;best=el;}
  }
  if(best) setFocus(best);
}
document.addEventListener('mouseover',e=>{
  const f=e.target.closest?e.target.closest('.focusable'):null;
  if(f) setFocus(f);
});
document.addEventListener('keydown',e=>{
  const ae=document.activeElement;
  const inField=ae&&(ae.tagName==='INPUT'||ae.tagName==='TEXTAREA');
  if(inField){
    /* Пока фокус в поле — навигация клавиши не перехватывает, ввод идёт в поле */
    if(e.key==='ArrowUp'||e.key==='ArrowDown'){ae.blur();e.preventDefault();}
    else if(e.key==='Enter'){e.preventDefault();if(ae.closest&&ae.closest('#screen-settings'))saveSettings();else if(ae.id==='search-input')doSearch();}
    else if(e.key==='Escape'){ae.blur();e.preventDefault();}
    return;
  }
  const k=e.key;
  if(k==='ArrowRight'){moveFocus('right');e.preventDefault();}
  else if(k==='Left'||k==='ArrowLeft'){moveFocus('left');e.preventDefault();}
  else if(k==='ArrowDown'){moveFocus('down');e.preventDefault();}
  else if(k==='ArrowUp'){moveFocus('up');e.preventDefault();}
  else if(k==='Enter'||k===' '){
    if(cur){
      /* Поле ввода: только РЕАЛЬНЫЙ DOM-фокус открывает системную клавиатуру на ТВ.
         Синтезированный click() на WebView MiBox клавиатуру не открывает (урок pawflix v0.9). */
      if(cur.tagName==='INPUT'||cur.tagName==='TEXTAREA'){setFocus(cur);cur.focus();}
      else cur.click();
      e.preventDefault();
    }
  }
  else if(k==='Escape'){if(iframeIsOpen()){closeIframeOverlay();}else if(playerIsOpen()){closeBuiltInPlayer();}else if(pickerIsOpen()){closePicker();}else{goBack();}e.preventDefault();}
});

/* Экраны */
const MENU_MAIN={home:1,'genres-movie':1,'genres-tv':1,'genres-anim':1,favs:1,settings:1,search:1};
function showScreen(id,push){
  if(push===undefined) push=true;
  if(push&&currentScreen&&currentScreen!==id) hist.push(currentScreen);
  currentScreen=id;
  if(id!=='alpac-auth') stopAlpacPoll();
  $$('section.screen').forEach(s=>s.classList.toggle('show',s.id==='screen-'+id));
  if(MENU_MAIN[id]) $$('.menu-btn').forEach(b=>b.classList.toggle('active',b.dataset.screen===id));
  window.scrollTo(0,0);
  if(id==='home'&&!homeLoaded) loadHome();
  if(id==='genres-movie') loadGenreTiles('movie');
  if(id==='genres-tv') loadGenreTiles('tv');
  if(id==='genres-anim') loadGenreTiles('anim');
  if(id==='favs') renderFavs();
  if(id==='settings'){populateSettings();}
  if(detectTV()){
    const first=visibleFocusable();
    if(first.length) setFocus(first[0]);
  }
}
function goBack(){
  if(hist.length){showScreen(hist.pop(),false);return;}
  if(currentScreen!=='home') showScreen('home',false);
}
$('#list-back').addEventListener('click',goBack);
$('#alp-back').addEventListener('click',()=>{stopAlpacPoll();alpAuthCtx=null;goBack();});
$('#alp-refresh').addEventListener('click',()=>{const ctx=alpAuthCtx;if(!ctx)return;stopAlpacPoll();alpAuthCtx=null;openAlpac(ctx.meta,ctx.tile,++srcRun);});
$$('.menu-btn').forEach(b=>b.addEventListener('click',()=>showScreen(b.dataset.screen)));
$('#nokey-goto').addEventListener('click',()=>showScreen('settings'));

/* TMDB */
async function api(path,params){
  const k=getKey();
  if(!k) throw new Error('nokey');
  const u=new URL(TMDB+path);
  u.searchParams.set('api_key',k);
  u.searchParams.set('language','ru-RU');
  if(params) for(const key2 of Object.keys(params)) u.searchParams.set(key2,params[key2]);
  const r=await fetch(u.toString());
  if(!r.ok) throw new Error('tmdb '+r.status);
  return r.json();
}
function cardHTML(it,type){
  const title=it.title||it.name||'';
  const pic=it.backdrop_path||it.poster_path;
  return '<button class="card focusable" data-id="'+it.id+'" data-type="'+type+'">'+
    '<span class="thumb">'+(pic?'<img src="'+imgUrl(pic,'w780')+'" alt="" loading="lazy" onerror="this.remove()">':'')+'</span>'+
    '<span class="ctitle">'+esc(title)+'</span></button>';
}
document.addEventListener('click',e=>{
  const pc=e.target.closest?e.target.closest('.pcard'):null;
  if(pc){openDetail(pc.dataset.type,pc.dataset.id);return;}
  const card=e.target.closest?e.target.closest('.card'):null;
  if(card){openDetail(card.dataset.type,card.dataset.id);return;}
  const sim=e.target.closest?e.target.closest('.sim-more'):null;
  if(sim){openSimilarList(sim.dataset.type,sim.dataset.id);return;}
  const pill=e.target.closest?e.target.closest('.more-pill'):null;
  if(pill){openGenreList(pill.dataset.type,pill.dataset.genre,pill.dataset.name,pill.dataset.anim==='1');return;}
  const tile=e.target.closest?e.target.closest('.tile'):null;

   Фон — статичный размытый бэкдроп первого фильма списка. */
let listState=null, listObserver=null;
function listBgFrom(item){
  const bgImg=$('#list-bg-img');
  bgImg.style.display='none'; bgImg.removeAttribute('src');
  if(!item) return;
  const u=item.backdrop_path?imgUrl(item.backdrop_path,'w1280'):(item.poster_path?imgUrl(item.poster_path,'w500'):'');
  if(u){bgImg.src=u; bgImg.style.display='block';}
}
async function listLoadPage(){
  const st=listState; if(!st||st.loading||st.done) return;
  st.loading=true;
  const more=$('#list-more');
  if(st.page>1){more.style.display='block'; more.textContent='Загружаю ещё…';}
  try{
    let d;
    if(st.mode==='similar'){
      d=await api('/'+st.type+'/'+st.id+'/similar',{page:st.page});
    }else{
      const params={sort_by:'popularity.desc',page:st.page};
      if(st.type==='movie') params.with_genres=st.animOnly?((String(st.genreId)==='16')?'16':'16,'+st.genreId):st.genreId;
      else params.with_genres=st.genreId;
      d=await api(st.type==='movie'?'/discover/movie':'/discover/tv',params);
    }
    st.totalPages=d.total_pages||1;
    const items=d.results||[];
    if(st.page===1){
      $('#list-loader').textContent='';
      $('#list-grid').innerHTML=items.length?items.map(it=>cardHTML(it,st.type)).join(''):'<div class="empty">Ничего не найдено</div>';
      listBgFrom(items[0]);
      const first=$('#list-grid').querySelector('.focusable');
      if(first&&detectTV()) setFocus(first);
    }else{
      $('#list-grid').insertAdjacentHTML('beforeend',items.map(it=>cardHTML(it,st.type)).join(''));
    }
    st.page++;
    if(st.page>st.totalPages) st.done=true;
  }catch(e){
    if(st.page===1) $('#list-loader').textContent='Ошибка загрузки — проверьте TMDB-ключ в Настройках.';
    st.done=true;
  }
  st.loading=false;
  more.style.display='none';
  if(st.done&&listObserver) listObserver.disconnect();
}
function listObserve(){
  if(listObserver) listObserver.disconnect();
  listObserver=new IntersectionObserver(entries=>{
    if(entries.some(en=>en.isIntersecting)) listLoadPage();
  },{rootMargin:'400px'});
  const s=$('#list-sentinel');
  if(s) listObserver.observe(s);
}
async function openGenreList(type,genreId,genreName,animOnly){
  if(listObserver) listObserver.disconnect();
  showScreen('list');
  const loader=$('#list-loader'), grid=$('#list-grid'), more=$('#list-more');
  grid.innerHTML=''; more.style.display='none'; more.textContent='';
  const bgImg=$('#list-bg-img'); bgImg.style.display='none'; bgImg.removeAttribute('src');
  if(!hasKey()){loader.textContent='Добавьте TMDB-ключ в Настройках.'; listState=null; return;}
  loader.textContent='Загружаю…';
  listState={mode:'genre',type:type,genreId:genreId,animOnly:animOnly,page:1,totalPages:1,loading:false,done:false};
  await listLoadPage();
  if(listState&&!listState.done) listObserve();
}

let hlsInst=null;
function openBuiltInPlayer(url,title,subs){
  const ov=$('#player-ov'), v=$('#player-video');
  $('#player-title').textContent=title||'';
  $('#player-err').textContent='';
  try{v.pause();}catch(e){}
  try{if(hlsInst){hlsInst.destroy();hlsInst=null;}}catch(e){}
  v.removeAttribute('src'); v.load();
  [...v.querySelectorAll('track')].forEach(t=>t.remove());
  ov.classList.add('open');
  if(/\.m3u8($|\?)/i.test(url)&&window.Hls&&Hls.isSupported()){
    hlsInst=new Hls({maxBufferLength:30});
    hlsInst.on(Hls.Events.ERROR,function(e,d){if(d&&d.fatal){$('#player-err').textContent='Поток недоступен — попробуйте другой источник';}});
    hlsInst.loadSource(url); hlsInst.attachMedia(v);
    v.play().catch(function(){});
  }else{
    if(/\.m3u8($|\?)/i.test(url)&&!v.canPlayType('application/vnd.apple.mpegurl')){$('#player-err').textContent='Браузер не играет HLS без hls.js — попробуйте другой источник';}
    v.src=url; v.play().catch(function(){});
  }
  if(subs&&subs.length){
    subs.forEach(function(s,i){
      let u=null,label=null,lang='ru';
      if(typeof s==='string')u=s;
      else if(s&&s.url){u=s.url;label=s.label||s.name||'';lang=s.lang||s.language||'ru';}
      if(!u)return;
      const tr=document.createElement('track');
      tr.kind='subtitles'; tr.label=label||('Субтитры '+(i+1)); tr.srclang=String(lang).slice(0,2); tr.src=u; if(i===0)tr.default=true;
      v.appendChild(tr);
    });
  }
  if(detectTV()){const c=$('#player-close');if(c)setFocus(c);}
}
function closeBuiltInPlayer(){const ov=$('#player-ov');if(!ov.classList.contains('open'))return;const v=$('#player-video');try{v.pause();}catch(e){}try{if(hlsInst){hlsInst.destroy();hlsInst=null;}}catch(e){}v.removeAttribute('src');v.load();[...v.querySelectorAll('track')].forEach(t=>t.remove());ov.classList.remove('open');}

/* ============ Filmix (порт из pawflix) ============ */
function fxUid(){let u=localStorage.getItem('prostokino.fx_uid');if(!u){u=Math.random().toString(36).slice(2,10)+Date.now().toString(36);localStorage.setItem('prostokino.fx_uid',u);}return u;}
function fxToken(){return getS('prostokino.filmix_token');}
function fxProxy(){return getS('prostokino.filmix_proxy')||FX_PROXY_DEFAULT;}
function fxTokenQS(){return 'app_lang=ru_RU&user_dev_apk=2.2.13&user_dev_id='+encodeURIComponent(fxUid())+'&user_dev_name=Xiaomi+24069PC21G&user_dev_os=12&user_dev_token='+encodeURIComponent(fxToken())+'&user_dev_vendor=Xiaomi';}
function fxBuildUrl(path,extra){
  const target='http://filmixapp.vip/api/v2/'+path+'?'+fxTokenQS()+(extra?'&'+extra:'');
  const px=fxProxy();
  if(/[?&](quest|url)=$/.test(px)) return px+encodeURIComponent(target);
  return px.replace(/\/+$/,'')+'/'+target;
}
async function fxGet(path,extra){const r=await fetch(fxBuildUrl(path,extra));if(!r.ok)throw new Error('HTTP '+r.status);return r.json();}
function fxNorm(s){return String(s||'').toLowerCase().replace(/[^a-zа-я0-9]/g,'');}
function fxQualities(link,maxQ){const m=String(link||'').match(/\[([\d,\s]*)\]/);if(!m)return [];return m[1].split(',').map(q=>parseInt(q,10)).filter(q=>q>0&&q<=maxQ);}
function fxFileUrl(link,q){return String(link).replace(/_\[([\d,\s]*)\]\.mp4/i,'_'+q+'.mp4').replace('%s.mp4',q+'.mp4').replace(/^http:\/\//i,'https://');}
function fxBlocked(name){return typeof name==='string'&&name.toLowerCase().indexOf('заблокировано ')===0;}
function fxCleanVoice(tr){
  const s=String(tr||'Озвучка');
  const m=s.match(/^(.*?)\s*\[([^\]]*)\]\s*$/);
  if(!m) return {name:s,studio:''};
  const toks=m[2].split(',').map(t=>t.trim()).filter(t=>t&&!/^(4k|2160p?|1080p?|720p?|480p?|sdr|hdr\d*\+?|dolby.*|dts.*|ru|rus|ukr|uk|en|eng)$/i.test(t));
  let name=m[1].replace(/:\s*$/,'').trim();
  if(!name){name=toks[0]||'Озвучка';toks=toks.slice(1);}
  return {name:name,studio:toks.join(' · ')};
}
function fxMatch(json,meta){
  if(!Array.isArray(json)||!json.length) return null;
  const year=parseInt(String(meta.year||'').slice(0,4))||0;
  const orig=meta.orig||'';
  const cards=json.filter(function(c){
    const y=parseInt(c.year||String(c.alt_name||'').split('-').pop());
    return y>year-2&&y<year+2;
  });
  let card=null;
  for(let i=0;i<cards.length;i++){if(cards[i].year==year&&fxNorm(cards[i].original_title)===fxNorm(orig)){card=cards[i];break;}}
  if(!card){for(let j=0;j<cards.length;j++){if(fxNorm(cards[j].original_title)===fxNorm(orig)){card=cards[j];break;}}}
  if(!card&&cards.length===1) card=cards[0];
  return card;
}
function fxIsSerial(pl){return pl&&pl.playlist&&typeof pl.playlist==='object'&&!Array.isArray(pl.playlist)&&Object.keys(pl.playlist).length>0;}
function fxSeasonLabel(sKey){return String(sKey)==='-1'?'1':String(sKey);}
async function openFilmix(meta,tile,run){
  if(!fxToken()){srcStatus('Filmix: не настроен — введите токен в Настройках.',true);return;}
  setTileBusy(tile,true); srcStatus('Проверяю подписку Filmix…');
  let maxQ=720;
  try{
    const prof=await fxGet('user_profile');
    const ud=prof&&prof.user_data;
    if(ud){if(ud.is_pro_plus)maxQ=2160;else if(ud.is_pro)maxQ=1080;}
  }catch(e){}
  if(run!==srcRun){setTileBusy(tile,false);return;}
  try{
    srcStatus('Ищу на Filmix…');
    const res=await fxGet('search','story='+encodeURIComponent(meta.orig||meta.title||''));
    if(run!==srcRun){setTileBusy(tile,false);return;}
    const card=fxMatch(res,meta);
    if(card){fxOpenCard(card.id,maxQ,meta,tile,run);return;}
    if(Array.isArray(res)&&res.length){
      setTileBusy(tile,false); srcStatus('');
      showPicker('Уточните, что именно',res.slice(0,12).map(c=>({label:(c.title||c.original_title||'Вариант')+(c.year?' · '+c.year:''),onPick:()=>{setTileBusy(tile,true);fxOpenCard(c.id,maxQ,meta,tile,++srcRun);}})));
      return;
    }
    setTileBusy(tile,false); srcStatus('На Filmix ничего не нашлось.',true);
  }catch(e){
    setTileBusy(tile,false); srcStatus('Не получилось связаться с Filmix. Проверьте токен и CORS-прокси в Настройках.',true);
  }
}
async function fxOpenCard(fid,maxQ,meta,tile,run){
  try{
    const data=await fxGet('post/'+fid);
    if(run!==srcRun){setTileBusy(tile,false);return;}
    const pl=data&&data.player_links;
    if(pl&&pl.movie&&pl.movie.length){fxMovieVoices(pl.movie,maxQ,meta,tile,run);return;}
    if(fxIsSerial(pl)){fxSeriesFlow(pl.playlist,maxQ,meta,tile,run);return;}
    setTileBusy(tile,false); srcStatus('Видео не найдено.',true);
  }catch(e){
    setTileBusy(tile,false); srcStatus('Ошибка загрузки.',true);
  }
}
function fxMovieVoices(list,maxQ,meta,tile,run){
  const items=[];
  list.forEach(function(f){
    if(!f||!f.link||fxBlocked(f.translation))return;
    const qs=fxQualities(f.link,maxQ);
    if(!qs.length)return;
    items.push({voice:f.translation||'Озвучка',link:f.link,qs:qs,q:Math.max.apply(null,qs)});
  });
  if(!items.length){setTileBusy(tile,false);srcStatus('Видео не найдено.',true);return;}
  setTileBusy(tile,false); srcStatus('');
  showPicker('Озвучка',items.map(it=>{
    const cl=fxCleanVoice(it.voice);
    return {label:cl.name,sub:(cl.studio?cl.studio+' · ':'')+it.q+'p',onPick:()=>{
      if(it.qs.length<=1){playUrl(fxFileUrl(it.link,it.q),meta.title);return;}
      showPicker('Качество',it.qs.slice().sort((a,b)=>b-a).map(q=>({label:q+'p'+(q===it.q?' · максимум':''),onPick:()=>playUrl(fxFileUrl(it.link,q),meta.title)})),true);
    }};
  }),true);
}
function fxSeriesFlow(playlist,maxQ,meta,tile,run){
  const seasons=Object.keys(playlist).sort((a,b)=>parseInt(a,10)-parseInt(b,10));
  setTileBusy(tile,false); srcStatus('');
  showPicker('Сезон',seasons.map(sk=>({label:'Сезон '+fxSeasonLabel(sk),onPick:()=>{
    const epsMap={};
    const voices=playlist[sk];
    Object.keys(voices||{}).forEach(function(vn){
      const eps=voices[vn];
      Object.keys(eps||{}).forEach(function(epId){
        const f=eps[epId]; if(!f||!f.link)return;
        let epNum=parseInt(epId,10);
        const m=String(f.link).match(/s(\d+)e(\d+?)_\d+\.mp4/i);
        if(m) epNum=parseInt(m[2],10);
        if(!epNum||isNaN(epNum)) return;
        const qs=(Array.isArray(f.qualities)?f.qualities.map(q=>parseInt(q,10)):fxQualities(f.link,maxQ)).filter(q=>q>0&&q<=maxQ);
        if(!qs.length)return;
        if(!epsMap[epNum]) epsMap[epNum]=[];
        epsMap[epNum].push({voice:vn,link:f.link,qs:qs,q:Math.max.apply(null,qs)});
      });
    });
    const epNums=Object.keys(epsMap).map(n=>parseInt(n,10)).sort((a,b)=>a-b);
    if(!epNums.length){srcStatus('Видео не найдено.',true);return;}
    showPicker('Серия',epNums.map(en=>({label:'Серия '+en,onPick:()=>{
      const vs=epsMap[en];
      if(vs.length===1){const v=vs[0];fxQualityPick(v,meta);return;}
      showPicker('Озвучка',vs.map(v=>{const cl=fxCleanVoice(v.voice);return {label:cl.name,sub:(cl.studio?cl.studio+' · ':'')+v.q+'p',onPick:()=>fxQualityPick(v,meta)};}),true);
    }})));
  }})));
}
function fxQualityPick(v,meta){
  if(v.qs.length<=1){playUrl(fxFileUrl(v.link,v.q),meta.title);return;}
  showPicker('Качество',v.qs.slice().sort((a,b)=>b-a).map(q=>({label:q+'p'+(q===v.q?' · максимум':''),onPick:()=>playUrl(fxFileUrl(v.link,q),meta.title)})),true);
}

/* ============ Alpac (порт из «Кино») ============ */
function alpacUid(){let u=localStorage.getItem('prostokino.alpac_uid');if(!/^[0-9a-f]{12}$/.test(u||'')){u=Array.from({length:6},()=>Math.floor(Math.random()*256).toString(16).padStart(2,'0')).join('');localStorage.setItem('prostokino.alpac_uid',u);}return u;}
function alpacToken(){return getS('prostokino.alpac_token');}
function alpacHeaders(){const t=alpacToken();return t?{'X-Alpac-Token':t,'X-Lampac-Token':t}:{};}
function alpacAuthQS(){return 'uid='+alpacUid()+(alpacToken()?'&token='+encodeURIComponent(alpacToken()):'');}
function alpacParams(m){return 'id='+encodeURIComponent(String(m.id))+'&title='+encodeURIComponent(m.title)+'&original_title='+encodeURIComponent(m.orig)+'&serial='+(m.type==='tv'?1:0)+'&year='+encodeURIComponent(m.year)+'&source=tmdb&rchtype=';}
function alpacAbs(u){return /^https?:\/\//i.test(u)?u:ALPAC+'/'+u.replace(/^\/+/,'');}
async function alpacFetchJson(url){const r=await fetch(url,{headers:alpacHeaders()});if(!r.ok)throw new Error('HTTP '+r.status);return r.json();}
async function alpacFetchText(url){const r=await fetch(url,{headers:alpacHeaders()});if(!r.ok)throw new Error('HTTP '+r.status);return r.text();}
function alpacSaveToken(j){const t=j&&(j.token||j.access_token||j.auth_token||(j.data&&j.data.token));if(t){setS('prostokino.alpac_token',t);return true;}return false;}
/* Привязка Alpac по QR (порт из «Кино»: accsdb → QR + поллинг tg/auth/check) */
let alpAuthPoll=null, alpAuthCtx=null;
function stopAlpacPoll(){if(alpAuthPoll){clearInterval(alpAuthPoll);alpAuthPoll=null;}}
function alpacQrSrc(q){if(!q)return '';if(/^data:/i.test(q)||/^https?:\/\//i.test(q))return q;return alpacAbs(q);}
function showAlpacAuth(er,meta,tile){
  stopAlpacPoll();
  alpAuthCtx={meta:meta,tile:tile,code:er.code||''};
  setTileBusy(tile,false); srcStatus('');
  $('#alp-title').textContent=meta.title||'Alpac';
  const qr=$('#alp-qr');
  if(er.qr){qr.src=alpacQrSrc(er.qr);qr.style.display='block';}else qr.style.display='none';
  $('#alp-code').textContent=er.code||'';
  $('#alp-msg').innerHTML='Отправь этот код боту <b>'+esc(er.bot||'@go_lampa_testbot')+'</b> в Telegram<br>или просто сканируй QR';
  const stT=$('#alp-status-t');
  if(!er.code&&!er.qr){stT.textContent='Не удалось получить код привязки — нажми «Обновить код».';showScreen('alpac-auth');return;}
  stT.textContent='Жду подтверждения…';
  showScreen('alpac-auth');
  const code=er.code||'';
  alpAuthPoll=setInterval(async ()=>{
    if(currentScreen!=='alpac-auth'||!alpAuthCtx||alpAuthCtx.code!==code){stopAlpacPoll();return;}
    try{
      const r=await fetch(ALPAC+'/tg/auth/check?code='+encodeURIComponent(code));
      if(!r.ok) return;
      const j=await r.json();
      if(!j||currentScreen!=='alpac-auth'){stopAlpacPoll();return;}
      if(j.status==='approved'&&j.token){
        stopAlpacPoll();
        alpacSaveToken(j);
        stT.textContent='Alpac подключён ✓';
        const ctx=alpAuthCtx; alpAuthCtx=null;
        setTimeout(()=>{if(ctx&&currentScreen==='alpac-auth'){goBack();openAlpac(ctx.meta,ctx.tile,++srcRun);}},900);
      }else if(j.status==='claimed'){
        stT.textContent='Код принят, жду одобрения…';
      }else if(j.status==='rejected'){
        stopAlpacPoll();
        stT.textContent='Запрос отклонён администратором';
      }else if(j.status==='expired'){
        stopAlpacPoll();
        const ctx=alpAuthCtx; alpAuthCtx=null;
        if(ctx) openAlpac(ctx.meta,ctx.tile,++srcRun);
      }
    }catch(e){}
  },3000);
}
function alpacBestQ(q){
  if(!q||typeof q!=='object')return '';
  const keys=Object.keys(q); if(!keys.length)return '';
  let bestN=-1,bestV='';
  keys.forEach(function(k){const m=String(k).match(/(\d{3,4})/);const n=m?parseInt(m[1],10):-1;if(n>=bestN){bestN=n;bestV=q[k];}});
  return bestV||q[keys[0]]||'';
}
function alpacParseItems(html){
  const doc=new DOMParser().parseFromString(html,'text/html');
  const items=[], buttons=[];
  doc.querySelectorAll('.videos__item[data-json]').forEach(function(el){
    let j=null; try{j=JSON.parse(el.getAttribute('data-json'));}catch(e){return;}
    const s=el.getAttribute('s'), e=el.getAttribute('e');
    items.push({method:j.method||'play',url:String(j.url||''),title:((el.textContent||'').trim().replace(/\s+/g,' ').slice(0,140)||j.title||'Смотреть'),season:s!==null?+s:null,episode:e!==null?+e:null,quality:(j.quality&&typeof j.quality==='object')?j.quality:null,voice:j.translate||''});
  });
  doc.querySelectorAll('.videos__button[data-json]').forEach(function(el){
    let j=null; try{j=JSON.parse(el.getAttribute('data-json'));}catch(e){return;}
    buttons.push({title:(el.textContent||'').trim().replace(/\s+/g,' ').slice(0,90),url:j.url,active:el.classList.contains('active')});
  });
  return {items:items,buttons:buttons};
}
async function openAlpac(meta,tile,run){
  setTileBusy(tile,true); srcStatus('Ищу на Alpac…');
  try{
    let j=await alpacFetchJson(ALPAC+'/lite/events?life=true&'+alpacParams(meta)+'&'+alpacAuthQS());
    if(j&&j.accsdb){alpacSaveToken(j); j=await alpacFetchJson(ALPAC+'/lite/events?life=true&'+alpacParams(meta)+'&'+alpacAuthQS());}
    if(j&&j.accsdb){showAlpacAuth(j,meta,tile);return;}
    let arr=null;
    if(j&&j.life&&j.memkey){
      let best=[],stable=0;
      for(let i=0;i<24;i++){
        if(run!==srcRun){setTileBusy(tile,false);return;}
        const j3=await alpacFetchJson(ALPAC+'/lifeevents?memkey='+encodeURIComponent(j.memkey)+'&'+alpacAuthQS());
        if(j3&&j3.accsdb){showAlpacAuth(j3,meta,tile);return;}
        const list=Array.isArray(j3)?j3:(Array.isArray(j3.online)?j3.online:[]);
        if(list.length>best.length){best=list;stable=0;}else stable++;
        if(j3.ready||stable>=3)break;
        await new Promise(res=>setTimeout(res,1500));
      }
      arr=best;
    }else if(Array.isArray(j)){arr=j;}
    if(arr&&arr.length){
      try{const j4=await alpacFetchJson(ALPAC+'/tg/auth/status?uid='+alpacUid());if(j4&&j4.authorized&&j4.token)setS('prostokino.alpac_token',j4.token);}catch(e){}
    }
    if(run!==srcRun){setTileBusy(tile,false);return;}
    if(currentScreen==='alpac-auth') goBack();
    const srcs=(arr||[]).filter(s=>s&&s.show!==false&&s.url);
    if(!srcs.length){setTileBusy(tile,false);srcStatus('На Alpac ничего не нашлось.',true);return;}
    setTileBusy(tile,false); srcStatus('');
    if(srcs.length===1){alpacLoadSource(srcs[0],meta,tile,++srcRun);return;}
    showPicker('Источник',srcs.map(s=>({label:s.name||'Источник',sub:s.balanser||'',onPick:()=>{setTileBusy(tile,true);alpacLoadSource(s,meta,tile,++srcRun);}})));
  }catch(e){
    setTileBusy(tile,false); srcStatus('Не получилось связаться с Alpac.',true);
  }
}
async function alpacLoadSource(s,meta,tile,run){
  try{
    const base=alpacAbs(s.url);
    const url=base+(base.indexOf('?')>=0?'&':'?')+alpacParams(meta)+'&'+alpacAuthQS();
    const html=await alpacFetchText(url);
    if(run!==srcRun){setTileBusy(tile,false);return;}
    let acc=null;
    if(html.indexOf('accsdb')>=0){try{const j=JSON.parse(html);if(j&&j.accsdb)acc=j;}catch(e){}}
    if(acc){showAlpacAuth(acc,meta,tile);return;}
    const parsed=alpacParseItems(html);
    const videos=parsed.items.filter(it=>it.method==='play'||it.method==='call'||it.method==='iframe');
    if(videos.length){
      if(parsed.buttons.length){
        setTileBusy(tile,false); srcStatus('');
        showPicker('Озвучка',parsed.buttons.map(b=>({label:b.title,onPick:()=>{setTileBusy(tile,true);alpacFollowVoice(b.url,meta,tile,++srcRun);}})));
        return;
      }
      if(meta.type==='tv'){
        const eps=videos.map((v,i)=>({v:v,num:(v.episode&&v.episode>0)?v.episode:(i+1)}));
        setTileBusy(tile,false); srcStatus('');
        showPicker('Серия',eps.map(e=>({label:'Серия '+e.num+(e.v.title&&e.v.title!=='Смотреть'?' · '+e.v.title:''),onPick:()=>alpacResolve(e.v,meta,tile)})));
        return;
      }
      setTileBusy(tile,false); srcStatus('');
      showPicker('Озвучка',videos.map(v=>({label:(v.voice||v.title||'Смотреть'),onPick:()=>alpacResolve(v,meta,tile)})));
      return;
    }
    const links=parsed.items.filter(it=>it.method==='link');
    if(links.length===1){alpacFollowVoice(links[0].url,meta,tile,run);return;}
    if(parsed.items.length){
      setTileBusy(tile,false); srcStatus('');
      showPicker('Сезон',parsed.items.map(it=>{const m=String(it.title||'').match(/\d+/);return {label:(m?m[0]+' сезон':it.title||'Сезон'),onPick:()=>{setTileBusy(tile,true);alpacFollowVoice(it.url,meta,tile,++srcRun);}};}));
      return;
    }
    setTileBusy(tile,false); srcStatus('На Alpac ничего не нашлось.',true);
  }catch(e){
    setTileBusy(tile,false); srcStatus('Не получилось связаться с Alpac.',true);
  }
}
async function alpacFollowVoice(url,meta,tile,run){
  try{
    const base=alpacAbs(url);
    const full=base+(base.indexOf('?')>=0?'&':'?')+alpacParams(meta)+'&'+alpacAuthQS();
    const html=await alpacFetchText(full);
    if(run!==srcRun){setTileBusy(tile,false);return;}
    const parsed=alpacParseItems(html);
    const videos=parsed.items.filter(it=>it.method==='play'||it.method==='call'||it.method==='iframe');
    if(!videos.length){setTileBusy(tile,false);srcStatus('На Alpac ничего не нашлось.',true);return;}
    if(meta.type==='tv'){
      const eps=videos.map((v,i)=>({v:v,num:(v.episode&&v.episode>0)?v.episode:(i+1)}));
      setTileBusy(tile,false); srcStatus('');
      showPicker('Серия',eps.map(e=>({label:'Серия '+e.num+(e.v.title&&e.v.title!=='Смотреть'?' · '+e.v.title:''),onPick:()=>alpacResolve(e.v,meta,tile)})));
      return;
    }
    setTileBusy(tile,false); srcStatus('');
    showPicker('Озвучка',videos.map(v=>({label:(v.voice||v.title||'Смотреть'),onPick:()=>alpacResolve(v,meta,tile)})));
  }catch(e){
    setTileBusy(tile,false); srcStatus('Не получилось связаться с Alpac.',true);
  }
}
async function alpacResolve(it,meta,tile){
  setTileBusy(tile,true);
  try{
    if(it.method==='play'){const url=(it.quality?alpacBestQ(it.quality):'')||it.url;setTileBusy(tile,false);playUrl(url,meta.title);return;}
    if(it.method==='iframe'){setTileBusy(tile,false);openIframeOverlay(it.url);return;}
    const base=alpacAbs(it.url);
    const full=base+(base.indexOf('?')>=0?'&':'?')+alpacAuthQS();
    const j=await alpacFetchJson(full);
    if(j&&j.accsdb){showAlpacAuth(j,meta,tile);return;}
    if(j&&j.method==='iframe'&&j.url){setTileBusy(tile,false);openIframeOverlay(j.url);return;}
    if(j&&j.url){setTileBusy(tile,false);playUrl(j.url,meta.title,j.subtitles||[]);return;}
    setTileBusy(tile,false); srcStatus('На Alpac ничего не нашлось.',true);
  }catch(e){
    setTileBusy(tile,false); srcStatus('Не получилось связаться с Alpac.',true);
  }
}

/* ============ Торренты (порт из «Кино»/pawflix) ============ */
function torQmode(){return getS('prostokino.tor_qmode')||'orig_ru_year';}
function torQuery(m){
  const ru=m.title||'', orig=m.orig||'', y=m.year||'';
  const parts=[];
  const push=function(){for(let i=0;i<arguments.length;i++){const p=arguments[i];if(p&&parts.indexOf(p)<0)parts.push(p);}};
  switch(torQmode()){
    case 'orig': push(orig,ru); break;
    case 'orig_year': push(orig,y,ru); break;
    case 'orig_ru': push(orig,ru); break;
    case 'ru': push(ru); break;
    case 'ru_year': push(ru,y); break;
    case 'ru_orig': push(ru,orig); break;
    case 'ru_orig_year': push(ru,orig,y); break;
    default: push(orig,ru,y); break;
  }
  return parts.join(' ');
}
function torIsSeriesTitle(t){
  const s=String(t||'');
  return /s\d+\s*e\d+/i.test(s)||/\[\s*s?\d+\s*\]/i.test(s)||/\d+\s*сезон/i.test(s)||/сериал/i.test(s)||/\d+\s*[-–—]\s*\d+\s*из\s*\d+/i.test(s)||/\(\s*\d+\s*сезон\s*\)/i.test(s)||/\d+\s*[-–]\s*\d+\s*сер/i.test(s);
}
function torYearOK(t,year){
  if(!year) return true;
  const m=String(t||'').match(/(19|20)\d{2}/g);
  if(!m) return true;
  return m.some(y=>+y===+year);
}
/* v0.6: разбор раздач как в «Кино» + золотой акцент премиум-фич */
function torParse(title){
  const s=title||'', sl=s.toLowerCase();
  let res=0;
  if(/2160p|\b4k\b|uhd/.test(sl)) res=2160;
  else if(/1080p|\b1080i\b/.test(sl)) res=1080;
  else if(/720p/.test(sl)) res=720;
  let hdr=null;
  if(/dolby.?vision|\bdv\b|dovi/.test(sl)) hdr='DV';
  else if(/hdr10\+/.test(sl)) hdr='HDR10+';
  else if(/(?<![\p{L}\p{N}])hdr(?![\p{L}\p{N}])/iu.test(s)) hdr='HDR10';
  let audio=null;
  const tok=function(re){return new RegExp('(?<![\\p{L}\\p{N}])'+re+'(?![\\p{L}\\p{N}])','iu').test(s);};
  if(/дубляж/i.test(s)||tok('дб')) audio='Дубляж';
  else if(/многоголос/i.test(s)||tok('пм')) audio='Многоголосый';
  else if(/любитель/i.test(s)) audio='Любительский';
  const subs=/субтитр/i.test(s)||tok('ст');
  const gold=[];
  if(res===2160) gold.push('4K');
  if(/dolby.?vision|\bdv\b|dovi/.test(sl)) gold.push('Dolby Vision');
  else if(/hdr10\+/.test(sl)) gold.push('HDR10+');
  else if(/(?<![\p{L}\p{N}])hdr(?![\p{L}\p{N}])/iu.test(s)) gold.push('HDR');
  if(/dolby.?atmos|\batmos\b/.test(sl)) gold.push('Atmos');
  const premium=res===2160||/dolby.?vision|\bdv\b|dovi/.test(sl);
  return {res:res,hdr:hdr,audio:audio,subs:subs,gold:gold,premium:premium};
}
function torScore(t){
  const p=torParse(t.title);
  let s=p.res===2160?100:p.res===1080?70:p.res===720?40:10;
  if(p.hdr==='DV') s+=30; else if(p.hdr) s+=18;
  if(p.audio==='Дубляж') s+=15; else if(p.audio==='Многоголосый') s+=8;
  if(p.subs) s+=5;
  s+=Math.min(t.seeders||0,200)*0.2;
  return Math.round(s);
}
function torQuality(t){
  const s=(t||'').toLowerCase();
  if(/2160p|\b4k\b|uhd/.test(s)) return 4;
  if(/1080p/.test(s)) return 3;
  if(/720p/.test(s)) return 2;
  if(/hdtv|dvd|bdrip|web-?dl|blu-?ray/.test(s)) return 1;
  return 0;
}
function torNiceTitle(t,m){
  const raw=t.title||'';
  const name=((m&&m.title)||'').trim()||raw;
  if(m&&m.type==='tv'){
    let season=null,ep1=null,ep2=null,mm;
    mm=raw.match(/[Ss](\d{1,2})[Ee](\d{1,3})/);
    if(mm){season=+mm[1];ep1=ep2=+mm[2];}
    if(season==null){
      mm=raw.match(/\[s(\d{1,2})\]/i)||raw.match(/\bs(\d{1,2})\b/i)||raw.match(/сезон\s*:\s*(\d{1,2})/i)||raw.match(/(\d{1,2})\s*сезон/i);
      if(mm) season=+mm[1];
    }
    mm=raw.match(/\[(\d{1,3})\s*[-–]\s*(\d{1,3})\s*из\s*\d{1,3}\]/i)||raw.match(/\((\d{1,3})\s*[-–]\s*(\d{1,3})\s*сери[яйи]/i)||raw.match(/(\d{1,3})\s*[-–]\s*(\d{1,3})\s*сери[яйи]/i)||raw.match(/серии\s*:\s*(\d{1,3})\s*[-–]\s*(\d{1,3})/i);
    if(mm){ep1=+mm[1];ep2=+mm[2];}
    let s=name;
    if(season!=null) s+=' · Сезон '+season;
    if(ep1!=null) s+=ep1===ep2?' · Серия '+ep1:' · Серии '+ep1+'–'+ep2;
    return s;
  }
  const y=(m&&m.year)?m.year:((raw.match(/\b((?:19|20)\d{2})\b/)||[])[1]);
  return y?name+' ('+y+')':name;
}
function torPills(t,isTop){
  const p=torParse(t.title), out=[];
  if(isTop) out.push('<span class="tpill top">★ Рекомендую</span>');
  p.gold.forEach(function(g){out.push('<span class="tpill gold">'+esc(g)+'</span>');});
  if(p.res) out.push('<span class="tpill res">'+p.res+'p</span>');
  if(p.audio) out.push('<span class="tpill au">'+esc(p.audio)+'</span>');
  if(p.subs) out.push('<span class="tpill sub">Субтитры</span>');
  return out.length?'<span class="tor-pills">'+out.join('')+'</span>':'';
}
const TOR_SORTS=[{id:'top',t:'Топ'},{id:'seeds',t:'Сиды'},{id:'quality',t:'Качество'},{id:'size',t:'Размер'}];
const TOR_QMODES=[
  {id:'orig',t:'Оригинал'},{id:'orig_year',t:'Оригинал + Год'},{id:'orig_ru',t:'Оригинал + Русский'},{id:'orig_ru_year',t:'Оригинал + Русский + Год'},
  {id:'ru',t:'Русский'},{id:'ru_year',t:'Русский + Год'},{id:'ru_orig',t:'Русский + Оригинал'},{id:'ru_orig_year',t:'Русский + Оригинал + Год'}
];
function torSortName(id){const f=TOR_SORTS.find(x=>x.id===id);return f?f.t:'Топ';}
function torQmodeName2(id){const f=TOR_QMODES.find(x=>x.id===id);return f?f.t:'Оригинал + Русский + Год';}
function torSortedList(arr,sortKey){
  const a=arr.slice();
  if(sortKey==='size') a.sort((x,y)=>(y.size||0)-(x.size||0));
  else if(sortKey==='quality') a.sort((x,y)=>(torQuality(y.title)-torQuality(x.title))||((y.seeders||0)-(x.seeders||0)));
  else if(sortKey==='top') a.sort((x,y)=>torScore(y)-torScore(x));
  else a.sort((x,y)=>(y.seeders||0)-(x.seeders||0));
  return a;
}
function plural(n,one,few,many){const a=Math.abs(n)%100,b=a%10;if(a>10&&a<20)return many;if(b>1&&b<5)return few;if(b===1)return one;return many;}
function jacBase(){return getS('prostokino.jac_url')||'https://jac.red';}
function jacKey(){return getS('prostokino.jac_key');}
function jacConfigured(){
  const base=jacBase(), key=jacKey();
  return !!(key||(base&&base!=='https://jac.red'));
}
function jacQueryURL(base,key,q){
  return base.replace(/\/+$/,'')+'/api/v2.0/indexers/all/results?Query='+encodeURIComponent(q)+(key?'&apikey='+encodeURIComponent(key):'');
}
function tsUrl(){return getS('prostokino.ts_url');}
function tsUrlHttp(){return getS('prostokino.ts_url_http');}
function tsBase(){
  const h=tsUrlHttp().replace(/\/+$/,'');
  if(h){
    if(/^https:\/\//i.test(h)||h.indexOf(TS_PROXY)===0) return h;
    const u=h.replace(/^(https?:\/\/)(\d{1,3}(?:\.\d{1,3}){3})(:\d+)?/i,function(m,p,ip,port){return p+ip+'.nip.io'+(port||'');});
    return TS_PROXY+'/'+u;
  }
  return tsUrl().replace(/\/+$/,'')||'http://127.0.0.1:8090';
}
async function tsAPI(body){
  const r=await fetch(tsBase()+'/torrents',{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(body)});
  if(!r.ok)throw new Error('HTTP '+r.status);
  return r.json();
}
function tsStreamURL(ts,link,idx,name){
  return ts+'/stream/'+encodeURIComponent(name||'video')+'?link='+encodeURIComponent(link)+'&index='+idx+'&play';
}
/* v0.6: экран раздач как в «Кино» */
let torState=null;
function torStatusMsg(msg,err){const el=$('#tor-status');if(el){el.textContent=msg||'';el.classList.toggle('err',!!err);}}
function playStatus(msg,err){if(currentScreen==='tor') torStatusMsg(msg,err); else srcStatus(msg,err);}
async function openTorrent(meta,tile,run){
  torState={meta:meta,run:run,list:[],sort:'top',query:torQuery(meta)};
  showScreen('tor');
  $('#tor-title').textContent=meta.title||'';
  const mp=[];
  if(meta.rating) mp.push('★ '+Number(meta.rating).toFixed(1));
  if(meta.year) mp.push(meta.year);
  if(meta.dur) mp.push(meta.dur);
  $('#tor-meta').innerHTML=mp.map(esc).join(' · ').replace('★','<span class="star">★</span>');
  $('#tor-best').style.display='none';
  $('#tor-sub').textContent='';
  $('#tor-frame').style.display='none';
  $('#tor-list').innerHTML='';
  $('#tor-empty').style.display='none';
  $('#tor-sort-v').textContent='Топ';
  $('#tor-qmode-v').textContent=torQmodeName2(torQmode());
  if(!jacConfigured()){
    torStatusMsg('Торренты: парсеры не настроены — добавьте адрес и ключ в Настройках.',true);
    $('#tor-empty').textContent='Парсеры не настроены.'; $('#tor-empty').style.display='block';
    return;
  }
  await torSearch(true);
}
async function torSearch(focusFirst){
  const st=torState; if(!st) return;
  const meta=st.meta, run=st.run;
  torStatusMsg('Ищу раздачи…');
  $('#tor-frame').style.display='none'; $('#tor-list').innerHTML='';
  $('#tor-empty').style.display='none';
  st.query=torQuery(meta);
  try{
    const base=jacBase(), key=jacKey();
    if(location.protocol==='https:'&&/^http:\/\//i.test(base)){
      torStatusMsg('Парсеры: '+base.replace(/^https?:\/\//,'').split('/')[0]+' — http-адрес заблокирован на https-странице',true);
      $('#tor-empty').textContent='Парсер заблокирован.'; $('#tor-empty').style.display='block';
      return;
    }
    const r=await fetch(jacQueryURL(base,key,st.query));
    if(!r.ok) throw new Error('HTTP '+r.status);
    const j=await r.json();
    let res=(j.Results||[]).filter(x=>x.MagnetUri).map(x=>({title:x.Title,magnet:x.MagnetUri,seeders:x.Seeders||0,size:x.Size||0,tracker:x.Tracker||''}));
    if(meta.type==='movie') res=res.filter(t=>!torIsSeriesTitle(t.title)&&torYearOK(t.title,meta.year));
    if(run!==srcRun) return;
    st.list=res;
    torStatusMsg('');
    torRender(!!focusFirst);
  }catch(e){
    torStatusMsg('Парсеры не отвечают · проверь адреса в Настройках'+(e&&e.message?' ('+e.message+')':''),true);
    $('#tor-empty').textContent='Парсеры не отвечают.'; $('#tor-empty').style.display='block';
  }
}
function torRender(focusFirst){
  const st=torState; if(!st) return;
  const meta=st.meta;
  const arr=torSortedList(st.list,st.sort);
  let best=null,bestScore=-1;
  st.list.forEach(function(t){const s=torScore(t);if(s>bestScore){bestScore=s;best=t;}});
  const bestBtn=$('#tor-best');
  if(best){bestBtn.style.display='flex';bestBtn.onclick=function(){torPlayCard(best,null);};} else bestBtn.style.display='none';
  $('#tor-sub').innerHTML=arr.length+' '+plural(arr.length,'раздача','раздачи','раздач')+(st.query?' · <b>'+esc(st.query)+'</b>':'');
  $('#tor-sort-v').textContent=torSortName(st.sort);
  $('#tor-qmode-v').textContent=torQmodeName2(torQmode());
  const frame=$('#tor-frame'), list=$('#tor-list'), empty=$('#tor-empty');
  if(!arr.length){frame.style.display='none';empty.textContent='Раздач не нашлось.';empty.style.display='block';return;}
  empty.style.display='none'; frame.style.display='block';
  list.innerHTML=arr.map(function(t){
    const i=st.list.indexOf(t);
    const p=torParse(t.title);
    return '<button class="tor-card focusable'+(p.premium?' premium':'')+'" data-i="'+i+'" title="'+esc(t.title).replace(/"/g,'&quot;')+'">'+
      '<span class="tor-t">'+esc(torNiceTitle(t,meta))+'</span>'+
      torPills(t,best&&t===best)+
      '<span class="tor-m"><span>'+fmtSize(t.size)+'</span><span class="seeds">● '+(t.seeders||0)+'</span><span class="trk">'+esc(t.tracker||'')+'</span></span></button>';
  }).join('');
  if(focusFirst&&detectTV()){const f=list.querySelector('.focusable');if(f)setFocus(f);}
}
function torPlayCard(t,cardEl){
  if(!t||!torState) return;
  if(cardEl) cardEl.classList.add('busy');
  const p=playTorrent(t,torState.meta,null);
  if(p&&p.finally) p.finally(function(){if(cardEl) cardEl.classList.remove('busy');});
}
async function playTorrent(t,meta,tile){
  setTileBusy(tile,true); playStatus('Подключаю TorrServer…');
  try{
    const ts=tsBase();
    const echo=await fetch(ts+'/echo',{cache:'no-store'});
    if(!echo.ok) throw new Error('echo');
    const added=await tsAPI({action:'add',link:t.magnet});
    const hash=String((added&&added.hash)||(added&&added.torrent&&added.torrent.hash)||'').toLowerCase();
    if(!hash) throw new Error('nohash');
    let files=null;
    for(let i=0;i<20;i++){
      const g=await tsAPI({action:'get',hash:hash});
      const tor=g&&(g.torrent||g);
      const list=(tor&&tor.file_stats)||(tor&&tor.files)||[];
      const vids=list.filter(f=>f&&(f.id!==undefined)&&/\.(mp4|mkv|avi|mov|webm|m4v|ts|m2ts|wmv|flv)$/i.test(f.path||f.name||'')).map(f=>({id:f.id,name:(f.path||f.name||'').split('/').pop(),size:f.size||f.length||0}));
      if(vids.length){files=vids;break;}
      await new Promise(res=>setTimeout(res,1500));
    }
    setTileBusy(tile,false); playStatus('');
    if(files&&files.length===1){
      playUrl(tsStreamURL(ts,hash,files[0].id,files[0].name||t.title),meta.title);
      return;
    }
    if(files&&files.length>1){
      files.sort((a,b)=>(b.size||0)-(a.size||0));
      showPicker('Файл',files.map(f=>({label:f.name,sub:f.size?fmtSize(f.size):'',onPick:()=>playUrl(tsStreamURL(ts,hash,f.id,f.name||t.title),meta.title)})));
      return;
    }
    playUrl(tsStreamURL(ts,t.magnet,1,t.title),meta.title);
  }catch(e){
    setTileBusy(tile,false); playStatus('TorrServer не отвечает · проверь адрес в Настройках.',true);
  }
}
$('#tor-back').addEventListener('click',goBack);
$('#tor-sort-pill').addEventListener('click',function(){
  if(!torState) return;
  showPicker('Сортировка',TOR_SORTS.map(function(s){return {label:s.t,onPick:function(){torState.sort=s.id;torRender(false);}};}));
});
$('#tor-qmode-pill').addEventListener('click',function(){
  if(!torState) return;
  const curQ=torQmode();
  showPicker('Режим поиска',TOR_QMODES.map(function(o){return {label:o.t+(o.id===curQ?' · текущий':''),onPick:function(){setS('prostokino.tor_qmode',o.id);torState.sort='top';torSearch(false);}};}));
});

(function(){
  var logo=document.getElementById('pk-logo');
  if(!logo) return;
  function play(){logo.classList.remove('go');void logo.offsetWidth;logo.classList.add('go');}
