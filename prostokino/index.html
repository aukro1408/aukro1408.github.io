<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Просто Кино</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:#0f0f14;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button{font-family:inherit;cursor:pointer}
button:focus,input:focus{outline:none}
/* Верхнее меню: мягкое свечение из файла Denis, белая пилюля убрана полностью */
.topmenu{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;gap:clamp(18px,4vw,44px);align-items:center;
  padding:1.1em 2em;background:linear-gradient(180deg,rgba(0,0,0,.75),rgba(0,0,0,0));overflow-x:auto;
  scrollbar-width:none}
.topmenu::-webkit-scrollbar{display:none}
.menu-btn{position:relative;flex:0 0 auto;background:transparent;border:0;color:rgba(255,255,255,.74);
  font-size:clamp(17px,3vw,25px);font-weight:400;padding:10px 0 13px;white-space:nowrap;
  text-shadow:0 0 8px rgba(255,255,255,.06);transition:color .3s ease,text-shadow .3s ease}
.menu-btn.active{color:#fff;font-weight:600;text-shadow:0 0 8px rgba(255,255,255,.18),0 0 18px rgba(255,255,255,.08)}
.menu-btn:hover,.menu-btn.focused{color:#fff;text-shadow:0 0 8px rgba(255,255,255,.25),0 0 16px rgba(255,255,255,.12)}
.menu-btn:after{content:"";position:absolute;left:25%;right:25%;bottom:3px;height:2px;border-radius:2px;
  background:rgba(255,255,255,.88);transform:scaleX(0);opacity:0;transition:transform .3s ease,opacity .3s ease;
  box-shadow:0 0 8px rgba(255,255,255,.22)}
.menu-btn.active:after,.menu-btn:hover:after,.menu-btn.focused:after{transform:scaleX(1);opacity:.7}
@media(prefers-reduced-motion:reduce){.menu-btn,.menu-btn:after{transition:none}}
/* Логотип pawflix в меню: lockup из файла Denis 1:1 (только логотип, не демо-сцена) */
.pk-logo{position:relative;z-index:1;display:flex;align-items:center;gap:.1em;font-size:calc(clamp(17px,3vw,25px) * 1.3);line-height:1;flex:none;cursor:pointer;margin-right:calc(.5em - clamp(18px,4vw,44px))}
.pk-logo .paw{width:1.15em;height:1.15em;flex:none;overflow:visible;filter:drop-shadow(0 .06em .18em rgba(66,133,244,.5))}
.pk-logo .word{display:flex;font-family:'Fredoka',system-ui,sans-serif;font-weight:600;letter-spacing:-.02em;padding-bottom:.04em}
.pk-logo .word span{display:inline-block;transform-origin:50% 100%;opacity:0}
.pk-logo .word .f{color:#b4d0fb}.pk-logo .word .f2{color:#8ab4f8}.pk-logo .word .f3{color:#6b9ff5}.pk-logo .word .f4{color:#4f8bf2}
.pk-logo .body,.pk-logo .toe,.pk-logo .tri,.pk-logo .ring,.pk-logo .dot{opacity:0}
.pk-logo.go .body{transform-box:fill-box;transform-origin:50% 100%;animation:stamp .95s cubic-bezier(.3,.7,.4,1) both .1s}
.pk-logo.go .toe{transform-box:fill-box;transform-origin:50% 100%;animation:splay .7s cubic-bezier(.3,1.5,.5,1) both calc(.78s + var(--k) * .06s),wig 5.5s ease-in-out infinite calc(4.2s + var(--k) * .16s)}
.pk-logo.go .tri{transform-box:fill-box;transform-origin:center;animation:tri .7s cubic-bezier(.3,1.5,.5,1) both 1.15s,beat 3.2s ease-in-out infinite 3s}
.pk-logo.go .ring{transform-box:fill-box;transform-origin:center;animation:ring .9s ease-out both .78s}
.pk-logo.go .dot{animation:burst .8s ease-out both .78s}
.pk-logo.go .word span{animation:lt .75s cubic-bezier(.3,1.5,.5,1) both calc(1.05s + var(--k) * .08s)}
@keyframes stamp{0%{transform:translateY(-.55em) scale(1.45);opacity:0}40%{opacity:1}68%{transform:translateY(0) scale(1.05,.92);opacity:1}84%{transform:scale(.98,1.03);opacity:1}100%{transform:none;opacity:1}}
@keyframes splay{from{transform:translate(var(--tx),var(--ty)) scale(.4);opacity:0}to{transform:none;opacity:1}}
@keyframes wig{0%,88%,100%{transform:none}91%{transform:translateY(-3px) rotate(-9deg)}95%{transform:translateY(0) rotate(4deg)}}
@keyframes tri{from{transform:scale(0) rotate(-60deg);opacity:1}to{transform:none;opacity:1}}
@keyframes beat{0%,70%,100%{transform:none}80%{transform:scale(1.14)}90%{transform:scale(.96)}}
@keyframes ring{from{transform:scale(.4);opacity:.7}to{transform:scale(7);opacity:0}}
@keyframes burst{from{transform:translate(0,0) scale(1);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
@keyframes lt{0%{opacity:0;transform:translateY(.5em) rotate(12deg) scale(.5)}60%{opacity:1;transform:translateY(-.09em) rotate(-3deg) scale(1.08)}100%{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.pk-logo .body,.pk-logo .toe,.pk-logo .tri,.pk-logo .word span{opacity:1!important}.pk-logo.go *{animation:none!important}}
body.phone .topmenu{padding:.9em 1em}
/* Экраны */
main{padding-top:0}
section.screen{display:none}
section.screen.show{display:block}
/* Hero: фон на весь экран, НЕ кликабелен, НЕ фокусируем */
.hero{position:relative;height:62vh;min-height:340px;overflow:hidden;background:#181820}
body.phone .hero{height:46vh;min-height:260px}
.hero img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.35),rgba(0,0,0,0) 30%,rgba(15,15,20,0) 55%,rgba(15,15,20,.92) 88%,#0f0f14)}
.hero-info{position:absolute;left:2em;bottom:2.2em;max-width:44em;z-index:2}
body.phone .hero-info{left:1em;right:1em;bottom:1.4em}
.hero-info h1{margin:0 0 .25em;font-size:3em;line-height:1.05;text-transform:uppercase}
body.phone .hero-info h1{font-size:1.8em}
.hero-meta{font-size:1.1em;color:#e8eaf0;margin-bottom:.5em}
.hero-meta .star{color:#ffb340}
.hero-overview{margin:0;color:#d5d8e0;font-size:1.05em;line-height:1.45;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.hero-dots{display:flex;gap:.45em;margin-top:1em}
.hero-dots span{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.35)}
.hero-dots span.on{background:#fff}
/* Ряды и широкие карточки: название ПОД карточкой */
.rows{padding:1em 2em 3em}
body.phone .rows{padding:.5em 1em 2em}
.row-title{font-size:1.4em;font-weight:700;margin:1.2em 0 .6em}
.row{display:flex;gap:1em;overflow-x:auto;padding:.4em .2em 1em;scrollbar-width:none;scroll-behavior:smooth}
.row::-webkit-scrollbar{display:none}
.card{flex:0 0 auto;width:320px;background:none;border:0;padding:0;text-align:left;color:#fff}
body.phone .card{width:78vw;max-width:380px}
.card .thumb{display:block;width:100%;aspect-ratio:16/9;border-radius:14px;overflow:hidden;
  background:#22222c;box-shadow:0 14px 30px rgba(0,0,0,.55),0 2px 8px rgba(0,0,0,.45);transition:transform .15s}
.card .thumb img{width:100%;height:100%;object-fit:cover;display:block}
.card .ctitle{display:block;margin-top:.55em;font-size:1.02em;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.focused .thumb{outline:3px solid #fff;outline-offset:3px;transform:scale(1.03)}
/* Маленькая пилюля «Ещё» в конце жанрового ряда — НЕ карточка */
.more-wrap{flex:0 0 auto;width:320px;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center}
body.phone .more-wrap{width:78vw;max-width:380px}
.more-pill{height:2.6em;padding:0 1.5em;border:0;border-radius:999px;background:#26262e;color:#fff;font-size:1em}
.more-pill.focused{background:#ff7a29}
/* Сетки */
.grid{display:grid;gap:1em;padding:1.5em 2em 3em}
body.tv .grid{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
body.phone .grid{grid-template-columns:1fr;padding:1em 1em 2em}
.grid .card{width:auto}
/* Полный список жанра: фиксированный фон-бэкдроп, карточки листаются поверх */
.list-bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:#0f0f14}
.list-bg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:blur(24px) saturate(1.2);transform:scale(1.12)}
.list-bg-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(15,15,20,.82),rgba(15,15,20,.88) 55%,rgba(15,15,20,.94))}
#screen-list .back-btn,#screen-list .loader,#screen-list .grid,#screen-list #list-more,#screen-list #list-sentinel{position:relative;z-index:1}
#list-sentinel{height:8px}
#list-more{text-align:center;padding:1em 2em 3em}
/* Плитки жанров */
.tiles{display:grid;gap:1em;padding:5.5em 2em 3em}
body.tv .tiles{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
body.phone .tiles{grid-template-columns:1fr 1fr;padding:5em 1em 2em}
.tile{background:#1e1e28;border:0;border-radius:16px;color:#fff;font-size:1.15em;padding:1.2em .5em;text-align:center}
.tile.focused{outline:3px solid #fff;outline-offset:2px}
/* Кнопки, поля, тексты */
.back-btn{margin:5em 0 0 2em;background:#26262e;border:0;border-radius:999px;color:#fff;font-size:1em;padding:.6em 1.4em}
body.phone .back-btn{margin:4.5em 0 0 1em}
.back-btn.focused{background:#ff7a29}
.fav-btn{background:#26262e;border:0;border-radius:999px;color:#fff;font-size:1.05em;padding:.7em 1.6em}
.fav-btn.in{background:#ff7a29}
.fav-btn.focused{outline:3px solid #fff;outline-offset:2px}
.save-btn{background:#ff7a29;border:0;border-radius:999px;color:#fff;font-size:1.05em;padding:.7em 1.8em}
.save-btn.focused{outline:3px solid #fff;outline-offset:2px}
.field{background:#1e1e28;border:1px solid #33333f;border-radius:12px;color:#fff;font-size:1.05em;padding:.8em 1em;width:min(28em,90vw)}
.field:focus{border-color:#ff7a29}
.hint{color:#9aa3b5;font-size:1.05em;line-height:1.5;padding:2em}
.empty{color:#9aa3b5;font-size:1.1em;padding:2em}
.loader{color:#9aa3b5;padding:1.5em 2em}
.settings,.searchbox{padding:6em 2em 3em}
body.phone .settings,body.phone .searchbox{padding:5em 1em 2em}
.settings h2,.searchbox h2{margin:0 0 .8em}
.rowline{display:flex;gap:.8em;flex-wrap:wrap;align-items:center}
.status{color:#8be9a4;margin-top:1em}
/* Экран фильма */
.detail{padding:0 0 3em}
.detail .backdrop{position:relative;height:56vh;min-height:300px;overflow:hidden;background:#181820}
body.phone .detail .backdrop{height:38vh}
.detail .backdrop img{width:100%;height:100%;object-fit:cover}
.detail .backdrop .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.3),rgba(0,0,0,0) 40%,rgba(15,15,20,.95) 90%,#0f0f14)}
.detail-info{padding:0 2em}
body.phone .detail-info{padding:0 1em}
.detail-info h1{margin:.2em 0 .3em;font-size:2.2em}
.detail-info .meta{color:#e8eaf0;margin-bottom:.8em}
.detail-info .meta .star{color:#ffb340}
.detail-info p{color:#d5d8e0;line-height:1.6;max-width:50em}
</style>
</head>
<body>
<header class="topmenu" id="menu">
<div class="pk-logo go" id="pk-logo" role="img" aria-label="Pawflix">
<svg class="paw" viewBox="0 0 120 120" aria-hidden="true">
<defs>
<linearGradient id="pk-g" gradientUnits="userSpaceOnUse" x1="8" y1="14" x2="112" y2="116"><stop offset="0" stop-color="#AECBFA"/><stop offset="1" stop-color="#3F7DF0"/></linearGradient>
<mask id="pk-m"><rect width="120" height="120" fill="#fff"/><path class="tri" d="M54 77L54 97L71.500 87Z" fill="#000" stroke="#000" stroke-width="4.500" stroke-linejoin="round"/></mask>
</defs>
<ellipse class="ring" cx="60" cy="112" rx="9" ry="3" fill="none" stroke="#8AB4F8" stroke-width="1.500"/>
<g fill="#8AB4F8">
<circle class="dot" cx="60" cy="108" r="2.200" style="--dx:-30px;--dy:-22px"/><circle class="dot" cx="60" cy="108" r="1.600" style="--dx:-46px;--dy:-4px"/><circle class="dot" cx="60" cy="108" r="2" style="--dx:-18px;--dy:-34px"/><circle class="dot" cx="60" cy="108" r="2.200" style="--dx:30px;--dy:-22px"/><circle class="dot" cx="60" cy="108" r="1.600" style="--dx:46px;--dy:-4px"/><circle class="dot" cx="60" cy="108" r="2" style="--dx:18px;--dy:-34px"/>
</g>
<g class="body" fill="url(#pk-g)">
<g class="toe" style="--k:0;--tx:20px;--ty:20px"><ellipse cx="19" cy="57" rx="10" ry="12.500" transform="rotate(-22 19 57)"/></g>
<g class="toe" style="--k:1;--tx:12px;--ty:26px"><ellipse cx="42" cy="32" rx="11.500" ry="14.500" transform="rotate(-8 42 32)"/></g>
<g class="toe" style="--k:2;--tx:-12px;--ty:26px"><ellipse cx="78" cy="32" rx="11.500" ry="14.500" transform="rotate(8 78 32)"/></g>
<g class="toe" style="--k:3;--tx:-20px;--ty:20px"><ellipse cx="101" cy="57" rx="10" ry="12.500" transform="rotate(22 101 57)"/></g>
<g mask="url(#pk-m)"><circle cx="41" cy="96" r="13"/><circle cx="79" cy="96" r="13"/><circle cx="60" cy="102" r="12"/><ellipse cx="60" cy="82" rx="26" ry="21"/></g>
</g>
</svg>
<div class="word" aria-hidden="true"><span style="--k:0">p</span><span style="--k:1">a</span><span style="--k:2">w</span><span class="f" style="--k:3">f</span><span class="f2" style="--k:4">l</span><span class="f3" style="--k:5">i</span><span class="f4" style="--k:6">x</span></div>
</div>
  <button class="menu-btn focusable active" data-screen="home">Главная</button>
  <button class="menu-btn focusable" data-screen="genres-movie">Фильмы</button>
  <button class="menu-btn focusable" data-screen="genres-tv">Сериалы</button>
  <button class="menu-btn focusable" data-screen="genres-anim">Мультфильмы</button>
  <button class="menu-btn focusable" data-screen="favs">Избранное</button>
  <button class="menu-btn focusable" data-screen="settings">Настройки</button>
  <button class="menu-btn focusable" data-screen="search">Поиск</button>
</header>
<main>
  <section class="screen show" id="screen-home">
    <div class="hero" id="hero">
      <img class="bg" id="hero-img" alt="">

      <div class="hero-info">

  <section class="screen" id="screen-detail">
    <div class="detail" id="detail-box"></div>

<script>
const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];
const LS_KEY='prostokino.tmdb_key', LS_FAV='prostokino.favs';
const TMDB='https://api.themoviedb.org/3', IMG='https://image.tmdb.org/t/p';
let genreMovie={}, currentScreen='home', hist=[];
const HOME_GENRES=[['28','Боевики'],['35','Комедии'],['18','Драмы'],['878','Фантастика'],['53','Триллеры']];

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function getKey(){return (localStorage.getItem(LS_KEY)||'').trim();}
function hasKey(){return !!getKey();}
function imgUrl(p,size){return p?IMG+'/'+size+p:'';}
function getFavs(){try{return JSON.parse(localStorage.getItem(LS_FAV)||'[]');}catch(e){return [];}}
function setFavs(f){localStorage.setItem(LS_FAV,JSON.stringify(f));}
function isFav(type,id){return getFavs().some(f=>f.type===type&&String(f.id)===String(id));}

/* ТВ или телефон — автоматически */
function detectTV(){
  const ua=navigator.userAgent||'';
  if(/TV|MiBox|Android TV|BRAVIA|AFT|GoogleTV/i.test(ua)) return true;
  const coarse=window.matchMedia('(pointer: coarse)').matches;
  const touch=('ontouchstart' in window)||navigator.maxTouchPoints>0;
  return window.innerWidth>=960 && !coarse && !touch;
}
function applyMode(){document.body.classList.toggle('tv',detectTV());document.body.classList.toggle('phone',!detectTV());}
applyMode();
let rsT=null;window.addEventListener('resize',()=>{clearTimeout(rsT);rsT=setTimeout(applyMode,200);});

/* Пространственная навигация (D-pad) */
let cur=null;
function setFocus(el){
  if(!el) return;
  if(cur) cur.classList.remove('focused');
  cur=el; cur.classList.add('focused');
  try{cur.scrollIntoView({block:'nearest',inline:'nearest'});}catch(e){}
}
function visibleFocusable(){
  return $$('.focusable').filter(el=>{
    if(el.disabled) return false;
    const s=el.closest('section.screen');
    if(s && !s.classList.contains('show')) return false;
    return el.offsetParent!==null;
  });
}
function moveFocus(dir){
  const list=visibleFocusable();
  if(!cur){if(list.length) setFocus(list[0]);return;}
  const r=cur.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/2;
  let best=null,bd=1e15;
  for(const el of list){
    if(el===cur) continue;
    const q=el.getBoundingClientRect(), ex=q.left+q.width/2, ey=q.top+q.height/2;
    const dx=ex-cx, dy=ey-cy;
    let ok=false;
    if(dir==='right') ok=dx>0&&Math.abs(dy)<=Math.abs(dx);
    if(dir==='left') ok=dx<0&&Math.abs(dy)<=Math.abs(dx);
    if(dir==='down') ok=dy>0&&Math.abs(dx)<=Math.abs(dy);
    if(dir==='up') ok=dy<0&&Math.abs(dx)<=Math.abs(dy);
    if(!ok) continue;
    const d=dx*dx+dy*dy;
    if(d<bd){bd=d;best=el;}
  }
  if(best) setFocus(best);
}
document.addEventListener('mouseover',e=>{
  const f=e.target.closest?e.target.closest('.focusable'):null;
  if(f) setFocus(f);
});
document.addEventListener('keydown',e=>{
  const ae=document.activeElement;
  const inField=ae&&(ae.tagName==='INPUT'||ae.tagName==='TEXTAREA');
  if(inField){
    /* Пока фокус в поле — навигация клавиши не перехватывает, ввод идёт в поле */
    if(e.key==='ArrowUp'||e.key==='ArrowDown'){ae.blur();e.preventDefault();}
    else if(e.key==='Enter'){e.preventDefault();if(ae.id==='tmdb-key')saveKey();else if(ae.id==='search-input')doSearch();}
    else if(e.key==='Escape'){ae.blur();e.preventDefault();}
    return;
  }
  const k=e.key;
  if(k==='ArrowRight'){moveFocus('right');e.preventDefault();}
  else if(k==='Left'||k==='ArrowLeft'){moveFocus('left');e.preventDefault();}
  else if(k==='ArrowDown'){moveFocus('down');e.preventDefault();}
  else if(k==='ArrowUp'){moveFocus('up');e.preventDefault();}
  else if(k==='Enter'||k===' '){
    if(cur){
      /* Поле ввода: только РЕАЛЬНЫЙ DOM-фокус открывает системную клавиатуру на ТВ.
         Синтезированный click() на WebView MiBox клавиатуру не открывает (урок pawflix v0.9). */
      if(cur.tagName==='INPUT'||cur.tagName==='TEXTAREA'){setFocus(cur);cur.focus();}
      else cur.click();
      e.preventDefault();
    }
  }
  else if(k==='Escape'){goBack();e.preventDefault();}
});

/* Экраны */
const MENU_MAIN={home:1,'genres-movie':1,'genres-tv':1,'genres-anim':1,favs:1,settings:1,search:1};
function showScreen(id,push){
  if(push===undefined) push=true;
  if(push&&currentScreen&&currentScreen!==id) hist.push(currentScreen);
  currentScreen=id;
  $$('section.screen').forEach(s=>s.classList.toggle('show',s.id==='screen-'+id));
  if(MENU_MAIN[id]) $$('.menu-btn').forEach(b=>b.classList.toggle('active',b.dataset.screen===id));
  window.scrollTo(0,0);
  if(id==='home'&&!homeLoaded) loadHome();
  if(id==='genres-movie') loadGenreTiles('movie');
  if(id==='genres-tv') loadGenreTiles('tv');
  if(id==='genres-anim') loadGenreTiles('anim');
  if(id==='favs') renderFavs();
  if(id==='settings'){$('#tmdb-key').value=getKey();$('#tmdb-status').textContent='';}
  if(detectTV()){
    const first=visibleFocusable();
    if(first.length) setFocus(first[0]);
  }
}
function goBack(){
  if(hist.length){showScreen(hist.pop(),false);return;}
  if(currentScreen!=='home') showScreen('home',false);
}
$('#list-back').addEventListener('click',goBack);
$$('.menu-btn').forEach(b=>b.addEventListener('click',()=>showScreen(b.dataset.screen)));
$('#nokey-goto').addEventListener('click',()=>showScreen('settings'));

/* TMDB */
async function api(path,params){
  const k=getKey();
  if(!k) throw new Error('nokey');
  const u=new URL(TMDB+path);
  u.searchParams.set('api_key',k);
  u.searchParams.set('language','ru-RU');
  if(params) for(const key2 of Object.keys(params)) u.searchParams.set(key2,params[key2]);
  const r=await fetch(u.toString());
  if(!r.ok) throw new Error('tmdb '+r.status);
  return r.json();
}
function cardHTML(it,type){
  const title=it.title||it.name||'';
  const pic=it.backdrop_path||it.poster_path;
  return '<button class="card focusable" data-id="'+it.id+'" data-type="'+type+'">'+
    '<span class="thumb">'+(pic?'<img src="'+imgUrl(pic,'w780')+'" alt="" loading="lazy" onerror="this.remove()">':'')+'</span>'+
    '<span class="ctitle">'+esc(title)+'</span></button>';
}
document.addEventListener('click',e=>{
  const card=e.target.closest?e.target.closest('.card'):null;
  if(card){openDetail(card.dataset.type,card.dataset.id);return;}
  const pill=e.target.closest?e.target.closest('.more-pill'):null;
  if(pill){openGenreList(pill.dataset.type,pill.dataset.genre,pill.dataset.name,pill.dataset.anim==='1');return;}
  const tile=e.target.closest?e.target.closest('.tile'):null;
  if(tile){openGenreList(tile.dataset.type,tile.dataset.genre,tile.dataset.name,tile.dataset.anim==='1');return;}
});

/* Главная: hero + ряды */
let homeLoaded=false, heroTimer=null, heroList=[], heroIdx=0;
function showHero(i){
  const it=heroList[i]; if(!it) return;
  const im=$('#hero-img');
  if(it.backdrop_path) im.src=imgUrl(it.backdrop_path,'w1280'); else im.removeAttribute('src');
  $('#hero-title').textContent=it.title||it.name||'';
  const year=(it.release_date||it.first_air_date||'').slice(0,4);
  const gs=(it.genre_ids||[]).map(id=>genreMovie[id]).filter(Boolean).slice(0,3).join(', ');
  const star=it.vote_average?'★ '+it.vote_average.toFixed(1):'';
  $('#hero-meta').innerHTML=[star,year,gs].filter(Boolean).map(esc).join(' · ').replace('★','<span class="star">★</span>');
  $('#hero-overview').textContent=it.overview||'';
  $$('#hero-dots span').forEach((d,j)=>d.classList.toggle('on',j===i));
}
function startHero(list){
  heroList=list; heroIdx=0;
  $('#hero-dots').innerHTML=list.map(()=>'<span></span>').join('');
  showHero(0);
  if(heroTimer) clearInterval(heroTimer);
  if(list.length>1) heroTimer=setInterval(()=>{
    if(document.hidden) return;
    heroIdx=(heroIdx+1)%heroList.length; showHero(heroIdx);
  },8000);
}
function renderRow(boxId,title,items,type,more){
  const box=$(boxId); if(!box) return;
  let html='<div class="row-title">'+esc(title)+'</div><div class="row">';
  html+=items.map(it=>cardHTML(it,type)).join('');
  if(more) html+='<span class="more-wrap"><button class="more-pill focusable" data-type="'+more.type+'" data-genre="'+more.genre+'" data-name="'+esc(more.name)+'" data-anim="'+(more.anim?'1':'0')+'">Ещё →</button></span>';
  html+='</div>';
  box.innerHTML=html;
}
async function loadHome(){
  homeLoaded=true;
  const nk=$('#home-nokey'), rows=$('#home-rows');
  if(!hasKey()){nk.style.display='block';rows.innerHTML='';$('#hero-title').textContent='';$('#hero-meta').textContent='';$('#hero-overview').textContent='';$('#hero-dots').innerHTML='';return;}
  nk.style.display='none';
  rows.innerHTML='<div class="loader">Загружаю…</div>';
  try{
    const gm=await api('/genre/movie/list');
    genreMovie={}; gm.genres.forEach(g=>{genreMovie[g.id]=g.name;});
    let heroItems=[];
    try{const np=await api('/movie/now_playing',{page:1});heroItems=np.results.filter(r=>r.backdrop_path).slice(0,12);}catch(e){}
    if(heroItems.length<3){try{const tr=await api('/trending/movie/week');heroItems=tr.results.filter(r=>r.backdrop_path).slice(0,12);}catch(e){}}
    startHero(heroItems);
    rows.innerHTML='<div id="row-popular"></div>'+HOME_GENRES.map(g=>'<div id="row-g'+g[0]+'"></div>').join('');
    const pop=await api('/movie/popular',{page:1});
    renderRow('#row-popular','Популярное',pop.results,'movie',null);
    for(const g of HOME_GENRES){
      const d=await api('/discover/movie',{with_genres:g[0],sort_by:'popularity.desc',page:1});
      renderRow('#row-g'+g[0],g[1],d.results,'movie',{type:'movie',genre:g[0],name:g[1],anim:false});
    }
  }catch(e){
    rows.innerHTML='<div class="empty">Не удалось загрузить каталог — проверьте TMDB-ключ в Настройках.</div>';
  }
}

/* Страницы жанров */
const tilesLoaded={};
async function loadGenreTiles(kind){
  if(tilesLoaded[kind]) return;
  const box=kind==='movie'?$('#tiles-movie'):kind==='tv'?$('#tiles-tv'):$('#tiles-anim');
  if(!hasKey()){box.innerHTML='<div class="empty">Добавьте TMDB-ключ в Настройках — без него каталог не загрузится.</div>';return;}
  box.innerHTML='<div class="loader">Загружаю…</div>';
  try{
    const d=await api(kind==='tv'?'/genre/tv/list':'/genre/movie/list');
    if(kind==='tv') d.genres.forEach(g=>{});
    box.innerHTML=d.genres.map(g=>'<button class="tile focusable" data-type="'+(kind==='tv'?'tv':'movie')+'" data-genre="'+g.id+'" data-name="'+esc(g.name)+'" data-anim="'+(kind==='anim'?'1':'0')+'">'+esc(g.name)+'</button>').join('');
    tilesLoaded[kind]=true;
  }catch(e){
    box.innerHTML='<div class="empty">Не удалось загрузить жанры — проверьте TMDB-ключ в Настройках.</div>';
  }
}

/* Полный список жанра: первая порция (20) — сразу, дальше догрузка по скроллу.
   Фон — статичный размытый бэкдроп первого фильма списка. */
let listState=null, listObserver=null;
function listBgFrom(item){
  const bgImg=$('#list-bg-img');
  bgImg.style.display='none'; bgImg.removeAttribute('src');
  if(!item) return;
  const u=item.backdrop_path?imgUrl(item.backdrop_path,'w1280'):(item.poster_path?imgUrl(item.poster_path,'w500'):'');
  if(u){bgImg.src=u; bgImg.style.display='block';}
}
async function listLoadPage(){
  const st=listState; if(!st||st.loading||st.done) return;
  st.loading=true;
  const more=$('#list-more');
  if(st.page>1){more.style.display='block'; more.textContent='Загружаю ещё…';}
  try{
    const params={sort_by:'popularity.desc',page:st.page};
    if(st.type==='movie') params.with_genres=st.animOnly?((String(st.genreId)==='16')?'16':'16,'+st.genreId):st.genreId;
    else params.with_genres=st.genreId;
    const d=await api(st.type==='movie'?'/discover/movie':'/discover/tv',params);
    st.totalPages=d.total_pages||1;
    const items=d.results||[];
    if(st.page===1){
      $('#list-loader').textContent='';
      $('#list-grid').innerHTML=items.length?items.map(it=>cardHTML(it,st.type)).join(''):'<div class="empty">Ничего не найдено</div>';
      listBgFrom(items[0]);
      const first=$('#list-grid').querySelector('.focusable');
      if(first&&detectTV()) setFocus(first);
    }else{
      $('#list-grid').insertAdjacentHTML('beforeend',items.map(it=>cardHTML(it,st.type)).join(''));
    }
    st.page++;
    if(st.page>st.totalPages) st.done=true;
  }catch(e){
    if(st.page===1) $('#list-loader').textContent='Ошибка загрузки — проверьте TMDB-ключ в Настройках.';
    st.done=true;
  }
  st.loading=false;
  more.style.display='none';
  if(st.done&&listObserver) listObserver.disconnect();
}
function listObserve(){
  if(listObserver) listObserver.disconnect();
  listObserver=new IntersectionObserver(entries=>{
    if(entries.some(en=>en.isIntersecting)) listLoadPage();
  },{rootMargin:'400px'});
  const s=$('#list-sentinel');
  if(s) listObserver.observe(s);
}
async function openGenreList(type,genreId,genreName,animOnly){
  if(listObserver) listObserver.disconnect();
  showScreen('list');
  const loader=$('#list-loader'), grid=$('#list-grid'), more=$('#list-more');
  grid.innerHTML=''; more.style.display='none'; more.textContent='';
  const bgImg=$('#list-bg-img'); bgImg.style.display='none'; bgImg.removeAttribute('src');
  if(!hasKey()){loader.textContent='Добавьте TMDB-ключ в Настройках.'; listState=null; return;}
  loader.textContent='Загружаю…';
  listState={type:type,genreId:genreId,animOnly:animOnly,page:1,totalPages:1,loading:false,done:false};
  await listLoadPage();
  if(listState&&!listState.done) listObserve();
}

/* Экран фильма: минимум, без плеера */
async function openDetail(type,id){
  showScreen('detail');
  const box=$('#detail-box');
  box.innerHTML='<div class="loader" style="padding-top:6em">Загружаю…</div>';
  try{
    const d=await api('/'+type+'/'+id);
    const title=d.title||d.name||'';
    const year=(d.release_date||d.first_air_date||'').slice(0,4);
    const gs=(d.genres||[]).map(g=>g.name).join(', ');
    const star=d.vote_average?'★ '+d.vote_average.toFixed(1):'';
    const fav=isFav(type,id);
    const pic=d.backdrop_path||d.poster_path;
    box.innerHTML=
      '<div style="padding-top:4.5em"></div>'+
      '<div class="backdrop">'+(pic?'<img src="'+imgUrl(pic,'w1280')+'" alt="" onerror="this.remove()">':'')+'<div class="shade"></div></div>'+
      '<div class="detail-info"><h1>'+esc(title)+'</h1>'+
      '<div class="meta">'+[star?'<span class="star">★</span> '+esc(star.slice(2)):null,year,gs].filter(Boolean).join(' · ')+'</div>'+
      '<p>'+esc(d.overview||'Описание отсутствует.')+'</p>'+
      '<button class="fav-btn focusable'+(fav?' in':'')+'" id="fav-toggle" data-type="'+type+'" data-id="'+id+'">'+(fav?'✓ В избранном':'♡ В избранное')+'</button></div>';
    $('#fav-toggle').addEventListener('click',()=>{
      const f=getFavs(), idx=f.findIndex(x=>x.type===type&&String(x.id)===String(id));
      if(idx>=0) f.splice(idx,1);
      else f.push({type:type,id:d.id,title:title,backdrop:d.backdrop_path||null,poster:d.poster_path||null,rating:d.vote_average||0});
      setFavs(f);
      const b=$('#fav-toggle'), now=idx<0;
      b.classList.toggle('in',now); b.textContent=now?'✓ В избранном':'♡ В избранное';
    });
    if(detectTV()){const b=$('#fav-toggle'); if(b) setFocus(b);}
  }catch(e){
    box.innerHTML='<div class="empty" style="padding-top:6em">Ошибка загрузки — проверьте TMDB-ключ в Настройках.</div>';
  }
}

/* Избранное */
function renderFavs(){
  const grid=$('#favs-grid'), empty=$('#favs-empty');
  const f=getFavs();
  empty.style.display=f.length?'none':'block';
  grid.innerHTML=f.map(x=>cardHTML({id:x.id,title:x.title,backdrop_path:x.backdrop,poster_path:x.poster,vote_average:x.rating},x.type)).join('');
}

/* Настройки: только TMDB-ключ */
function saveKey(){
  const v=$('#tmdb-key').value.trim();
  localStorage.setItem(LS_KEY,v);
  $('#tmdb-status').textContent=v?'Сохранено ✓':'Ключ удалён';
  homeLoaded=false; tilesLoaded.movie=false; tilesLoaded.tv=false; tilesLoaded.anim=false;
  if(v) loadHome();
}
$('#tmdb-save').addEventListener('click',saveKey);

/* Поиск */
async function doSearch(){
  const q=$('#search-input').value.trim();
  const grid=$('#search-grid'), loader=$('#search-loader');
  grid.innerHTML='';
  if(!q){loader.textContent='Введите название.';return;}
  if(!hasKey()){loader.textContent='Добавьте TMDB-ключ в Настройках.';return;}
  loader.textContent='Ищу…';
  try{
    const d=await api('/search/multi',{query:q,page:1,include_adult:'false'});
    const items=(d.results||[]).filter(r=>(r.media_type==='movie'||r.media_type==='tv')&&(r.backdrop_path||r.poster_path));
    loader.textContent=items.length?('Найдено: '+items.length):'Ничего не найдено';
    grid.innerHTML=items.map(it=>cardHTML(it,it.media_type)).join('');
    const first=grid.querySelector('.focusable');
    if(first&&detectTV()) setFocus(first);
  }catch(e){
    loader.textContent='Ошибка поиска — проверьте TMDB-ключ в Настройках.';
  }
}
$('#search-go').addEventListener('click',doSearch);

/* Старт */
if(hasKey()) loadHome();
else{
  $('#home-nokey').style.display='block';
  $('#hero-title').textContent='Просто Кино';
  $('#hero-overview').textContent='Добавьте TMDB-ключ в Настройках — и каталог загрузится.';
}
if(detectTV()){
  const first=visibleFocusable();
  if(first.length) setFocus(first[0]);
}

/* Логотип pawflix в меню: входная анимация из файла, тап — повтор (знак, не кнопка) */
(function(){
  var logo=document.getElementById('pk-logo');
  if(!logo) return;
  function play(){logo.classList.remove('go');void logo.offsetWidth;logo.classList.add('go');}
  logo.addEventListener('click',play);
  logo.classList.remove('go');
  var started=false;
  function start(){if(started)return;started=true;logo.classList.add('go');}
  if(document.fonts&&document.fonts.ready){document.fonts.ready.then(start);setTimeout(start,1500);}else{start();}
})();
</script>
