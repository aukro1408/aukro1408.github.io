<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🔐 Генератор</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔐</text></svg>">
  <style>
    :root {
      --bg: #ffffff;
      --bg-alt: #f8fafc;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --success: #10b981;
      --card-bg: #ffffff;
      --shadow: 0 4px 12px rgba(0,0,0,0.06);
      --radius: 16px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg-alt);
      color: var(--text);
      line-height: 1.6;
      padding: 24px 16px;
      min-height: 100vh;
    }

    .container {
      max-width: 520px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 32px;
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 8px;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 16px;
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: var(--shadow);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(0,0,0,0.1);
    }

    .card h2 {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .card h2::before {
      content: "🔐";
      font-size: 20px;
    }

    .card:nth-child(2) h2::before {
      content: "👤";
    }

    label {
      display: block;
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    input[type="number"] {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid(var(--border));
      border-radius: 12px;
      font-size: 16px;
      background: #f1f5f9;
      transition: border-color 0.2s;
    }

    input[type="number"]:focus {
      outline: none;
      border-color: var(--primary);
      background: white;
    }

    .btn-group {
      display: flex;
      gap: 12px;
      margin-top: 16px;
    }

    button {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      background: var(--primary);
      color: white;
    }

    button:hover:not(:disabled) {
      background: var(--primary-hover);
      transform: translateY(-1px);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    button.copy {
      background: #94a3b8;
    }

    button.copy:hover:not(:disabled) {
      background: #64748b;
    }

    .result {
      margin-top: 16px;
      padding: 14px;
      background: #f1f5f9;
      border-radius: 12px;
      font-family: ui-monospace, monospace;
      font-size: 18px;
      word-break: break-all;
      min-height: 24px;
      color: var(--text);
    }

    .warning {
      color: #ef4444;
      font-weight: 600;
    }

    @media (max-width: 480px) {
      .btn-group {
        flex-direction: column;
      }
      button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Генератор</h1>
      <p class="subtitle">Пароли и юзернеймы за один клик</p>
    </header>

    <!-- Пароли -->
    <div class="card">
      <h2>Пароль</h2>
      <label for="pass-length">Длина (4–50):</label>
      <input id="pass-length" type="number" value="12" min="4" max="50" />

      <div class="btn-group">
        <button id="gen-pass">Сгенерировать</button>
        <button id="copy-pass" class="copy" disabled>Копировать</button>
      </div>
      <div id="pass-result" class="result"></div>
    </div>

    <!-- Юзернеймы -->
    <div class="card">
      <h2>Юзернейм</h2>
      <div class="btn-group">
        <button id="gen-user">Сгенерировать</button>
        <button id="copy-user" class="copy" disabled>Копировать</button>
      </div>
      <div id="user-result" class="result"></div>
    </div>
  </div>

  <script>
    // === Отслеживание уникальности ===
    const usedPasswords = new Set();
    const usedUsernames = new Set();

    // === Генератор паролей ===
    const passChars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*";
    let currentPassword = "";

    function generatePassword(length) {
      let result = "";
      for (let i = 0; i < length; i++) {
        result += passChars.charAt(Math.floor(Math.random() * passChars.length));
      }
      return result;
    }

    function generateUniquePassword(length) {
      let attempt;
      let tries = 0;
      const maxTries = 100;
      do {
        attempt = generatePassword(length);
        tries++;
        if (tries > maxTries) {
          return "⚠️ Не удалось создать уникальный пароль";
        }
      } while (usedPasswords.has(attempt));
      usedPasswords.add(attempt);
      return attempt;
    }

    document.getElementById("gen-pass").onclick = () => {
      const length = parseInt(document.getElementById("pass-length").value) || 12;
      const clampedLength = Math.min(50, Math.max(4, length));
      currentPassword = generateUniquePassword(clampedLength);
      const resultEl = document.getElementById("pass-result");
      if (currentPassword.startsWith("⚠️")) {
        resultEl.innerHTML = `<span class="warning">${currentPassword}</span>`;
        document.getElementById("copy-pass").disabled = true;
      } else {
        resultEl.textContent = currentPassword;
        document.getElementById("copy-pass").disabled = false;
      }
    };

    document.getElementById("copy-pass").onclick = () => {
      navigator.clipboard.writeText(currentPassword).then(() => {
        const btn = document.getElementById("copy-pass");
        btn.textContent = "Скопировано!";
        setTimeout(() => btn.textContent = "Копировать", 1200);
      });
    };

    // === Генератор юзернеймов ===
    const adjectives = [
      "cool", "neon", "swift", "silent", "wild", "golden", "dark", "lucky", "fuzzy", "epic",
      "cosmic", "brave", "sly", "happy", "mystic", "quick", "clever", "fierce", "noble", "wise",
      "sunny", "stormy", "velvet", "crimson", "azure", "quantum", "stealth", "vivid", "ancient", "modern",
      "shadow", "ember", "frost", "thunder", "echo", "nova", "zen", "pixel", "galaxy", "phantom",
      "raven", "serene", "blaze", "mirage", "zenith", "orbit", "cipher", "glitch", "aura", "vortex"
    ];

    const nouns = [
      "panda", "wolf", "dragon", "phoenix", "tiger", "eagle", "shark", "fox", "owl", "lion",
      "ghost", "ninja", "wizard", "robot", "pixel", "samurai", "knight", "sphinx", "mermaid", "unicorn",
      "comet", "nebula", "vortex", "cipher", "raven", "tempest", "oracle", "lighthouse", "quasar", "sprite",
      "drifter", "warden", "spectre", "chronos", "anomaly", "beacon", "sentinel", "voyager", "mirage", "echo",
      "zenith", "horizon", "apex", "cipher", "vector", "matrix", "pulse", "flux", "nova", "arc"
    ];

    let currentUsername = "";

    function generateUsername() {
      const adj = adjectives[Math.floor(Math.random() * adjectives.length)];
      const noun = nouns[Math.floor(Math.random() * nouns.length)];
      const number = Math.floor(Math.random() * 9000) + 1000; // 1000–9999
      return `${adj}_${noun}_${number}`;
    }

    function generateUniqueUsername() {
      let attempt;
      let tries = 0;
      const maxTries = 100;
      do {
        attempt = generateUsername();
        tries++;
        if (tries > maxTries) {
          return "⚠️ Все юзернеймы исчерпаны!";
        }
      } while (usedUsernames.has(attempt));
      usedUsernames.add(attempt);
      return attempt;
    }

    document.getElementById("gen-user").onclick = () => {
      currentUsername = generateUniqueUsername();
      const resultEl = document.getElementById("user-result");
      if (currentUsername.startsWith("⚠️")) {
        resultEl.innerHTML = `<span class="warning">${currentUsername}</span>`;
        document.getElementById("copy-user").disabled = true;
      } else {
        resultEl.textContent = currentUsername;
        document.getElementById("copy-user").disabled = false;
      }
    };

    document.getElementById("copy-user").onclick = () => {
      navigator.clipboard.writeText(currentUsername).then(() => {
        const btn = document.getElementById("copy-user");
        btn.textContent = "Скопировано!";
        setTimeout(() => btn.textContent = "Копировать", 1200);
      });
    };
  </script>
</body>
</html>
