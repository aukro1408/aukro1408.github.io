<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🔐 Генератор паролей и юзернеймов</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      padding: 20px;
      max-width: 500px;
      margin: 0 auto;
      background: #f9f9f9;
      color: #333;
    }
    h2 {
      text-align: center;
      color: #2c3e50;
      margin-top: 30px;
    }
    .section {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      margin-bottom: 25px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
    }
    input, button {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      box-sizing: border-box;
    }
    button {
      background: #3498db;
      color: white;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background: #2980b9;
    }
    button:disabled {
      background: #bdc3c7;
      cursor: not-allowed;
    }
    .result {
      font-family: monospace;
      font-size: 18px;
      padding: 12px;
      background: #f1f1f1;
      border: 1px dashed #aaa;
      border-radius: 6px;
      word-break: break-all;
      min-height: 24px;
    }
    #qrcode {
      text-align: center;
      margin-top: 10px;
    }
    #qrcode canvas {
      max-width: 100%;
      height: auto;
      border: 1px solid #eee;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <h1 style="text-align:center; margin-top: 10px;">🔐 Генератор</h1>

  <!-- Пароли -->
  <div class="section">
    <h2>Пароль</h2>
    <label for="pass-length">Длина (4–50):</label>
    <input id="pass-length" type="number" value="12" min="4" max="50" />

    <button id="gen-pass">Сгенерировать</button>
    <button id="copy-pass" disabled>Копировать</button>
    <div id="pass-result" class="result"></div>
  </div>

  <!-- Юзернеймы -->
  <div class="section">
    <h2>Юзернейм</h2>
    <button id="gen-user">Сгенерировать</button>
    <button id="copy-user" disabled>Копировать</button>
    <div id="user-result" class="result"></div>
  </div>

  <!-- QR-код -->
  <div class="section">
    <h2>QR-код этой страницы</h2>
    <p>Отсканируй, чтобы открыть генератор на другом устройстве</p>
    <div id="qrcode"></div>
  </div>

  <!-- QRCode.js (встроенная мини-версия) -->
  <script>
    // === Мини-реализация QR-кода без внешних зависимостей ===
    // Используем простой алгоритм через data URL (для коротких URL)
    function generateQR(text) {
      // Google Charts API (просто и надёжно для коротких ссылок)
      const url = `https://chart.googleapis.com/chart?cht=qr&chs=250x250&chl=${encodeURIComponent(text)}&choe=UTF-8`;
      const img = document.createElement("img");
      img.src = url;
      img.alt = "QR Code";
      img.style.maxWidth = "100%";
      return img;
    }

    // Альтернатива: если хочешь полностью offline — можно подключить qrcode.js,
    // но для простоты и совместимости используем Google Charts (работает везде).

    // Генерируем QR для текущей страницы
    document.getElementById("qrcode").appendChild(
      generateQR(window.location.href)
    );

    // === Генератор паролей ===
    const passChars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*";
    let currentPassword = "";

    function generatePassword(length) {
      let result = "";
      for (let i = 0; i < length; i++) {
        result += passChars.charAt(Math.floor(Math.random() * passChars.length));
      }
      return result;
    }

    document.getElementById("gen-pass").onclick = () => {
      const length = parseInt(document.getElementById("pass-length").value) || 12;
      currentPassword = generatePassword(Math.min(50, Math.max(4, length)));
      document.getElementById("pass-result").textContent = currentPassword;
      document.getElementById("copy-pass").disabled = false;
    };

    document.getElementById("copy-pass").onclick = () => {
      navigator.clipboard.writeText(currentPassword).then(() => {
        const btn = document.getElementById("copy-pass");
        btn.textContent = "Скопировано!";
        setTimeout(() => btn.textContent = "Копировать", 1000);
      });
    };

    // === Генератор юзернеймов ===
    const adjectives = ["cool", "neon", "swift", "silent", "wild", "golden", "dark", "lucky", "fuzzy", "epic", "cosmic", "brave", "sly", "happy", "mystic"];
    const nouns = ["panda", "wolf", "dragon", "phoenix", "tiger", "eagle", "shark", "fox", "owl", "lion", "ghost", "ninja", "wizard", "robot", "pixel"];
    let currentUsername = "";

    function generateUsername() {
      const adj = adjectives[Math.floor(Math.random() * adjectives.length)];
      const noun = nouns[Math.floor(Math.random() * nouns.length)];
      const number = Math.floor(Math.random() * 900) + 100;
      return `${adj}_${noun}_${number}`;
    }

    document.getElementById("gen-user").onclick = () => {
      currentUsername = generateUsername();
      document.getElementById("user-result").textContent = currentUsername;
      document.getElementById("copy-user").disabled = false;
    };

    document.getElementById("copy-user").onclick = () => {
      navigator.clipboard.writeText(currentUsername).then(() => {
        const btn = document.getElementById("copy-user");
        btn.textContent = "Скопировано!";
        setTimeout(() => btn.textContent = "Копировать", 1000);
      });
    };
  </script>
</body>
</html>
