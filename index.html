<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IPTV Player</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #0f1115; color: #e8e8e8;
    min-height: 100vh;
  }
  header {
    padding: 12px 16px; background: #161a21; border-bottom: 1px solid #262c36;
    position: sticky; top: 0; z-index: 10;
  }
  header h1 { font-size: 18px; }
  #status { font-size: 12px; color: #9aa3b2; margin-top: 4px; }
  main {
    display: grid; grid-template-columns: 1fr 360px; gap: 12px;
    padding: 12px; max-width: 1400px; margin: 0 auto;
  }
  .player-wrap { min-width: 0; }
  video {
    width: 100%; aspect-ratio: 16/9; background: #000;
    border-radius: 10px;
  }
  .now {
    display: flex; align-items: center; gap: 10px;
    margin-top: 10px; padding: 10px 12px;
    background: #161a21; border-radius: 10px;
  }
  .now img { width: 48px; height: 32px; object-fit: contain; display: none; }
  .now span { font-size: 16px; font-weight: 600; }
  aside {
    background: #161a21; border-radius: 10px; padding: 12px;
    display: flex; flex-direction: column; gap: 10px;
    max-height: calc(100vh - 110px); overflow: hidden;
  }
  input, button {
    width: 100%; padding: 10px 12px; border-radius: 8px;
    border: 1px solid #2c333f; background: #0f1115; color: #e8e8e8;
    font-size: 14px;
  }
  input::placeholder { color: #6b7484; }
  input:focus { outline: none; border-color: #4c8dff; }
  button {
    background: #2b6de8; border: none; font-weight: 600; cursor: pointer;
  }
  button:active { background: #245bc4; }
  .settings { display: flex; flex-direction: column; gap: 8px; }
  #groups { display: flex; flex-wrap: wrap; gap: 6px; max-height: 110px; overflow-y: auto; }
  .chip {
    padding: 6px 12px; border-radius: 20px; font-size: 13px;
    background: #232a35; color: #c6cdd8; cursor: pointer; white-space: nowrap;
  }
  .chip.active { background: #2b6de8; color: #fff; }
  #list {
    list-style: none; overflow-y: auto; flex: 1; min-height: 120px;
    display: flex; flex-direction: column; gap: 4px;
  }
  #list li {
    display: flex; align-items: center; gap: 10px;
    padding: 8px; border-radius: 8px; cursor: pointer; font-size: 14px;
  }
  #list li:hover { background: #1e242e; }
  #list li.active { background: #22385f; }
  #list img { width: 40px; height: 28px; object-fit: contain; flex-shrink: 0; }
  .empty { color: #6b7484; font-size: 13px; text-align: center; padding: 20px 0; }
  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; }
    .player-wrap { order: -1; }
    aside { max-height: none; }
    #list { max-height: 50vh; }
  }
</style>
</head>
<body>
<header>
  <h1>📺 IPTV Player</h1>
  <div id="status">Вставь ссылку на плейлист и нажми «Загрузить»</div>
</header>
<main>
  <section class="player-wrap">
    <video id="player" controls playsinline></video>
    <div class="now">
      <img id="chLogo" alt="">
      <span id="nowPlaying">Канал не выбран</span>
    </div>
  </section>
  <aside>
    <div class="settings">
      <input id="playlistUrl" placeholder="Ссылка на плейлист (.m3u / .m3u8)" inputmode="url">
      <input id="proxyUrl" placeholder="Прокси (необязательно): https://xxx.workers.dev" inputmode="url">
      <button id="loadBtn">Загрузить</button>
    </div>
    <input id="search" placeholder="🔍 Поиск канала…">
    <div id="groups"></div>
    <ul id="list"><li class="empty">Плейлист не загружен</li></ul>
  </aside>
</main>
<script>
const $ = (s) => document.querySelector(s);
const store = {
  get: (k) => localStorage.getItem('iptv_' + k) || '',
  set: (k, v) => localStorage.setItem('iptv_' + k, v),
};
const video = $('#player');
let channels = [], activeGroup = 'Все', hls = null;

function setStatus(t) { $('#status').textContent = t; }

function proxied(u) {
  const base = $('#proxyUrl').value.trim().replace(/\/+$/, '');
  return base ? base + '/?url=' + encodeURIComponent(u) : u;
}

function resolveUrl(u, base) {
  try { return new URL(u, base).href; } catch { return u; }
}

function parseM3U(text, base) {
  const lines = text.split('\n');
  const out = [];
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i].trim();
    if (!line.startsWith('#EXTINF')) continue;
    const logo = (line.match(/tvg-logo="([^"]*)"/) || [])[1] || '';
    const group = (line.match(/group-title="([^"]*)"/) || [])[1] || 'Без группы';
    const name = (line.split(',').pop() || '').trim() || 'Без названия';
    let url = '';
    for (let j = i + 1; j < lines.length; j++) {
      const l = lines[j].trim();
      if (!l) continue;
      if (!l.startsWith('#')) { url = resolveUrl(l, base); i = j; }
      break;
    }
    if (url) out.push({ name, logo, group, url });
  }
  return out;
}

function renderGroups() {
  const box = $('#groups');
  box.innerHTML = '';
  const groups = ['Все', ...new Set(channels.map((c) => c.group))];
  groups.forEach((g) => {
    const el = document.createElement('div');
    el.className = 'chip' + (g === activeGroup ? ' active' : '');
    el.textContent = g;
    el.onclick = () => { activeGroup = g; renderGroups(); renderList(); };
    box.appendChild(el);
  });
}

function renderList() {
  const q = $('#search').value.trim().toLowerCase();
  const ul = $('#list');
  ul.innerHTML = '';
  const items = channels.filter((c) =>
    (activeGroup === 'Все' || c.group === activeGroup) &&
    (!q || c.name.toLowerCase().includes(q))
  );
  if (!items.length) {
    ul.innerHTML = '<li class="empty">Ничего не найдено</li>';
    return;
  }
  items.forEach((c) => {
    const li = document.createElement('li');
    if (c === current) li.classList.add('active');
    const img = document.createElement('img');
    if (c.logo) { img.src = c.logo; img.onerror = () => img.remove(); }
    const span = document.createElement('span');
    span.textContent = c.name;
    li.append(img, span);
    li.onclick = () => play(c);
    ul.appendChild(li);
  });
}

let current = null;

function play(ch) {
  current = ch;
  $('#nowPlaying').textContent = ch.name;
  const logo = $('#chLogo');
  if (ch.logo) { logo.src = ch.logo; logo.style.display = 'block'; logo.onerror = () => (logo.style.display = 'none'); }
  else logo.style.display = 'none';
  const src = proxied(ch.url);
  if (hls) { hls.destroy(); hls = null; }
  if (window.Hls && Hls.isSupported() && /\.m3u8(\?|$)/i.test(ch.url)) {
    hls = new Hls();
    hls.on(Hls.Events.ERROR, (_, data) => {
      if (data.fatal) setStatus('Ошибка потока: ' + ch.name);
    });
    hls.loadSource(src);
    hls.attachMedia(video);
  } else {
    video.src = src;
  }
  video.play().catch(() => {});
  renderList();
  if (window.innerWidth <= 900) video.scrollIntoView({ behavior: 'smooth' });
}

async function loadPlaylist() {
  const purl = $('#playlistUrl').value.trim();
  if (!purl) { setStatus('Вставь ссылку на плейлист'); return; }
  store.set('playlist', purl);
  store.set('proxy', $('#proxyUrl').value.trim());
  setStatus('Загрузка плейлиста…');
  try {
    const res = await fetch(proxied(purl));
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();
    channels = parseM3U(text, purl);
    activeGroup = 'Все';
    renderGroups();
    renderList();
    setStatus(channels.length ? 'Каналов: ' + channels.length : 'Плейлист пустой или не распознан как m3u');
  } catch (e) {
    setStatus('Ошибка загрузки: ' + e.message);
  }
}

$('#loadBtn').onclick = loadPlaylist;
$('#search').oninput = renderList;
$('#playlistUrl').value = store.get('playlist');
$('#proxyUrl').value = store.get('proxy');
if (store.get('playlist')) loadPlaylist();
</script>
</body>
</html>
