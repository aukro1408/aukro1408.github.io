<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Мини-викторина</title>
  <style>
    :root {
      --bg: #121212;
      --fg: #e0e0e0;
      --card: #1e1e1e;
      --btn: #333;
      --btn-hover: #555;
      --correct: #4caf50;
      --wrong: #f44336;
      --accent: #bb86fc;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, sans-serif;
    }
    body {
      background: var(--bg);
      color: var(--fg);
      padding: 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      width: 100%;
      max-width: 500px;
    }
    h1 {
      text-align: center;
      margin: 20px 0;
      font-size: 1.8rem;
    }
    .screen {
      display: none;
      width: 100%;
    }
    .active {
      display: block;
    }
    .score {
      text-align: center;
      margin: 16px 0;
      font-size: 1.2rem;
      color: #bbb;
    }
    .question {
      background: var(--card);
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
    }
    .options {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    button {
      background: var(--btn);
      color: var(--fg);
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: var(--btn-hover);
    }
    button.correct {
      background: var(--correct);
    }
    button.wrong {
      background: var(--wrong);
    }
    .theme-btn {
      background: var(--accent);
      color: #000;
      font-weight: bold;
    }
    .theme-btn:hover {
      background: #a370db;
    }
    .controls {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    @media (max-width: 500px) {
      body { padding: 16px; }
      h1 { font-size: 1.5rem; }
      button { padding: 12px; font-size: 0.95rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Экран выбора темы -->
    <div id="theme-screen" class="screen active">
      <h1>🧠 Выбери тему</h1>
      <div class="controls">
        <button class="theme-btn" data-theme="capitals">🌍 Столицы</button>
        <button class="theme-btn" data-theme="movies">🎬 Кино</button>
        <button class="theme-btn" data-theme="science">🔬 Наука</button>
        <button class="theme-btn" data-theme="animals">🐾 Животные</button>
      </div>
    </div>

    <!-- Экран викторины -->
    <div id="quiz-screen" class="screen">
      <h1>Викторина</h1>
      <div class="score">Счёт: <span id="score">0</span> / <span id="total">5</span></div>
      <div class="question" id="question">...</div>
      <div class="options" id="options"></div>
    </div>

    <!-- Экран результата -->
    <div id="result-screen" class="screen">
      <h1>🎉 Готово!</h1>
      <div class="score" style="font-size: 1.4rem; margin: 20px 0;">
        Ваш результат: <span id="final-score">0</span> / 5
      </div>
      <div class="controls">
        <button id="back-to-themes">Выбрать другую тему</button>
      </div>
    </div>
  </div>

  <script>
    // База вопросов по темам
    const questionBank = {
      capitals: [
        ["Франция", "Париж", ["Париж", "Лион", "Марсель", "Бордо"]],
        ["Япония", "Токио", ["Киото", "Осака", "Токио", "Хиросима"]],
        ["Бразилия", "Бразилиа", ["Рио-де-Жанейро", "Сан-Паулу", "Бразилиа", "Сальвадор"]],
        ["Египет", "Каир", ["Александрия", "Каир", "Луксор", "Гиза"]],
        ["Канада", "Оттава", ["Торонто", "Ванкувер", "Монреаль", "Оттава"]],
        ["Австралия", "Канберра", ["Сидней", "Мельбурн", "Брисбен", "Канберра"]],
        ["Индия", "Нью-Дели", ["Мумбаи", "Калькутта", "Нью-Дели", "Ченнаи"]],
        ["Германия", "Берлин", ["Мюнхен", "Гамбург", "Берлин", "Кёльн"]]
      ],
      movies: [
        ["Кто режиссёр «Тёмного рыцаря»?", "Кристофер Нолан", ["Стивен Спилберг", "Квентин Тарантино", "Кристофер Нолан", "Джеймс Кэмерон"]],
        ["Как зовут главного героя «Матрицы»?", "Нео", ["Морфеус", "Тринити", "Нео", "Сайфер"]],
        ["В каком году вышел «Звёздные войны: Новая надежда»?", "1977", ["1975", "1977", "1980", "1983"]],
        ["Кто сыграл Тони Старка в Марвел?", "Роберт Дауни-младший", ["Крис Эванс", "Крис Хемсворт", "Роберт Дауни-младший", "Марк Руффало"]],
        ["Как называется школа в «Гарри Поттере»?", "Хогвартс", ["Биллингс", "Хогвартс", "Ильвермори", "Бобслей"]]
      ],
      science: [
        ["Какой химический символ у золота?", "Au", ["Ag", "Fe", "Au", "Pb"]],
        ["Сколько планет в Солнечной системе?", "8", ["7", "8", "9", "10"]],
        ["Что такое H₂O?", "Вода", ["Водород", "Кислород", "Углекислый газ", "Вода"]],
        ["Кто открыл закон всемирного тяготения?", "Ньютон", ["Эйнштейн", "Галилей", "Ньютон", "Кеплер"]],
        ["Какой газ выделяют растения днём?", "Кислород", ["Азот", "Углекислый газ", "Метан", "Кислород"]]
      ],
      animals: [
        ["Какое животное самое быстрое на суше?", "Гепард", ["Лев", "Гепард", "Зебра", "Антилопа"]],
        ["Сколько сердец у осьминога?", "3", ["1", "2", "3", "4"]],
        ["Какой самый большой млекопитающий?", "Синий кит", ["Слон", "Жираф", "Синий кит", "Бегемот"]],
        ["Как называется детёныш лягушки?", "Головастик", ["Цыплёнок", "Щенок", "Головастик", "Личинка"]],
        ["Какое животное спит стоя?", "Лошадь", ["Корова", "Слон", "Лошадь", "Жираф"]]
      ]
    };

    // Элементы DOM
    const themeScreen = document.getElementById("theme-screen");
    const quizScreen = document.getElementById("quiz-screen");
    const resultScreen = document.getElementById("result-screen");
    const questionEl = document.getElementById("question");
    const optionsEl = document.getElementById("options");
    const scoreEl = document.getElementById("score");
    const finalScoreEl = document.getElementById("final-score");
    const backBtn = document.getElementById("back-to-themes");

    let currentQuestions = [];
    let currentQuestionIndex = 0;
    let score = 0;
    const QUESTIONS_PER_QUIZ = 5;

    // Перемешивание массива
    function shuffle(arr) {
      return [...arr].sort(() => Math.random() - 0.5);
    }

    // Выбор темы
    document.querySelectorAll(".theme-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        const theme = btn.dataset.theme;
        startQuiz(theme);
      });
    });

    function startQuiz(theme) {
      const allQuestions = questionBank[theme] || [];
      if (allQuestions.length < QUESTIONS_PER_QUIZ) {
        currentQuestions = [...allQuestions];
      } else {
        // Берём 5 случайных вопросов
        currentQuestions = shuffle(allQuestions).slice(0, QUESTIONS_PER_QUIZ);
      }

      currentQuestionIndex = 0;
      score = 0;
      scoreEl.textContent = score;
      themeScreen.classList.remove("active");
      quizScreen.classList.add("active");
      loadQuestion();
    }

    function loadQuestion() {
      if (currentQuestionIndex >= currentQuestions.length) {
        showResult();
        return;
      }

      const [q, correct, options] = currentQuestions[currentQuestionIndex];
      const shuffled = shuffle(options);

      questionEl.textContent = q;
      optionsEl.innerHTML = "";

      shuffled.forEach(opt => {
        const btn = document.createElement("button");
        btn.textContent = opt;
        btn.onclick = () => {
          // Отключаем все кнопки
          document.querySelectorAll("#options button").forEach(b => b.disabled = true);

          if (opt === correct) {
            btn.classList.add("correct");
            score++;
            scoreEl.textContent = score;
          } else {
            btn.classList.add("wrong");
            // Подсвечиваем правильный
            document.querySelectorAll("#options button").forEach(b => {
              if (b.textContent === correct) b.classList.add("correct");
            });
          }

          setTimeout(() => {
            currentQuestionIndex++;
            loadQuestion();
          }, 1200);
        };
        optionsEl.appendChild(btn);
      });
    }

    function showResult() {
      quizScreen.classList.remove("active");
      resultScreen.classList.add("active");
      finalScoreEl.textContent = score;
    }

    backBtn.onclick = () => {
      resultScreen.classList.remove("active");
      themeScreen.classList.add("active");
    };
  </script>
</body>
</html>
