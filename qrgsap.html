<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кастомный QR Генератор</title>
    <script type="text/javascript" src="https://unpkg.com/qr-code-styling@1.5.0/lib/qr-code-styling.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            max-width: 400px;
            width: 100%;
        }

        h1 {
            margin: 0;
            color: #333;
            font-size: 1.5rem;
        }

        .controls {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        label {
            font-weight: 600;
            font-size: 0.9rem;
            color: #555;
            margin-bottom: 2px;
        }

        input[type="text"],
        select,
        input[type="file"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
        }

        .color-group {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        .color-picker {
            flex: 1;
        }

        input[type="color"] {
            width: 100%;
            height: 40px;
            border: none;
            cursor: pointer;
        }

        #canvas {
            margin-top: 10px;
            border: 1px solid #eee;
            border-radius: 10px;
            overflow: hidden;
        }

        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.3s;
        }

        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🎨 QR Creator</h1>

    <div class="controls">
        <div>
            <label>Текст или Ссылка:</label>
            <input type="text" id="dataInput" value="https://google.com" placeholder="Введите ссылку">
        </div>

        <div>
            <label>Стиль точек:</label>
            <select id="dotsStyle">
                <option value="square">Квадраты (Стандарт)</option>
                <option value="dots">Точки (Круглые)</option>
                <option value="rounded">Закругленные</option>
                <option value="extra-rounded">Сильно закругленные</option>
                <option value="classy">Элегантный</option>
            </select>
        </div>

        <div class="color-group">
            <div class="color-picker">
                <label>Цвет кода:</label>
                <input type="color" id="colorDots" value="#000000">
            </div>
            <div class="color-picker">
                <label>Фон:</label>
                <input type="color" id="colorBg" value="#ffffff">
            </div>
        </div>

        <div>
            <label>Логотип (по центру):</label>
            <input type="file" id="logoInput" accept="image/*">
        </div>
    </div>

    <div id="canvas"></div>

    <button onclick="downloadQR()">Скачать PNG</button>
</div>

<script>
    // Инициализация QR-кода
    const qrCode = new QRCodeStyling({
        width: 300,
        height: 300,
        type: "svg",
        data: "https://google.com",
        image: "",
        dotsOptions: {
            color: "#000000",
            type: "square"
        },
        backgroundOptions: {
            color: "#ffffff"
        },
        imageOptions: {
            crossOrigin: "anonymous",
            margin: 5
        },
        cornersSquareOptions: {
            type: "extra-rounded"
        }
    });

    qrCode.append(document.getElementById("canvas"));

    // Обновление QR-кода
    function updateQRCode() {
        const data = document.getElementById("dataInput").value.trim();
        if (!data) return; // Не обновлять, если пусто

        const dotsStyle = document.getElementById("dotsStyle").value;
        const colorDots = document.getElementById("colorDots").value;
        const colorBg = document.getElementById("colorBg").value;

        qrCode.update({
            data: data,
            dotsOptions: {
                color: colorDots,
                type: dotsStyle
            },
            backgroundOptions: {
                color: colorBg
            }
        });
    }

    // Слушатели изменений
    document.getElementById("dataInput").addEventListener("input", updateQRCode);
    document.getElementById("dotsStyle").addEventListener("change", updateQRCode);
    document.getElementById("colorDots").addEventListener("input", updateQRCode);
    document.getElementById("colorBg").addEventListener("input", updateQRCode);

    // Загрузка логотипа
    document.getElementById("logoInput").addEventListener("change", function(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function() {
            qrCode.update({
                image: reader.result
            });
        };
        reader.readAsDataURL(file);
    });

    // Скачивание QR-кода
    function downloadQR() {
        const data = document.getElementById("dataInput").value.trim();
        if (!data) {
            alert("Пожалуйста, введите корректный текст или ссылку.");
            return;
        }
        qrCode.download({ name: "custom-qr", extension: "png" });
    }
</script>

</body>
</html>
