<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Учёт электроэнергии</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: #f4f7fc;
    color: #333;
    padding: 20px;
}
h2 {
    text-align: center;
    margin-bottom: 30px;
    color: #1a73e8;
}

.container {
    max-width: 700px;
    margin: 0 auto;
    background: #fff;
    padding: 25px 30px;
    border-radius: 12px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.1);
}

input[type="number"] {
    width: calc(100% - 20px);
    padding: 8px 10px;
    margin-bottom: 10px;
    border-radius: 6px;
    border: 1px solid #ccc;
    font-size: 16px;
}

button {
    background: #1a73e8;
    color: white;
    border: none;
    padding: 10px 18px;
    font-size: 16px;
    border-radius: 8px;
    cursor: pointer;
    transition: 0.3s;
}
button:hover {
    background: #155ab6;
}

label {
    font-weight: bold;
    display: block;
    margin-top: 10px;
}

table {
    border-collapse: collapse;
    width: 100%;
    margin-top: 20px;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 4px 10px rgba(0,0,0,0.05);
}
th, td {
    padding: 12px;
    text-align: center;
}
th {
    background-color: #1a73e8;
    color: white;
}
tr:nth-child(even) {
    background-color: #f2f4f7;
}

canvas {
    margin-top: 30px;
    border-radius: 12px;
    background: #fff;
    padding: 15px;
    box-shadow: 0 6px 15px rgba(0,0,0,0.05);
}
</style>
</head>
<body>

<div class="container">
<h2>Учёт электроэнергии</h2>

<label>Показание счётчика (кВт·ч):</label>
<input type="number" id="reading" />
<button onclick="addReading()">Добавить</button>

<label>Цена за кВт·ч (грн):</label>
<input type="number" id="price" value="4.32" step="0.01" />

<table>
<thead>
<tr>
<th>Месяц</th>
<th>Показание</th>
<th>Расход (кВт·ч)</th>
<th>Стоимость (грн)</th>
</tr>
</thead>
<tbody id="history"></tbody>
</table>

<canvas id="chart" width="400" height="200"></canvas>
</div>

<script>
let chart;

function loadData() {
    let data = JSON.parse(localStorage.getItem('electricity')) || [];
    let tbody = document.getElementById('history');
    tbody.innerHTML = '';

    let labels = [];
    let consumptions = [];

    for(let i = 0; i < data.length; i++){
        let prev = i > 0 ? data[i-1].value : 0;
        let consumption = data[i].value - prev;
        let cost = consumption * (parseFloat(document.getElementById('price').value) || 0);

        tbody.innerHTML += `<tr>
            <td>${data[i].month}</td>
            <td>${data[i].value}</td>
            <td>${consumption}</td>
            <td>${cost.toFixed(2)}</td>
        </tr>`;

        labels.push(data[i].month);
        consumptions.push(consumption);
    }

    updateChart(labels, consumptions);
}

function addReading() {
    let val = parseFloat(document.getElementById('reading').value);
    if(isNaN(val)) return alert('Введите число!');
    let data = JSON.parse(localStorage.getItem('electricity')) || [];
    let month = new Date().toLocaleString('ru-RU', { month: 'long', year: 'numeric' });
    data.push({month: month, value: val});
    localStorage.setItem('electricity', JSON.stringify(data));
    loadData();
    document.getElementById('reading').value = '';
}

document.getElementById('price').addEventListener('change', loadData);

function updateChart(labels, consumptions) {
    const ctx = document.getElementById('chart').getContext('2d');
    if(chart) chart.destroy();
    chart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: labels,
            datasets: [{
                label: 'Расход электроэнергии (кВт·ч)',
                data: consumptions,
                borderColor: '#1a73e8',
                backgroundColor: 'rgba(26,115,232,0.2)',
                fill: true,
                tension: 0.3,
                pointBackgroundColor: '#1a73e8'
            }]
        },
        options: {
            responsive: true,
            plugins: {
                legend: {
                    labels: {
                        font: {
                            size: 14
                        }
                    }
                }
            },
            scales: {
                y: {
                    beginAtZero: true
                }
            }
        }
    });
}

loadData();
</script>
</body>
</html>
