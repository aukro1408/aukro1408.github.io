<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Учёт электроэнергии</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap');

body {
    font-family: 'Roboto', sans-serif;
    background: #121212;
    color: #eee;
    padding: 20px;
    margin: 0;
}

.container {
    max-width: 800px;
    margin: 0 auto;
    background: #1e1e1e;
    padding: 25px 30px;
    border-radius: 12px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.7);
}

h1 {
    text-align: center;
    font-size: 2em;
    margin-bottom: 20px;
    background: linear-gradient(90deg, #ff004c, #00ffe5, #ffea00, #ff004c);
    background-size: 300% 300%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: gradient 6s ease infinite;
}

@keyframes gradient {
    0%{background-position:0% 50%}
    50%{background-position:100% 50%}
    100%{background-position:0% 50%}
}

input[type="number"], input[type="text"] {
    width: 100%;
    padding: 8px 12px;
    margin: 8px 0;
    border-radius: 8px;
    border: 1px solid #444;
    background: #2b2b2b;
    color: #eee;
    font-size: 16px;
}

button {
    background: #1a73e8;
    color: white;
    border: none;
    padding: 8px 16px;
    font-size: 14px;
    border-radius: 8px;
    cursor: pointer;
    margin: 4px;
    transition: 0.3s;
}
button:hover { background: #155ab6; }

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 20px;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 4px 15px rgba(0,0,0,0.5);
}
th, td {
    padding: 12px;
    text-align: center;
}
th {
    background-color: #1a73e8;
    color: white;
}
tr:nth-child(even) { background-color: #2b2b2b; }

canvas {
    margin-top: 30px;
    border-radius: 12px;
    background: #1e1e1e;
    padding: 15px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.5);
}
</style>
</head>
<body>
<div class="container">
<h1>ул. Запрудная 44</h1>

<label>Месяц (например, Октябрь 2025):</label>
<input type="text" id="month" placeholder="Месяц Год" />
<label>Показание счётчика (кВт·ч):</label>
<input type="number" id="reading" />
<button onclick="addOrUpdateReading()">Сохранить</button>

<label>Цена за кВт·ч (грн):</label>
<input type="number" id="price" value="4.32" step="0.01" />

<table>
<thead>
<tr>
<th>Месяц</th>
<th>Показание</th>
<th>Расход (кВт·ч)</th>
<th>Стоимость (грн)</th>
<th>Действия</th>
</tr>
</thead>
<tbody id="history"></tbody>
</table>

<canvas id="chart" width="400" height="200"></canvas>
</div>

<script>
let chart;

function loadData() {
    let data = JSON.parse(localStorage.getItem('electricity')) || [];
    data.sort((a,b) => new Date(a.date) - new Date(b.date));
    let tbody = document.getElementById('history');
    tbody.innerHTML = '';

    let labels = [];
    let consumptions = [];

    for(let i = 0; i < data.length; i++){
        let prev = i > 0 ? data[i-1].value : 0;
        let consumption = data[i].value - prev;
        let cost = consumption * parseFloat(document.getElementById('price').value);

        tbody.innerHTML += `<tr>
            <td>${data[i].month}</td>
            <td>${data[i].value}</td>
            <td>${consumption}</td>
            <td>${cost.toFixed(2)}</td>
            <td>
                <button onclick="editReading('${data[i].month}')">Редактировать</button>
                <button onclick="deleteReading('${data[i].month}')">Удалить</button>
            </td>
        </tr>`;

        labels.push(data[i].month);
        consumptions.push(consumption);
    }

    updateChart(labels, consumptions);
}

function addOrUpdateReading() {
    let month = document.getElementById('month').value.trim();
    let val = parseFloat(document.getElementById('reading').value);
    if(!month || isNaN(val)) return alert('Введите корректный месяц и число!');
    
    let data = JSON.parse(localStorage.getItem('electricity')) || [];
    let existing = data.find(d => d.month === month);
    
    if(existing){
        existing.value = val;
        existing.date = new Date(month + " 1").toISOString();
    } else {
        data.push({month: month, value: val, date: new Date(month + " 1").toISOString()});
    }

    localStorage.setItem('electricity', JSON.stringify(data));
    loadData();
    document.getElementById('month').value = '';
    document.getElementById('reading').value = '';
}

function editReading(month) {
    let data = JSON.parse(localStorage.getItem('electricity')) || [];
    let entry = data.find(d => d.month === month);
    if(entry){
        document.getElementById('month').value = entry.month;
        document.getElementById('reading').value = entry.value;
    }
}

function deleteReading(month) {
    if(!confirm('Удалить показание за ' + month + '?')) return;
    let data = JSON.parse(localStorage.getItem('electricity')) || [];
    data = data.filter(d => d.month !== month);
    localStorage.setItem('electricity', JSON.stringify(data));
    loadData();
}

document.getElementById('price').addEventListener('change', loadData);

function updateChart(labels, consumptions) {
    const ctx = document.getElementById('chart').getContext('2d');
    if(chart) chart.destroy();
    chart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: labels,
            datasets: [{
                label: 'Расход электроэнергии (кВт·ч)',
                data: consumptions,
                borderColor: '#1a73e8',
                backgroundColor: 'rgba(26,115,232,0.3)',
                fill: true,
                tension: 0.3,
                pointBackgroundColor: '#1a73e8'
            }]
        },
        options: {
            responsive: true,
            plugins: {
                legend: { labels: { font: { size: 14 }, color:'#eee' } }
            },
            scales: {
                x: { ticks: { color: '#eee' } },
                y: { ticks: { color: '#eee' }, beginAtZero: true }
            }
        }
    });
}

loadData();
</script>
</body>
</html>
