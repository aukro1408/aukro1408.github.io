<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IVAN IVANOV | Web & UI/UX Designer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background-color: #1a1a2e;
            color: #ffffff;
            overflow-x: hidden;
        }

        /* Прелоадер */
        .preloader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #1a1a2e;
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Hero-секция */
        .hero-section {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 30px 5%;
            position: relative;
            background: linear-gradient(135deg, #1f005c, #5b0060, #870058);
            background-size: 400% 400%;
            animation: livingGradient 15s ease infinite;
        }

        @keyframes livingGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .header-nav {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            opacity: 0;
        }

        .hero-content {
            text-align: center;
            transform: translateY(20px);
            opacity: 0;
        }

        .main-title {
            font-size: 5vw;
            line-height: 1.2;
            margin-bottom: 20px;
        }

        .tagline {
            font-size: 1.4rem;
            margin-bottom: 30px;
            opacity: 0;
        }

        .cta-button {
            display: inline-block;
            padding: 15px 40px;
            text-decoration: none;
            background: linear-gradient(90deg, #00c6ff, #0072ff);
            border-radius: 50px;
            color: white;
            font-weight: bold;
            transition: all 0.3s ease-in-out;
            transform: scale(0.8);
            opacity: 0;
        }

        /* Фолбэк: если анимация не сработала — кнопка появится через CSS */
        .hero-content.loaded .cta-button,
        .hero-content.loaded .tagline,
        .hero-content.loaded {
            opacity: 1 !important;
            transform: translateY(0) scale(1) !important;
        }

        .cta-button:hover {
            box-shadow: 0 0 20px rgba(0, 198, 255, 0.8);
            transform: scale(1.05);
        }

        /* Кастомный курсор */
        .custom-cursor {
            position: fixed;
            width: 20px;
            height: 20px;
            border: 2px solid white;
            border-radius: 50%;
            pointer-events: none;
            z-index: 9998;
            mix-blend-mode: difference;
            transform: translate(-50%, -50%);
            transition: transform 0.2s ease;
        }
    </style>
</head>
<body>
    <div class="preloader">
        <svg class="logo-loader" viewBox="0 0 100 100" width="80" height="80">
            <circle cx="50" cy="50" r="40" stroke="white" stroke-width="4" fill="none" />
        </svg>
    </div>

    <header class="hero-section">
        <nav class="header-nav">
            <div class="logo">IV</div>
            <ul class="nav-links">
                <li><a href="#about">ABOUT</a></li>
                <li><a href="#skills">SKILLS</a></li>
                <li><a href="#projects">PROJECTS</a></li>
                <li><a href="#contact">CONTACT</a></li>
            </ul>
        </nav>

        <div class="hero-content">
            <h1 class="main-title">
                <span class="name-part">IVAN IVANOV</span><br>
                <span class="designation-part">WEB & UI/UX DESIGNER</span>
            </h1>
            <p class="tagline">Crafting digital experiences with passion and precision</p>
            <a href="#projects" class="cta-button">VIEW WORK</a>
        </div>

        <div class="scroll-indicator" style="position: absolute; bottom: 30px; font-size: 0.9rem; opacity: 0.7;">SCROLL DOWN</div>
    </header>

    <!-- GSAP без пробелов! -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const preloader = document.querySelector('.preloader');
            const heroContent = document.querySelector('.hero-content');
            const headerNav = document.querySelector('.header-nav');
            const ctaButton = document.querySelector('.cta-button');
            const mainTitle = document.querySelector('.main-title');
            const tagline = heroContent.querySelector('.tagline');

            // Фолбэк: если через 2.5 секунды ничего не анимировалось — показываем всё
            setTimeout(() => {
                if (!heroContent.classList.contains('loaded')) {
                    heroContent.classList.add('loaded');
                }
            }, 2500);

            // Проверяем, загрузился ли GSAP
            if (typeof gsap === 'undefined') {
                console.warn('GSAP не загружен. Используется фолбэк-появление.');
                heroContent.classList.add('loaded');
                preloader.style.display = 'none';
                return;
            }

            const masterTL = gsap.timeline({ defaults: { ease: "power3.inOut" } });

            masterTL.to(preloader, {
                duration: 1.2,
                opacity: 0,
                scale: 1.1,
                ease: "power2.inOut",
                onComplete: () => {
                    preloader.style.display = 'none';
                }
            });

            masterTL.from(headerNav, { y: -40, opacity: 0, duration: 0.7 }, "-=0.8");
            masterTL.from(mainTitle.children, { y: 40, opacity: 0, stagger: 0.15, duration: 0.6 }, "-=0.6");
            masterTL.from(tagline, { y: 20, opacity: 0, duration: 0.5 }, "-=0.4");
            masterTL.from(ctaButton, { 
                scale: 0.4, 
                opacity: 0, 
                duration: 0.7, 
                ease: "elastic.out(1, 0.6)" 
            }, "-=0.3");

            // После завершения анимации добавляем класс для надёжности
            masterTL.eventCallback("onComplete", () => {
                heroContent.classList.add('loaded');
            });

            // Кастомный курсор
            const customCursor = document.createElement('div');
            customCursor.classList.add('custom-cursor');
            document.body.appendChild(customCursor);

            document.addEventListener('mousemove', (e) => {
                gsap.to(customCursor, {
                    x: e.clientX,
                    y: e.clientY,
                    duration: 0.3,
                    ease: "power2.out"
                });
            });

            // Эффект при наведении на интерактивные элементы
            const interactives = document.querySelectorAll('a, button, .cta-button');
            interactives.forEach(el => {
                el.addEventListener('mouseenter', () => {
                    customCursor.style.transform = 'translate(-50%, -50%) scale(1.8)';
                });
                el.addEventListener('mouseleave', () => {
                    customCursor.style.transform = 'translate(-50%, -50%) scale(1)';
                });
            });
        });
    </script>
</body>
</html>
