<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NUORBIT - Cyberpunk Hero Section</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800;900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================================
       1. СБРОС СТИЛЕЙ И БАЗОВЫЕ НАСТРОЙКИ
       ========================================================================== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #020608;
      color: #ffffff;
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
    }

    /* ==========================================================================
       2. ГЛАВНЫЙ ЭКРАН (HERO SECTION)
       ========================================================================== */
    .hero {
      position: relative;
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 30px 80px;
      overflow: hidden;
    }

    /* Фоновое свечение (как на фото) */
    .hero::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 80vw;
      height: 80vh;
      background: radial-gradient(circle, rgba(0, 243, 255, 0.12) 0%, rgba(2, 6, 8, 0) 70%);
      z-index: 1;
      pointer-events: none;
    }

    /* ==========================================================================
       3. АНИМИРОВАННЫЙ НЕОНОВЫЙ ПОРТАЛ (ЦЕНТР)
       ========================================================================== */
    .portal-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 500px;
      height: 500px;
      z-index: 2;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .portal-ring {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 2px solid rgba(0, 243, 255, 0.4);
      /* Мощное неоновое свечение из макета */
      box-shadow: 
        0 0 20px rgba(0, 243, 255, 0.6),
        inset 0 0 20px rgba(0, 243, 255, 0.6),
        0 0 60px rgba(0, 243, 255, 0.3),
        inset 0 0 60px rgba(0, 243, 255, 0.3);
      position: relative;
      animation: portalPulse 4s ease-in-out infinite alternate, rotateRing 20s linear infinite;
    }

    /* Внутреннее дополнительное кольцо для детализации */
    .portal-ring::after {
      content: '';
      position: absolute;
      top: 15px;
      left: 15px;
      right: 15px;
      bottom: 15px;
      border-radius: 50%;
      border: 1px dashed rgba(0, 243, 255, 0.3);
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
    }

    /* Эффект шума/дыма внутри портала (SVG Фильтр) */
    .portal-smoke {
      position: absolute;
      width: 90%;
      height: 90%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 243, 255, 0.2) 0%, rgba(0,0,0,0) 70%);
      filter: url(#shadow-smoke);
      opacity: 0.7;
      animation: smokeFloat 6s ease-in-out infinite alternate;
    }

    /* Силуэт персонажа в центре портала */
    .character-silhouette {
      position: absolute;
      bottom: 0;
      width: 180px;
      height: 280px;
      /* Черный силуэт с неоновым контуром */
      background: #020608;
      clip-path: polygon(50% 0%, 80% 20%, 90% 50%, 75% 100%, 25% 100%, 10% 50%, 20% 20%);
      border: 1px solid rgba(0, 243, 255, 0.5);
      box-shadow: 0 0 20px rgba(0, 243, 255, 0.3);
      z-index: 3;
      transform: translateY(40px);
      filter: blur(0.5px);
    }

    /* ==========================================================================
       4. ИНТЕРФЕЙС И ТЕКСТ (НАЛОЖЕНИЕ СВЕРХУ)
       ========================================================================== */
    .header-nav {
      position: relative;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .logo {
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: 24px;
      letter-spacing: 4px;
      color: #fff;
      text-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
    }

    .nav-links a {
      color: #8a99ad;
      text-decoration: none;
      margin-left: 35px;
      font-size: 14px;
      letter-spacing: 1px;
      transition: color 0.3s, text-shadow 0.3s;
    }

    .nav-links a:hover, .nav-links a.active {
      color: #00f3ff;
      text-shadow: 0 0 8px rgba(0, 243, 255, 0.6);
    }

    /* Центральный контент */
    .main-content {
      position: relative;
      text-align: center;
      z-index: 10;
      margin-top: 50px;
    }

    /* Эффект глитча для заголовка NUORBIT */
    .title-main {
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: 110px;
      letter-spacing: 25px;
      text-transform: uppercase;
      line-height: 1;
      margin-bottom: 15px;
      position: relative;
      color: #fff;
      animation: textGlitch 5s infinite;
    }

    .subtitle {
      font-size: 13px;
      letter-spacing: 6px;
      color: #8a99ad;
      font-weight: 400;
    }

    /* Нижняя часть экрана (Кнопка и Статистика) */
    .hero-footer {
      position: relative;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      z-index: 10;
    }

    .btn-join {
      background: transparent;
      border: 1px solid #00f3ff;
      color: #00f3ff;
      padding: 14px 35px;
      font-family: 'Orbitron', sans-serif;
      font-size: 14px;
      letter-spacing: 2px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
      transition: all 0.3s ease;
    }

    .btn-join:hover {
      background: #00f3ff;
      color: #020608;
      box-shadow: 0 0 25px rgba(0, 243, 255, 0.6);
      transform: translateY(-2px);
    }

    .stats-container {
      display: flex;
      gap: 50px;
    }

    .stat-box h3 {
      font-family: 'Orbitron', sans-serif;
      font-size: 24px;
      color: #fff;
      margin-bottom: 5px;
    }

    .stat-box p {
      font-size: 11px;
      color: #64748b;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    /* ==========================================================================
       5. CSS АНИМАЦИИ (KEYFRAMES)
       ========================================================================== */
    
    /* Пульсация яркости портала */
    @keyframes portalPulse {
      0% {
        transform: scale(0.98);
        box-shadow: 
          0 0 20px rgba(0, 243, 255, 0.5),
          inset 0 0 20px rgba(0, 243, 255, 0.5),
          0 0 40px rgba(0, 243, 255, 0.2);
      }
      100% {
        transform: scale(1.02);
        box-shadow: 
          0 0 35px rgba(0, 243, 255, 0.8),
          inset 0 0 35px rgba(0, 243, 255, 0.8),
          0 0 80px rgba(0, 243, 255, 0.5);
      }
    }

    /* Медленное вращение портала */
    @keyframes rotateRing {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Движение дыма внутри */
    @keyframes smokeFloat {
      0% { transform: scale(1) translate(0, 0); opacity: 0.5; }
      100% { transform: scale(1.05) translate(5px, -5px); opacity: 0.8; }
    }

    /* Легкое цифровое мерцание текста (под киберпанк) */
    @keyframes textGlitch {
      0%, 92%, 100% { text-shadow: 0 0 10px rgba(0, 243, 255, 0.2); }
      93% { text-shadow: 3px 0 0 rgba(255,0,100,0.8), -3px 0 0 rgba(0,243,255,0.8); }
      95% { text-shadow: -2px 0 0 rgba(255,0,100,0.8), 2px 0 0 rgba(0,243,255,0.8); }
      97% { text-shadow: 0 0 10px rgba(0, 243, 255, 0.2); }
    }
  </style>
</head>
<body>

  <section class="hero">
    
    <header class="header-nav">
      <div class="logo">NUORBIT</div>
      <nav class="nav-links">
        <a href="#" class="active">Home</a>
        <a href="#">Marketplace</a>
        <a href="#">Artists</a>
        <a href="#">Community</a>
      </nav>
    </header>

    <div class="portal-container">
      <div class="portal-ring"></div>
      <div class="portal-smoke"></div>
      <div class="character-silhouette"></div>
    </div>

    <div class="main-content">
      <h1 class="title-main">Nuorbit</h1>
      <p class="subtitle">DISCOVER DIGITAL ART AND COLLECT NFTS</p>
    </div>

    <div class="hero-footer">
      <button class="btn-join">JOIN US</button>
      
      <div class="stats-container">
        <div class="stat-box">
          <h3>27K+</h3>
          <p>Artwork</p>
        </div>
        <div class="stat-box">
          <h3>876K+</h3>
          <p>Auction</p>
        </div>
        <div class="stat-box">
          <h3>12K+</h3>
          <p>Artist</p>
        </div>
      </div>
    </div>

  </section>

  <svg style="display: none;">
    <filter id="shadow-smoke">
      <feTurbulence type="fractalNoise" baseFrequency="0.015" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="40" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </svg>

</body>
</html>
