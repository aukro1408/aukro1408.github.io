<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Chat — DenisDesign</title>
  <style>
    :root {
      --bg: #0f0f1a;
      --card: #1a1a2e;
      --accent: #7e22ce;
      --text: #e0e0ff;
      --glow: 0 0 15px rgba(126, 34, 206, 0.4);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      position: relative;
    }

    .background-circles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      overflow: hidden;
    }

    .circle {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle, var(--accent), transparent 70%);
      animation: pulse 8s infinite alternate;
    }

    .circle:nth-child(1) {
      width: 400px;
      height: 400px;
      top: -100px;
      left: -100px;
      animation-delay: 0s;
    }

    .circle:nth-child(2) {
      width: 600px;
      height: 600px;
      bottom: -150px;
      right: -150px;
      animation-delay: -2s;
    }

    .circle:nth-child(3) {
      width: 300px;
      height: 300px;
      bottom: 30%;
      left: 20%;
      animation-delay: -4s;
    }

    @keyframes pulse {
      from { transform: scale(1); opacity: 0.6; }
      to { transform: scale(1.1); opacity: 0.8; }
    }

    .container {
      max-width: 700px;
      margin: 60px auto 40px;
      padding: 30px;
      background: var(--card);
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
      font-size: 2.2rem;
      background: linear-gradient(135deg, #e0e0ff, #a0a0ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 2px 10px rgba(126, 34, 206, 0.2);
    }

    input, button {
      width: 100%;
      padding: 16px;
      margin-bottom: 20px;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: all 0.3s ease;
    }

    input:focus {
      outline: none;
      box-shadow: var(--glow);
      background: rgba(255, 255, 255, 0.1);
    }

    button {
      background: linear-gradient(135deg, var(--accent), #5a189a);
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.3s;
    }

    button:hover {
      transform: translateY(-3px);
      box-shadow: var(--glow);
    }

    #output {
      min-height: 120px;
      padding: 20px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 12px;
      margin-top: 20px;
      line-height: 1.6;
      border-left: 4px solid var(--accent);
      animation: fadeIn 0.6s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .footer {
      text-align: center;
      margin-top: auto;
      padding: 20px;
      font-size: 0.9rem;
      color: rgba(224, 224, 255, 0.6);
      letter-spacing: 1px;
    }

    .footer span {
      color: var(--accent);
      font-weight: 600;
    }

    @media (max-width: 600px) {
      .container {
        margin: 30px 15px;
        padding: 20px;
      }
      h1 {
        font-size: 1.8rem;
      }
    }
  </style>
</head>
<body>

  <div class="background-circles">
    <div class="circle"></div>
    <div class="circle"></div>
    <div class="circle"></div>
  </div>

  <div class="container">
    <h1>AI Чат</h1>
    <input type="text" id="userInput" placeholder="Напишите ваш запрос..." autocomplete="off">
    <button onclick="sendToAI()">Отправить</button>
    <div id="output">Ожидание запроса...</div>
  </div>

  <div class="footer">
    Создано с ❤️ для вас — <span>DenisDesign</span>
  </div>

  <script>
    // 🔑 ВСТАВЬТЕ СВОЙ КЛЮЧ ОТ OPENROUTER ЗДЕСЬ
    const openRouterKey = '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'; // 👈👉 ЗАМЕНИТЕ ЭТО НА СВОЙ КЛЮЧ!

    async function sendToAI() {
      const input = document.getElementById("userInput").value.trim();
      if (!input) return;

      const output = document.getElementById("output");
      output.innerText = "Генерирую ответ...";

      try {
        const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
          method: "POST",
          headers: {
            "Authorization": `Bearer ${openRouterKey}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            model: "openai/gpt-4o", // Можно менять: "anthropic/claude-3-haiku", "mistralai/mistral-small" и т.д.
            messages: [{ role: "user", content: input }]
          })
        });

        const data = await response.json();
        const aiResponse = data.choices[0]?.message?.content || "Не удалось получить ответ.";

        output.innerText = aiResponse;
      } catch (err) {
        output.innerText = "Ошибка: " + err.message + "\n\nПроверьте ключ и подключение к интернету.";
        console.error(err);
      }

      document.getElementById("userInput").value = "";
    }
  </script>

</body>
</html>
