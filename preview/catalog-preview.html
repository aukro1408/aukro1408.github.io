<style>

  .page { max-width: 520px; margin: 0 auto; padding: 84px 14px 100px; }

  /* --- верх: пилюли --- */
  .pills { position: relative; display: flex; gap: 10px; margin-bottom: 16px; }
  .pill { display: inline-flex; align-items: center; gap: 8px; background: #1a1a1a; border: 1px solid rgba(255,255,255,.08); color: #fff; border-radius: 999px; padding: 10px 16px; font-size: 15px; font-weight: 700; }
  .pill svg { flex: none; }
  .pill .cnt { color: #f7c948; }
  body.tv .pill { font-size: 18px; padding: 12px 22px; }
  .sort-menu { display: none; position: absolute; top: 52px; right: 0; width: 280px; background: #1e1e1e; border: 1px solid rgba(255,255,255,.08); border-radius: 16px; overflow: hidden; z-index: 50; box-shadow: 0 12px 32px rgba(0,0,0,.5); }
  .sort-menu.open { display: block; }
  .sort-menu button { display: flex; justify-content: space-between; align-items: center; width: 100%; background: transparent; border: 0; border-bottom: 1px solid rgba(255,255,255,.06); color: #fff; font-size: 16px; padding: 14px 16px; text-align: left; }
  .sort-menu button:last-child { border-bottom: 0; }
  .sort-menu button .chk { color: #f7c948; font-size: 18px; visibility: hidden; }
  .sort-menu button.sel .chk { visibility: visible; }
  .sort-menu button.sel { color: #f7c948; }
  body.tv .sort-menu { width: 340px; top: 60px; }
  body.tv .sort-menu button { font-size: 19px; padding: 17px 20px; }

  /* --- сетка --- */

  body.tv .grid { grid-template-columns: repeat(7, 1fr); gap: 20px; }
  .card { cursor: pointer; }
  .poster { position: relative; aspect-ratio: 2/3; border-radius: 14px; overflow: hidden; background: #1a1a1a; }
  .poster img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card .t { font-size: 15px; font-weight: 700; line-height: 1.25; margin-top: 8px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card .m { font-size: 13px; color: #9a9a9a; margin-top: 3px; }
  .rate { position: absolute; top: 8px; right: 8px; height: 24px; padding: 0 8px; border-radius: 12px; background: #f7c948; color: #1a1304; font-size: 12px; font-weight: 800; display: flex; align-items: center; gap: 3px; }
  body.tv .card .t { font-size: 17px; } body.tv .card .m { font-size: 15px; }
  body.tv .rate { top: 10px; right: 10px; height: 30px; padding: 0 11px; border-radius: 15px; font-size: 14px; }
  .empty { text-align: center; padding: 60px 20px; color: #9a9a9a; font-size: 15px; line-height: 1.5; }
  .empty button { margin-top: 16px; background: #f7c948; border: 0; color: #1a1304; font-weight: 800; font-size: 15px; padding: 12px 22px; border-radius: 999px; }

  /* --- верхний док (наш главный навбар, порт home-preview 1:1) --- */
  .dock-wrap { position: fixed; left: 50%; top: 0; z-index: 70; width: 688px; height: 64px; margin-left: -344px; transform-origin: 50% 0; }
  .dock { padding: 6px; border-radius: 34px; background: transparent; -webkit-backdrop-filter: blur(10px) saturate(1.3); backdrop-filter: blur(10px) saturate(1.3); border: 1px solid rgba(255,255,255,0.16); }
  .dock-inner { position: relative; display: flex; gap: 4px; }
  .dock-thumb { position: absolute; left: 0; top: 0; width: 132px; height: 52px; border-radius: 26px; background: linear-gradient(135deg, #f8e8b6 0%, #e4b857 48%, #b8802a 100%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.6); }
  .dock button { border: 0; font-family: inherit; padding: 0; cursor: pointer; position: relative; z-index: 1; width: 132px; height: 52px; border-radius: 26px; background: transparent; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; color: #ece6d8; }
  .dock button.active { color: #2a1c04; }
  .dock button svg { flex: none; }

  /* --- страница фильтров --- */
  .flt { display: none; position: fixed; inset: 0; z-index: 60; background: #0a0a0a; overflow-y: auto; padding: 84px 14px 220px; }
  .flt.open { display: block; }
  body.tv .flt { padding: 96px 28px 260px; }

  .flt-head button { background: transparent; border: 0; color: #fff; font-size: 28px; line-height: 1; padding: 4px 8px; }
  .numsec { background: #141414; border: 1px solid rgba(255,255,255,.06); border-radius: 18px; padding: 16px; margin-bottom: 12px; }
  .numsec .lab { display: flex; justify-content: space-between; font-size: 15px; color: #9a9a9a; margin-bottom: 12px; }
  .numsec .lab b { color: #fff; font-size: 16px; }
  .numin { display: flex; align-items: center; gap: 10px; }
  .numin input, .numin select { flex: 1; min-width: 0; background: #1e1e1e; border: 1px solid rgba(255,255,255,.1); color: #fff; border-radius: 12px; padding: 12px 14px; font-size: 16px; font-family: inherit; outline: none; }
  .numin input:focus, .numin select:focus { border-color: #f7c948; }
  .numin span { color: #9a9a9a; }
  body.tv .numsec .lab, body.tv .numsec .lab b { font-size: 18px; }
  body.tv .numin input, body.tv .numin select { font-size: 18px; padding: 14px 16px; }
  .rows { background: #141414; border: 1px solid rgba(255,255,255,.06); border-radius: 18px; overflow: hidden; }
  .row { display: flex; justify-content: space-between; align-items: center; width: 100%; background: transparent; border: 0; border-bottom: 1px solid rgba(255,255,255,.06); color: #fff; padding: 16px; text-align: left; }
  .row:last-child { border-bottom: 0; }
  .row .rl { display: flex; flex-direction: column; gap: 2px; }
  .row .rl b { font-size: 16px; }
  .row .rl span { font-size: 14px; color: #9a9a9a; }
  .row .arr { color: #9a9a9a; font-size: 22px; }
  body.tv .row .rl b { font-size: 19px; } body.tv .row .rl span { font-size: 16px; }
  .flt-foot { position: fixed; left: 14px; right: 14px; bottom: 20px; z-index: 61; display: flex; flex-direction: column; gap: 10px; }
  body.tv .flt-foot { left: 28px; right: 28px; bottom: 20px; }
  .flt-foot button { width: 100%; border-radius: 999px; padding: 16px; font-size: 17px; font-weight: 800; }
  .flt-foot .show { background: #f7c948; border: 0; color: #1a1304; }
  .flt-foot .reset { background: #1a1a1a; border: 1px solid rgba(255,255,255,.12); color: #fff; }

  /* --- шторка выбора --- */
  .sheet { display: none; position: fixed; inset: 0; z-index: 80; background: #0a0a0a; overflow-y: auto; padding: 16px 14px 120px; }
  .sheet.open { display: block; }
  .sheet-head { display: flex; align-items: center; gap: 12px; font-size: 22px; font-weight: 800; margin-bottom: 16px; }
  .sheet-head button { background: transparent; border: 0; color: #fff; font-size: 28px; padding: 4px 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 10px; }
  .chip { background: #1a1a1a; border: 1px solid rgba(255,255,255,.1); color: #fff; border-radius: 999px; padding: 11px 18px; font-size: 15px; font-weight: 700; }
  .chip.on { background: #f7c948; border-color: #f7c948; color: #1a1304; }
  .sheet-foot { position: fixed; left: 14px; right: 14px; bottom: 20px; z-index: 81; display: flex; gap: 10px; }
  .sheet-foot button { flex: 1; border-radius: 999px; padding: 15px; font-size: 16px; font-weight: 800; }
  .sheet-foot .done { background: #f7c948; border: 0; color: #1a1304; }
  .sheet-foot .clear { background: #1a1a1a; border: 1px solid rgba(255,255,255,.12); color: #fff; }

  /* --- превью-переключатель (только для превью, в приложении его нет) --- */
  .pv-toggle { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); z-index: 100; display: flex; background: rgba(26,26,26,.9); border: 1px solid rgba(255,255,255,.12); border-radius: 999px; padding: 3px; }

  .toast { display: none; position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); z-index: 90; background: #1e1e1e; border: 1px solid rgba(255,255,255,.12); color: #fff; font-size: 14px; padding: 12px 20px; border-radius: 999px; white-space: nowrap; }

function syncDraftUI(){
  $('inTmdbMin').value = draft.tmdb[0]; $('inTmdbMax').value = draft.tmdb[1];
  $('inYearMin').value = draft.year[0]; $('inYearMax').value = draft.year[1];
  $('v-cat').textContent = draft.cat;
  $('v-quality').textContent = draft.quality;
  $('v-genre').textContent = draft.genre;
  $('v-country').textContent = draft.country;
  $('v-exclude').textContent = draft.exclude.length ? draft.exclude.join(', ') : 'Ничего не исключено';
}
function readNums(){
  function num(el, def){ const v = parseFloat(el.value); return isNaN(v) ? def : v; }
  draft.tmdb = [parseInt($('inTmdbMin').value, 10) || 1, parseInt($('inTmdbMax').value, 10) || 10];
  draft.year = [Math.min(2030, Math.max(1895, Math.round(num($('inYearMin'), 1895)))), Math.min(2030, Math.max(1895, Math.round(num($('inYearMax'), 2030))))];
}
function openSheet(rowKey){
  const row = ROWS[rowKey];
  $('sheetTitle').textContent = row.title;
  const cur = draft[row.key];
  $('chips').innerHTML = row.opts.map(function(o){
    const on = row.multi ? cur.indexOf(o) >= 0 : cur === o;
    return '<button class="chip' + (on ? ' on' : '') + '" data-v="' + o + '">' + o + '</button>';
  }).join('');
  $('sheetFoot').hidden = !row.multi;
  $('sheet').dataset.row = rowKey;
  $('sheet').classList.add('open');
  $('chips').querySelectorAll('.chip').forEach(function(ch){
    ch.addEventListener('click', function(){
      const v = ch.dataset.v;
      if (row.multi) {
        const i = draft.exclude.indexOf(v);
        if (i >= 0) draft.exclude.splice(i, 1); else draft.exclude.push(v);
        ch.classList.toggle('on');
      } else {
        draft[row.key] = v;
        syncDraftUI();
        $('sheet').classList.remove('open');
      }
    });
  });
}
document.querySelectorAll('.row').forEach(function(r){
  r.addEventListener('click', function(){ readNums(); openSheet(r.dataset.row); });
});
$('sheetBack').addEventListener('click', function(){ $('sheet').classList.remove('open'); syncDraftUI(); });
$('sheetDone').addEventListener('click', function(){ $('sheet').classList.remove('open'); syncDraftUI(); });
$('sheetClear').addEventListener('click', function(){ draft.exclude = []; $('sheet').classList.remove('open'); syncDraftUI(); });
$('fltBtn').addEventListener('click', function(){ draft = JSON.parse(JSON.stringify(applied)); syncDraftUI(); $('fltPage').classList.add('open'); });
$('fltClose').addEventListener('click', function(){ $('fltPage').classList.remove('open'); });
$('fltShow').addEventListener('click', function(){ readNums(); applied = JSON.parse(JSON.stringify(draft)); $('fltPage').classList.remove('open'); renderGrid(); });
$('fltReset').addEventListener('click', function(){ applied = JSON.parse(JSON.stringify(DEFAULTS)); draft = JSON.parse(JSON.stringify(DEFAULTS)); $('fltPage').classList.remove('open'); renderGrid(); });
$('emptyReset').addEventListener('click', function(){ applied = JSON.parse(JSON.stringify(DEFAULTS)); renderGrid(); });
$('sortBtn').addEventListener('click', function(e){ e.stopPropagation(); $('sortMenu').classList.toggle('open'); });
document.addEventListener('click', function(e){ if (!$('sortMenu').contains(e.target) && e.target !== $('sortBtn')) $('sortMenu').classList.remove('open'); });
SORTS.forEach(function(s){
  const b = document.createElement('button');
  b.innerHTML = s.label + '<span class="chk">✓</span>';
  if (s.id === sortId) b.classList.add('sel');
  b.addEventListener('click', function(){
    sortId = s.id;
    $('sortLabel').textContent = s.short;
    $('sortMenu').querySelectorAll('button').forEach(function(x){ x.classList.remove('sel'); });
    b.classList.add('sel');
    $('sortMenu').classList.remove('open');
    renderGrid();
  });
  $('sortMenu').appendChild(b);
});
document.querySelectorAll('[data-toast]').forEach(function(b){
  b.addEventListener('click', function(){
    const t = $('toast');
    t.textContent = b.dataset.toast;
    t.classList.add('show');
    setTimeout(function(){ t.classList.remove('show'); }, 1800);
  });
});
$('pvPhone').addEventListener('click', function(){ document.body.classList.remove('tv'); $('pvPhone').classList.add('on'); $('pvTV').classList.remove('on'); });
$('pvTV').addEventListener('click', function(){ document.body.classList.add('tv'); $('pvTV').classList.add('on'); $('pvPhone').classList.remove('on'); });
document.querySelectorAll('[data-goto]').forEach(function(b){
  b.addEventListener('click', function(){ location.href = b.dataset.goto; });
});
(function(){
  function fitDock(){
    var s2 = Math.min(1, (document.documentElement.clientWidth - 32) / 688);
    document.getElementById('dockWrap').style.transform = 'scale(' + s2 + ')';
  }
  addEventListener('resize', fitDock);
  fitDock();
})();
renderGrid();
</script>
</body>
</html>
