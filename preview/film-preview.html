<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1922 — страница фильма v3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #07080d; color: #fff; font-family: 'Nunito', system-ui, sans-serif; min-height: 100vh; }
  .back { position: fixed; top: 14px; left: 14px; z-index: 10; display: inline-flex; align-items: center; gap: 6px; background: rgba(0,0,0,.55); border: 1px solid rgba(255,255,255,.2); color: #fff; font-family: inherit; font-size: 14px; font-weight: 700; padding: 9px 16px; border-radius: 99px; text-decoration: none; -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
  .poster { width: 100%; display: block; }
  .poster-wrap { position: relative; }
  .poster-wrap::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 170px; background: linear-gradient(180deg, transparent, rgba(7,8,13,.88)); }
  .info { position: absolute; left: 0; right: 0; bottom: 0; z-index: 2; padding: 14px; }
  h1 { font-family: 'Manrope', sans-serif; font-size: 26px; font-weight: 700; line-height: 1.15; }
  .rating { margin-top: 6px; display: flex; align-items: center; gap: 6px; font-family: 'Manrope', sans-serif; font-size: 17px; font-weight: 700; }
  .rating .star { color: #e4b857; }
  .rating .src { font-size: 12px; font-weight: 600; color: rgba(255,255,255,.5); }
  .facts { margin-top: 8px; font-size: 14px; color: rgba(255,255,255,.7); }
  .genres { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 8px; }
  .genres span { background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.16); font-size: 13px; font-weight: 700; padding: 7px 14px; border-radius: 99px; }
  .desc-wrap { padding: 20px 14px 32px; }
  .desc { font-size: 15px; line-height: 1.5; color: rgba(255,255,255,.85); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .desc.open { display: block; }
  .desc-more { margin-top: 8px; background: none; border: 0; color: #e4b857; font-family: inherit; font-size: 14px; font-weight: 700; padding: 0; cursor: pointer; }
</style>
</head>
<body>
<a class="back" href="collections-preview.html?v=4">← Назад</a>
<div class="poster-wrap">
  <img class="poster" src="https://image.tmdb.org/t/p/w500/q4FQOiSRhTLWulHl5Vpg37FMArH.jpg" alt="1922">
  <div class="info">
    <h1>1922</h1>
    <div class="rating"><span class="star">★</span> 5.95 <span class="src">TMDB</span></div>
    <div class="facts">2017 · США · 1 ч 42 мин</div>
    <div class="genres"><span>Ужасы</span><span>Криминал</span><span>Драма</span></div>
  </div>
</div>
<div class="desc-wrap">
  <p class="desc" id="desc">История о фермере Уилфреде Джеймсе, который с помощью сына-подростка убил свою жену и бросил её тело на растерзание крысам. С тех пор крысы-трупоеды следуют за Уилфредом по пятам, ломая ему жизнь и доводя до безумия.</p>
  <button class="desc-more" id="descMore">Показать полностью</button>
</div>
<script>
  document.getElementById('descMore').addEventListener('click', function (e) {
    var d = document.getElementById('desc');
    var open = d.classList.toggle('open');
    e.currentTarget.textContent = open ? 'Свернуть' : 'Показать полностью';
  });
</script>
</body>
</html>
