<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Плеер — Reelo-поведение, наши цвета</title>
<style>
  /* Плеер по мотивам Reelo: поведение и меню оттуда, цвета наши */
  :root {
    --pl-accent: #f7c948;
    --pl-ink: #1a1405;
    --pl-btn: #15161d;
    --pl-panel: #0f1118;
    --pl-chip: #1b1c22;
    --pl-muted: #9a9ba3;
  }
  .pl {
    position: relative; width: 100%; height: 100%;
    background: #000; color: #fff; overflow: hidden;
    font: 400 16px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    user-select: none; -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent; outline: 0;
  }
  .pl video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
  .pl svg { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; display: block; }
  .pl [data-f] { outline: 0; cursor: pointer; }

  .pl-sub {
    position: absolute; left: 8%; right: 8%; bottom: 7%;
    text-align: center; line-height: 1.35; pointer-events: none;
    transition: bottom .25s; display: none;
  }
  .pl-sub span { font-weight: 500; border-radius: .35em; padding: .05em .45em; box-decoration-break: clone; -webkit-box-decoration-break: clone; }

  .pl-spin {
    position: absolute; left: 50%; top: 50%; width: 3.4em; height: 3.4em; margin: -1.7em 0 0 -1.7em;
    border-radius: 50%; border: .3em solid rgba(255, 255, 255, .15); border-top-color: var(--pl-accent);
    animation: pl-rot .9s linear infinite; display: none; pointer-events: none;
  }
  .pl.busy .pl-spin { display: block; }
  @keyframes pl-rot { to { transform: rotate(360deg); } }
  .pl-err {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    padding: .8em 1.4em; border-radius: 2em; background: var(--pl-btn); font-size: 1.1em; display: none; text-align: center;
  }
  .pl.fail .pl-err { display: block; }
  .pl.fail .pl-spin { display: none; }

  .pl-toast {
    position: absolute; left: 50%; top: 14%; transform: translate(-50%, -.6em);
    padding: .55em 1.2em; border-radius: 2em; background: var(--pl-accent); color: var(--pl-ink);
    font-weight: 500; font-size: 1.05em; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; white-space: nowrap;
  }
  .pl-toast.show { opacity: 1; transform: translate(-50%, 0); }

  .pl-ui { position: absolute; inset: 0; transition: opacity .25s; }
  .pl-ui.hide { opacity: 0; pointer-events: none; }
  .pl-shade { position: absolute; left: 0; right: 0; pointer-events: none; }
  .pl-shade.t { top: 0; height: 8em; background: linear-gradient(rgba(8, 10, 16, .85), rgba(8, 10, 16, 0)); }
  .pl-shade.b { bottom: 0; height: 12em; background: linear-gradient(rgba(8, 10, 16, 0), rgba(8, 10, 16, .9)); }

  .pl-top { position: absolute; left: 1.2em; right: 1.2em; top: 1em; display: flex; align-items: center; gap: .9em; }
  .pl-round {
    flex: none; width: 2.9em; height: 2.9em; border-radius: 50%; background: var(--pl-btn); color: var(--pl-accent);
    display: flex; align-items: center; justify-content: center;
    transition: transform .18s cubic-bezier(.2, .8, .2, 1), background .18s, color .18s, box-shadow .18s;
  }
  .pl-round svg { width: 1.5em; height: 1.5em; }
  .pl-ttl b { display: block; font-size: 1.3em; font-weight: 500; line-height: 1.15; }
  .pl-ttl small { font-size: .85em; color: var(--pl-muted); }

  .pl-mid { position: absolute; left: 0; right: 0; top: 46%; transform: translateY(-50%); display: flex; align-items: center; justify-content: center; gap: 2.2em; }
  .pl-skip { width: 3.8em; height: 3.8em; color: #fff; }
  .pl-skip svg { width: 2.2em; height: 2.2em; stroke-width: 1.8; }
  .pl-skip text { fill: #fff; stroke: none; font-size: 7.5px; font-weight: 500; font-family: system-ui, sans-serif; }
  .pl-play {
    position: relative; width: 5em; height: 5em; border-radius: 50%; background: var(--pl-accent); color: var(--pl-ink);
    display: flex; align-items: center; justify-content: center;
    transition: transform .18s cubic-bezier(.2, .8, .2, 1), box-shadow .18s;
  }
  .pl-play svg { width: 2.3em; height: 2.3em; fill: var(--pl-ink); stroke: none; }
  .pl-play::before, .pl-play::after {
    content: ""; position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--pl-accent);
    opacity: 0; pointer-events: none; animation: pl-wave 2.4s ease-out infinite;
  }
  .pl-play::after { animation-delay: 1.2s; }
  .pl:not(.paused) .pl-play::before, .pl:not(.paused) .pl-play::after { animation: none; }
  @keyframes pl-wave { 0% { transform: scale(1); opacity: .6; } 100% { transform: scale(1.6); opacity: 0; } }

  .pl-bar { position: absolute; left: 1.4em; right: 1.4em; bottom: 4.8em; display: flex; align-items: center; gap: .9em; font-size: .95em; color: #d4d5db; }
  .pl-bar span { min-width: 3.6em; text-align: center; font-variant-numeric: tabular-nums; }
  .pl-track { position: relative; flex: 1; height: .55em; border-radius: .3em; background: rgba(255, 255, 255, .2); touch-action: none; }
  .pl-track::before { content: ""; position: absolute; left: -.5em; right: -.5em; top: -1em; bottom: -1em; }
  .pl-buf, .pl-fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: .3em; width: 0; }
  .pl-buf { background: rgba(255, 255, 255, .22); }
  .pl-fill { background: var(--pl-accent); }
  .pl-knob {
    position: absolute; top: 50%; left: 0; width: 1.2em; height: 1.2em; margin: -.6em 0 0 -.6em; border-radius: 50%;
    background: var(--pl-accent); transition: transform .15s, box-shadow .15s;
  }
  .pl-track:focus .pl-knob, .pl.drag .pl-knob { transform: scale(1.3); box-shadow: 0 0 0 .22em #fff; }

  .pl-row { position: absolute; left: 1.4em; right: 1.4em; bottom: 1.1em; display: flex; gap: .6em; }
  .pl-chip {
    height: 2.8em; padding: 0 1.2em; border-radius: 1.4em; background: var(--pl-btn);
    display: flex; align-items: center; gap: .5em; font-size: 1em; font-weight: 500; white-space: nowrap;
    transition: transform .18s cubic-bezier(.2, .8, .2, 1), background .18s, color .18s, box-shadow .18s;
  }
  .pl-chip svg { width: 1.25em; height: 1.25em; color: var(--pl-accent); transition: color .18s; }
  .pl-chip.r { margin-left: auto; padding: 0 .9em; }

  .pl-round:focus, .pl-chip:focus { background: var(--pl-accent); color: var(--pl-ink); transform: scale(1.07); box-shadow: 0 0 0 .22em #fff; }
  .pl-chip:focus svg { color: var(--pl-ink); }
  .pl-play:focus { transform: scale(1.1); box-shadow: 0 0 0 .22em #fff; }
  .pl-round:active, .pl-chip:active, .pl-play:active { transform: scale(.93); }

  /* Боковая панель: один drawer настроек (как в Reelo) + выбор серий */
  .pl-panel {
    position: absolute; top: 0; right: 0; bottom: 0; width: min(26em, 92%);
    background: var(--pl-panel); border-left: 1px solid #1f2027; border-radius: 1.6em 0 0 1.6em;
    padding: 1.2em 1.3em 1.6em; overflow-y: auto; scrollbar-width: none;
    transform: translateX(105%); transition: transform .28s cubic-bezier(.2, .8, .2, 1); visibility: hidden;
  }
  .pl-panel::-webkit-scrollbar { display: none; }
  .pl-panel.open { transform: none; visibility: visible; }
  .pl-ph { display: flex; align-items: center; justify-content: space-between; }
  .pl-ph b { font-size: 1.4em; font-weight: 500; }
  .pl-lb { font-size: .9em; color: var(--pl-muted); margin: 1.3em 0 .6em; }
  .pl-chips { display: flex; flex-wrap: wrap; gap: .55em; }
  .pl-k {
    height: 2.6em; padding: 0 1.2em; border-radius: 1.3em; background: var(--pl-chip);
    display: flex; align-items: center; font-size: 1em; font-weight: 500;
    transition: transform .18s cubic-bezier(.2, .8, .2, 1), background .18s, color .18s, box-shadow .18s;
  }
  .pl-k.a { background: var(--pl-accent); color: var(--pl-ink); }
  .pl-k:focus { transform: scale(1.06); box-shadow: 0 0 0 .2em #fff; }
  .pl-k:not(.a):focus { background: #fff; color: #0b0c12; }
  .pl-link {
    display: flex; align-items: center; gap: .8em; height: 3.4em; margin-top: .7em; padding: 0 1em 0 .5em;
    border-radius: 1.7em; background: #15161d; font-weight: 500;
    transition: transform .18s, background .18s, color .18s, box-shadow .18s;
  }
  .pl-link .ic { flex: none; width: 2.4em; height: 2.4em; border-radius: 50%; background: var(--pl-accent); color: var(--pl-ink); display: flex; align-items: center; justify-content: center; }
  .pl-link .ic svg { width: 1.3em; height: 1.3em; }
  .pl-link .v { margin-left: auto; font-size: .9em; font-weight: 400; color: var(--pl-muted); white-space: nowrap; }
  .pl-link > svg { flex: none; width: 1.1em; height: 1.1em; color: #6b6c75; }
  .pl-link:focus { background: var(--pl-accent); color: var(--pl-ink); transform: scale(1.02); box-shadow: 0 0 0 .2em #fff; }
  .pl-link:focus .ic { background: var(--pl-ink); color: var(--pl-accent); }
  .pl-link:focus .v, .pl-link:focus > svg { color: #5a4510; }

  /* Сезоны и серии */
  .pl-seasons { display: flex; gap: .55em; margin-top: 1.2em; flex-wrap: wrap; }
  .pl-epgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: .55em; margin-top: 1em; }
  .pl-ep {
    height: 3.4em; border-radius: 1em; background: var(--pl-chip);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .1em;
    transition: transform .18s, background .18s, color .18s, box-shadow .18s;
  }
  .pl-ep b { font-size: 1.05em; font-weight: 700; }
  .pl-ep small { font-size: .7em; color: var(--pl-muted); }
  .pl-ep.cur { background: var(--pl-accent); color: var(--pl-ink); }
  .pl-ep.cur small { color: #5a4510; }
  .pl-ep.seen { opacity: .55; }
  .pl-ep.future { opacity: .4; }
  .pl-ep:focus { transform: scale(1.05); box-shadow: 0 0 0 .2em #fff; }
  .pl-ep:not(.cur):focus { background: #fff; color: #0b0c12; }
  .pl-ep:not(.cur):focus small { color: #5a4510; }
  .pl-epnav { display: flex; gap: .6em; margin-top: 1.3em; }
  .pl-epnav .pl-link { flex: 1; margin-top: 0; }

  /* Карточки поверх видео: продолжение и «Далее» */
  .pl-card {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: min(24em, 90%); padding: 1.4em 1.5em; border-radius: 1.4em;
    background: var(--pl-panel); border: 1px solid #1f2027; text-align: center; display: none;
  }
  .pl-card.show { display: block; }
  .pl-card b { display: block; font-size: 1.25em; font-weight: 500; margin-bottom: .3em; }
  .pl-card small { color: var(--pl-muted); }
  .pl-card .pl-row2 { display: flex; gap: .6em; margin-top: 1.1em; }
  .pl-card .pl-btn {
    flex: 1; height: 2.8em; border-radius: 1.4em; border: 0; font: 700 1em system-ui, sans-serif; cursor: pointer;
  }
  .pl-card .pl-btn.gold { background: var(--pl-accent); color: var(--pl-ink); }
  .pl-card .pl-btn.dark { background: var(--pl-chip); color: #fff; }
  .pl-card .pl-btn:focus { box-shadow: 0 0 0 .2em #fff; }

  /* Громкость: ползунок в настройках */
  .pl-vol { display: flex; align-items: center; gap: .8em; height: 3.4em; padding: 0 1em; border-radius: 1.7em; background: #15161d; }
  .pl-vol svg { flex: none; width: 1.3em; height: 1.3em; color: var(--pl-accent); }
  .pl-vol input[type="range"] { flex: 1; accent-color: var(--pl-accent); }
  .pl-vol span { flex: none; min-width: 2.6em; text-align: right; font-variant-numeric: tabular-nums; }

  @media (prefers-reduced-motion: reduce) {
    .pl-play::before, .pl-play::after { animation: none; }
    .pl * { transition: none !important; }
  }

  /* Превью: переключатель Телефон/ТВ сверху справа; скрывается, пока открыта панель или карточка, чтобы не перекрывать крестик */
  .pv-toggle { position: fixed; top: 12px; right: 12px; z-index: 100; display: flex; background: rgba(26,26,26,.9); border: 1px solid rgba(255,255,255,.12); border-radius: 999px; padding: 4px; }
  body:has(.pl-panel.open) .pv-toggle, body:has(.pl-card.show) .pv-toggle { display: none; }
  .pv-toggle button { border: 0; background: transparent; color: #9a9ba3; font: 600 14px system-ui, sans-serif; padding: 6px 14px; border-radius: 999px; cursor: pointer; }
  .pv-toggle button.on { background: #f7c948; color: #1a1405; }
  html, body { margin: 0; height: 100%; background: #000; overflow-x: hidden; }
</style>
</head>
<body>

<div class="pl" id="pl" tabindex="-1">
  <video id="pl-v" playsinline preload="metadata"></video>
  <div class="pl-sub" id="pl-sub"><span></span></div>
  <div class="pl-spin"></div>
  <div class="pl-err" id="pl-err">Не удалось воспроизвести видео<br><span style="font-size:.8em;color:#9a9ba3">Попробуйте ещё раз</span></div>
  <div class="pl-toast" id="pl-toast"></div>

  <div class="pl-ui" id="pl-ui">
    <div class="pl-shade t"></div><div class="pl-shade b"></div>
    <div class="pl-top">
      <div class="pl-round" data-f tabindex="0" role="button" data-act="back" aria-label="Назад"></div>
      <div class="pl-ttl"><b id="pl-title"></b><small id="pl-meta"></small></div>
    </div>
    <div class="pl-mid">
      <div class="pl-round pl-skip" data-f tabindex="0" role="button" data-act="skip" data-v="-10" aria-label="Назад на 10 секунд"></div>
      <div class="pl-play" id="pl-play" data-f tabindex="0" role="button" data-act="play" aria-label="Воспроизведение"></div>
      <div class="pl-round pl-skip" data-f tabindex="0" role="button" data-act="skip" data-v="10" aria-label="Вперёд на 10 секунд"></div>
    </div>
    <div class="pl-bar">
      <span id="pl-cur">0:00</span>
      <div class="pl-track" id="pl-track" data-f tabindex="0" role="slider" aria-label="Перемотка">
        <div class="pl-buf" id="pl-buf"></div><div class="pl-fill" id="pl-fill"></div><div class="pl-knob" id="pl-knob"></div>
      </div>
      <span id="pl-dur">0:00</span>
    </div>
    <div class="pl-row">
      <div class="pl-chip" data-f tabindex="0" role="button" data-act="eps" id="pl-epchip"></div>
      <div class="pl-chip" data-f tabindex="0" role="button" data-act="cc"></div>
      <div class="pl-chip" data-f tabindex="0" role="button" data-act="set">Настройки</div>
      <div class="pl-chip" data-f tabindex="0" role="button" data-act="pip" id="pl-pip" aria-label="Картинка в картинке"></div>
      <div class="pl-chip r" data-f tabindex="0" role="button" data-act="fs" id="pl-fs" aria-label="Во весь экран"></div>
    </div>
  </div>

  <div class="pl-card" id="pl-resume">
    <b>Продолжить просмотр?</b>
    <small id="pl-resume-t"></small>
    <div class="pl-row2">
      <button class="pl-btn dark" data-f data-act="resume-no">С начала</button>
      <button class="pl-btn gold" data-f data-act="resume-yes">Продолжить</button>
    </div>
  </div>

  <div class="pl-card" id="pl-next">
    <b>Серия закончилась</b>
    <small id="pl-next-t"></small>
    <div class="pl-row2">
      <button class="pl-btn dark" data-f data-act="next-no">Смотреть сначала</button>
      <button class="pl-btn gold" data-f data-act="next-yes" id="pl-next-btn">Следующая серия</button>
    </div>
  </div>

  <div class="pl-panel" id="pl-p-set"></div>
  <div class="pl-panel" id="pl-p-eps"></div>
</div>

<div class="pv-toggle" id="pvToggle"><button data-variant="phone" class="on">Телефон</button><button data-variant="tv">ТВ</button></div>
<script>
  /* Плеер по мотивам Reelo: поведение оттуда, цвета наши. Демо — сериал. */
  (function () {
    var root = document.getElementById('pl'), v = document.getElementById('pl-v');
    var $ = function (id) { return document.getElementById(id); };
    var on = function (el, ev, fn) { el.addEventListener(ev, fn); };

      skipF: '<svg viewBox="0 0 24 24"><path d="M13 4l5 5v6"/><path d="M21 12a9 9 0 1 1-3-6.7"/><text x="12" y="16" text-anchor="middle">10</text></svg>',
      chev: '<svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>',

      eps: '<rect x="2" y="4" width="20" height="16" rx="2"/><path d="M7 9h4M7 13h6M7 17h8"/>',

    };
    var chev = '<svg viewBox="0 0 24 24">' + IC.chev + '</svg>';
    var closeBtn = function (act) { return '<div class="pl-round" data-f tabindex="0" role="button" data-act="' + act + '" aria-label="Закрыть">' + IC.x + '</div>'; };

    /* --- демо-данные: сериал --- */
    var SAMPLE = 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4';
    var SERIES = {
      title: 'Демо-сериал', year: '2025',
      seasons: [
        { n: 1, eps: [1, 2, 3, 4] },
        { n: 2, eps: [1, 2, 3] },
        { n: 0, special: true, eps: [1] }
      ]
    };
    var QUALITIES = ['Авто', '1080p', '720p', '480p'];
    var VOICES = ['Дубляж', 'LostFilm', 'Оригинал'];
    var SPEEDS = ['0.5', '1', '1.25', '1.5', '2'];
    var ZOOMS = [{ id: 'fit', label: 'По размеру экрана' }, { id: 'cover', label: 'Заполнить экран' }, { id: 'fill', label: 'Растянуть' }];
    var SUB_LANGS = [{ id: 'off', label: 'Выключены' }, { id: 'ru', label: 'Русские' }, { id: 'en', label: 'Английские' }];
    var SUB_SIZES = ['Мелкий', 'Средний', 'Крупный'];
    var SUB_COLORS = [{ id: '#ffffff', label: 'Белый' }, { id: '#f7c948', label: 'Жёлтый' }, { id: '#7de3ff', label: 'Голубой' }];

    /* --- состояние --- */
    var st = {
      season: 1, ep: 2, playS: 1, playE: 2, tabS: 1, seen: { '1:1': true },
      quality: 'Авто', voice: 'Дубляж', speed: '1', zoom: 'fit',
      volume: 80, muted: false, subLang: 'ru', subSize: 'Средний', subColor: '#ffffff',
      hls: null, subs: [], panel: null, setView: 'sections'

    var curIndex = function () {

    /* --- демо-субтитры --- */

    /* --- панели --- */

    }
    function renderSet() {

          + linkRow(IC.set, 'Масштаб', ZOOMS.filter(function (z) { return z.id === st.zoom; })[0].label, 'set-zoom')
          + '<div class="pl-lb">Громкость</div>'
          + '<div class="pl-vol"><svg viewBox="0 0 24 24">' + IC.vol + '</svg><input type="range" id="pl-vol" min="0" max="100" value="' + st.volume + '"><span id="pl-vol-v">' + st.volume + '%</span></div>'
          + '<div class="pl-chips" style="margin-top:.7em"><div class="pl-k' + (st.muted ? ' a' : '') + '" data-f tabindex="0" role="button" data-act="mute">' + (st.muted ? 'Звук выключен' : 'Выключить звук') + '</div></div>';

    }
    function renderEps() {

        var lab = s.special ? 'Спецвыпуски' : ('Сезон ' + s.n);

    /* --- загрузка серии --- */

    function applyZoom() {

    function setVolume(pct, fromMute) {

    /* --- paint --- */

    /* --- UI show/hide --- */
    var hideT = 0;

    /* --- действия --- */
    function act(el) {

    on(root, 'click', function (e) {

        var all = Array.prototype.slice.call(root.querySelectorAll('[data-f]')).filter(function (x) { return x.offsetParent !== null; });

    /* --- статичные иконки --- */
    document.querySelector('[data-act="back"]').innerHTML = '<svg viewBox="0 0 24 24">' + IC.back + '</svg>';
    document.querySelector('[data-act="skip"][data-v="-10"]').innerHTML = '<svg viewBox="0 0 24 24">' + IC.skipB + '</svg>';
    document.querySelector('[data-act="skip"][data-v="10"]').innerHTML = '<svg viewBox="0 0 24 24">' + IC.skipF + '</svg>';
    document.querySelector('[data-act="cc"]').innerHTML = '<svg viewBox="0 0 24 24">' + IC.sub + '</svg>Субтитры';
    document.querySelector('[data-act="pip"]').innerHTML = '<svg viewBox="0 0 24 24">' + IC.pip + '</svg>';
    document.querySelector('[data-act="fs"]').innerHTML = '<svg viewBox="0 0 24 24">' + IC.fs + '</svg>';

    /* --- масштаб превью: телефон = ширина/58, ТВ = 26px --- */
    function fit() {
      if (document.body.classList.contains('tv')) root.style.fontSize = '26px';
      else root.style.fontSize = Math.max(11, Math.min(26, root.clientWidth / 58)) + 'px';
    }
    on(window, 'resize', fit); fit();

    /* --- превью-переключатель --- */
    var btns = document.querySelectorAll('#pvToggle button');
    btns.forEach(function (b) {
      on(b, 'click', function () {
        btns.forEach(function (x) { x.classList.remove('on'); });
        b.classList.add('on');
        document.body.classList.toggle('tv', b.getAttribute('data-variant') === 'tv');
        fit();
      });
    });

    /* --- старт: демо-сериал, S1E2 --- */
    loadEp(1, 2);
    paintPlay();
    showUI();
  })();
</script>
</body>
</html>
