<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Pawflix — Кино ИИ (Детализированная тасовка + 10 результатов)</title>
  <style>
    :root {
      --bg: #09090b;
      --gold: #F7C948;
      --gold-light: #ffe699;
      --text: #f4f4f6;
      --muted: #8e8e93;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      padding: 16px 16px 140px;
      max-width: 480px;
      margin: 0 auto;
    }

    .demo-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .poster-stub {
      height: 220px;
      border-radius: 16px;
      background: linear-gradient(145deg, #1b1b22, #121216);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    /* Плавающая пилюля «Кино ИИ» */
    .ai-fab-pill {
      position: fixed;
      right: 16px;
      bottom: calc(80px + env(safe-area-inset-bottom));
      z-index: 1300;
      height: 46px;
      max-width: 150px;
      padding: 0 18px;
      border-radius: 999px;
      background: #16161a;
      color: var(--text);
      font-size: 13.5px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      overflow: hidden;
      box-shadow: 0 10px 26px rgba(0, 0, 0, 0.8), 0 0 18px rgba(247, 201, 72, 0.22);
      transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .ai-fab-pill:active { transform: scale(0.92); }
    .ai-fab-pill.collapsed { max-width: 46px; padding: 0 14px; gap: 0; }
    .ai-fab-label { white-space: nowrap; transition: opacity 0.2s, max-width 0.3s; max-width: 95px; }
    .ai-fab-pill.collapsed .ai-fab-label { opacity: 0; max-width: 0; }

    .ai-fab-pill::before {
      content: "";
      position: absolute;
      inset: -160%;
      background: conic-gradient(from 0deg, transparent 240deg, var(--gold) 310deg, var(--gold-light) 340deg, transparent 360deg);
      animation: rotateBorder 3.6s linear infinite;
      z-index: -2;
    }

    .ai-fab-pill::after {
      content: "";
      position: absolute;
      inset: 1.5px;
      border-radius: 999px;
      background: linear-gradient(145deg, #1d1d23 0%, #121215 100%);
      z-index: -1;
    }

    .ai-fab-pill svg { color: var(--gold); flex-shrink: 0; }
    @keyframes rotateBorder { to { transform: rotate(360deg); } }

    /* Нижний блюр-навбар */
    .bottom-nav {
      position: fixed;
      left: 0; right: 0; bottom: 0; z-index: 900;
      height: calc(64px + env(safe-area-inset-bottom));
      padding-bottom: env(safe-area-inset-bottom);
      background: rgba(14, 14, 16, 0.68);
      backdrop-filter: blur(22px) saturate(180%);
      -webkit-backdrop-filter: blur(22px) saturate(180%);
      border-top: 1px solid rgba(255, 255, 255, 0.09);
      display: flex; justify-content: space-around; align-items: center;
    }

    .bottom-nav button { flex: 1; height: 100%; background: none; border: none; color: rgba(255, 255, 255, 0.5); display: flex; align-items: center; justify-content: center; }
    .bottom-nav button.active { color: var(--gold); }
    .bottom-nav svg { width: 23px; height: 23px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }

    /* =====================================================
       ВЫЕЗЖАЮЩАЯ ШТОРКА ИИ-ПОДБОРА
       ===================================================== */
    dialog {
      position: fixed;
      inset: auto 0 0 0;
      margin: 0 auto;
      width: 100%;
      max-width: 480px;
      background: #141418;
      color: var(--text);
      border: none;
      border-top: 1px solid rgba(247, 201, 72, 0.28);
      border-radius: 26px 26px 0 0;
      padding: 12px 0 calc(24px + env(safe-area-inset-bottom));
      transform: translateY(100%);
      transition: transform 0.32s cubic-bezier(0.22, 1, 0.36, 1);
      z-index: 1200;
      overflow: hidden;
    }

    dialog[open] { transform: translateY(0); }
    dialog::backdrop { background: rgba(0, 0, 0, 0.74); backdrop-filter: blur(6px); }

    .sheet-pad { padding: 0 16px; }
    .bar { width: 36px; height: 4px; border-radius: 99px; background: rgba(255, 255, 255, 0.22); margin: 0 auto 14px; }
    .sh-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .sh-title { display: flex; align-items: center; gap: 8px; font-size: 18px; font-weight: 700; }
    .sh-title span { color: var(--gold); }
    .sh-close { background: rgba(255, 255, 255, 0.08); border: none; color: var(--muted); width: 30px; height: 30px; border-radius: 50%; font-size: 15px; cursor: pointer; }

    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .chip { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.08); color: var(--text); padding: 7px 12px; border-radius: 999px; font-size: 12.5px; cursor: pointer; }
    .chip.active { background: rgba(247, 201, 72, 0.16); border-color: var(--gold); color: var(--gold); }

    .input-row { display: flex; gap: 8px; margin-bottom: 14px; }
    .ai-input { flex: 1; background: #0d0d10; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 14px; padding: 11px 14px; color: var(--text); font-size: 14px; outline: none; }
    .ai-input:focus { border-color: var(--gold); }
    .send-btn { background: var(--gold); color: #121212; border: none; border-radius: 14px; padding: 0 16px; font-weight: 700; font-size: 14px; cursor: pointer; }

    /* =====================================================
       СЦЕНА ТАСОВКИ КАРТОЧЕК С ДЕТАЛЯМИ
       ===================================================== */
    .shuffle-stage {
      display: none;
      flex-direction: column;
      align-items: center;
      margin: 0 16px;
      padding: 20px 12px 16px;
      border-radius: 20px;
      background: radial-gradient(circle at 50% 42%, rgba(247, 201, 72, 0.13), rgba(16, 16, 20, 0.95) 75%);
      border: 1px solid rgba(247, 201, 72, 0.22);
    }
    .shuffle-stage.show { display: flex; }

    .deck-box {
      position: relative;
      width: 180px;
      height: 114px;
      margin-bottom: 14px;
    }

    .poster-card {
      position: absolute;
      left: 50%;
      top: 6px;
      width: 68px;
      height: 98px;
      margin-left: -34px;
      border-radius: 12px;
      border: 1px solid rgba(247, 201, 72, 0.45);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.8), 0 0 14px rgba(247, 201, 72, 0.15);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 7px;
      overflow: hidden;
    }

    .poster-card::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(125deg, transparent 30%, rgba(247, 201, 72, 0.24) 50%, transparent 70%);
      animation: cardSheen 1.3s ease-in-out infinite;
    }

    .mini-badge {
      align-self: flex-end;
      font-size: 8.5px;
      font-weight: 700;
      padding: 2px 5px;
      border-radius: 5px;
      background: rgba(0, 0, 0, 0.68);
      color: var(--gold);
    }

    .mini-lines {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .mini-lines span {
      height: 3px;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.25);
    }

    .mini-lines span:first-child { width: 82%; background: rgba(247, 201, 72, 0.6); }
    .mini-lines span:last-child { width: 55%; }

    .poster-card:nth-child(1) {
      background: linear-gradient(155deg, #2a1f36 0%, #15141b 100%);
      animation: deckLeft 1.25s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }

    .poster-card:nth-child(2) {
      background: linear-gradient(155deg, #3a2b12 0%, #16151a 100%);
      border-color: var(--gold);
      animation: deckCenter 1.25s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }

    .poster-card:nth-child(3) {
      background: linear-gradient(155deg, #172a36 0%, #14151b 100%);
      animation: deckRight 1.25s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }

    @keyframes deckLeft { 0%, 100% { transform: translateX(-34px) rotate(-16deg) scale(0.9); z-index: 1; } 50% { transform: translateX(36px) rotate(16deg) scale(0.96); z-index: 3; } }
    @keyframes deckCenter { 0%, 100% { transform: translateY(-4px) scale(1.05); z-index: 2; } 50% { transform: translateY(4px) scale(0.92); z-index: 1; } }
    @keyframes deckRight { 0%, 100% { transform: translateX(34px) rotate(16deg) scale(0.9); z-index: 1; } 50% { transform: translateX(-36px) rotate(-16deg) scale(0.96); z-index: 2; } }
    @keyframes cardSheen { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }

    .stage-step { font-size: 13px; color: var(--gold-light); }

    /* =====================================================
       КАРУСЕЛЬ ИЗ 10 РЕЗУЛЬТАТОВ
       ===================================================== */
    .results-section {
      display: none;
      animation: fadeUp 0.35s ease;
    }
    .results-section.show { display: block; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .results-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 16px 10px;
      font-size: 12.5px;
      color: var(--muted);
    }

    .count-badge {
      background: rgba(247, 201, 72, 0.14);
      color: var(--gold);
      border: 1px solid rgba(247, 201, 72, 0.3);
      padding: 2px 8px;
      border-radius: 999px;
      font-weight: 600;
      font-size: 11.5px;
    }

    .movies-carousel {
      display: flex;
      gap: 11px;
      overflow-x: auto;
      padding: 2px 16px 6px;
      scroll-snap-type: x mandatory;
      scrollbar-width: none;
    }
    .movies-carousel::-webkit-scrollbar { display: none; }

    .movie-item {
      flex: 0 0 142px;
      scroll-snap-align: start;
      background: #101013;
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 16px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.15s ease, border-color 0.2s ease;
    }

    .movie-item:active {
      transform: scale(0.96);
      border-color: var(--gold);
    }

    .poster-wrap {
      position: relative;
      width: 100%;
      height: 196px;
      background: #1c1c22;
    }

    .rank-tag {
      position: absolute;
      top: 7px;
      left: 7px;
      background: rgba(10, 10, 12, 0.78);
      backdrop-filter: blur(6px);
      color: var(--gold);
      font-size: 10.5px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 7px;
      border: 1px solid rgba(247, 201, 72, 0.3);
    }

    .poster-ratings {
      position: absolute;
      left: 6px;
      right: 6px;
      bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(10, 10, 12, 0.78);
      backdrop-filter: blur(8px);
      padding: 4px 7px;
      border-radius: 8px;
      font-size: 10.5px;
      font-weight: 700;
    }

    .rt { color: #ff5e5e; }
    .kp { color: var(--gold); }

    .movie-body { padding: 9px 10px 10px; }

    .movie-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .movie-year {
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
    }

    .ai-reason {
      margin-top: 6px;
      font-size: 11px;
      line-height: 1.3;
      color: #c4c4cc;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
  </style>
</head>
<body>

  <div class="demo-grid">
    <div class="poster-stub"></div><div class="poster-stub"></div>
    <div class="poster-stub"></div><div class="poster-stub"></div>
    <div class="poster-stub"></div><div class="poster-stub"></div>
  </div>

  <!-- Плавающая пилюля «Кино ИИ» -->
  <button class="ai-fab-pill" id="aiFab" type="button" onclick="openAiSheet()">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
      <path d="M12 2.5l1.6 4.4 4.4 1.6-4.4 1.6L12 14.5l-1.6-4.4L6 8.5l4.4-1.6L12 2.5z" fill="currentColor"/>
      <path d="M18.5 14l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8.8-2.2z" fill="currentColor" opacity="0.85"/>
    </svg>
    <span class="ai-fab-label">Кино ИИ</span>
  </button>

  <!-- Нижний блюр-навбар -->
  <nav class="bottom-nav">
    <button class="active"><svg viewBox="0 0 24 24"><path d="M3 10.5L12 3l9 7.5M5 9.5V19a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V9.5"/></svg></button>
    <button><svg viewBox="0 0 24 24"><polygon points="12 3 2 8.5 12 14 22 8.5 12 3"/><polyline points="2 13 12 18.5 22 13"/><polyline points="2 17.5 12 23 22 17.5"/></svg></button>
    <button><svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="1.8"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.8"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.8"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.8"/></svg></button>
    <button><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="20" y1="20" x2="16.2" y2="16.2"/></svg></button>
    <button><svg viewBox="0 0 24 24"><line x1="4" y1="8" x2="13" y2="8"/><line x1="17" y1="8" x2="20" y2="8"/><circle cx="15" cy="8" r="2"/><line x1="4" y1="16" x2="7" y2="16"/><line x1="11" y1="16" x2="20" y2="16"/><circle cx="9" cy="16" r="2"/></svg></button>
  </nav>

  <!-- Выезжающее окно ИИ-помощника -->
  <dialog id="aiSheet" onclick="if(event.target===this)this.close()">
    <div class="sheet-pad">
      <div class="bar"></div>
      <div class="sh-head">
        <div class="sh-title"><span>✦</span> Кино ИИ помощник</div>
        <button class="sh-close" type="button" onclick="document.getElementById('aiSheet').close()">✕</button>
      </div>

      <div class="chips">
        <button class="chip" type="button" onclick="runAiSearch('Космос и время', this)">Космос и время</button>
        <button class="chip" type="button" onclick="runAiSearch('Напряжённый триллер', this)">Напряжённый триллер</button>
        <button class="chip" type="button" onclick="runAiSearch('Лёгкое на вечер', this)">Лёгкое на вечер</button>
      </div>

      <div class="input-row">
        <input class="ai-input" id="aiQuery" type="text" placeholder="Опиши сюжет или настроение...">
        <button class="send-btn" type="button" onclick="runAiSearch()">Найти</button>
      </div>
    </div>

    <!-- Анимация тасовки карточек со всеми деталями -->
    <div class="shuffle-stage" id="shuffleStage">
      <div class="deck-box">
        <div class="poster-card">
          <span class="mini-badge">8.4</span>
          <div class="mini-lines"><span></span><span></span></div>
        </div>
        <div class="poster-card">
          <span class="mini-badge">✦ ИИ</span>
          <div class="mini-lines"><span></span><span></span></div>
        </div>
        <div class="poster-card">
          <span class="mini-badge">92%</span>
          <div class="mini-lines"><span></span><span></span></div>
        </div>
      </div>
      <div class="stage-step" id="stageText">Перебираю подходящие фильмы...</div>
    </div>

    <!-- Горизонтальная карусель из 10 результатов -->
    <div class="results-section" id="resultsSection">
      <div class="results-meta">
        <span>Свайпайте карточки вбок</span>
        <span class="count-badge">10 фильмов</span>
      </div>
      <div class="movies-carousel" id="moviesCarousel"></div>
    </div>
  </dialog>

  <script>
    const aiFab = document.getElementById('aiFab');
    const aiSheet = document.getElementById('aiSheet');
    let lastScrollY = window.scrollY;
    let scrollTimer = null;

    window.addEventListener('scroll', () => {
      const currentY = window.scrollY;
      if (currentY > lastScrollY && currentY > 40) aiFab.classList.add('collapsed');
      else aiFab.classList.remove('collapsed');
      lastScrollY = currentY;
      clearTimeout(scrollTimer);
      scrollTimer = setTimeout(() => aiFab.classList.remove('collapsed'), 950);
    }, { passive: true });

    function openAiSheet() {
      aiFab.classList.remove('collapsed');
      aiSheet.showModal();
    }

    const sample10 = [
      { title: 'Интерстеллар', year: '2014', rt: '73%', kp: '8.6', grad: 'linear-gradient(145deg,#3b2d14,#161822)', reason: 'Масштабный космос и парадоксы времени' },
      { title: 'Дюна: Часть вторая', year: '2024', rt: '92%', kp: '8.3', grad: 'linear-gradient(145deg,#4d2e16,#191518)', reason: 'Эпический визуал и мощный саундтрек' },
      { title: 'Бегущий по лезвию 2049', year: '2017', rt: '88%', kp: '7.8', grad: 'linear-gradient(145deg,#183642,#2a1829)', reason: 'Атмосферный нео-нуар киберпанк' },
      { title: 'Прибытие', year: '2016', rt: '94%', kp: '7.6', grad: 'linear-gradient(145deg,#252d36,#141619)', reason: 'Умная фантастика о языке и восприятии' },
      { title: 'Марсианин', year: '2015', rt: '91%', kp: '7.8', grad: 'linear-gradient(145deg,#4a2318,#191516)', reason: 'Выживание на Марсе с юмором и наукой' },
      { title: 'Гравитация', year: '2013', rt: '96%', kp: '7.5', grad: 'linear-gradient(145deg,#16253b,#111217)', reason: 'Непрерывное напряжение на орбите Земли' },
      { title: 'Начало', year: '2010', rt: '87%', kp: '8.7', grad: 'linear-gradient(145deg,#1f2d3a,#241f1c)', reason: 'Многослойный сюжет внутри снов' },
      { title: 'Пекло', year: '2007', rt: '76%', kp: '7.3', grad: 'linear-gradient(145deg,#4f2c12,#1a1414)', reason: 'Экспедиция к угасающему Солнцу' },
      { title: 'Луна 2112', year: '2009', rt: '90%', kp: '7.6', grad: 'linear-gradient(145deg,#282c34,#141518)', reason: 'Камерный триллер с неожиданной развязкой' },
      { title: 'Контакт', year: '1997', rt: '68%', kp: '8.0', grad: 'linear-gradient(145deg,#261f3d,#151722)', reason: 'Классика поиска внеземного разума' }
    ];

    let timers = [];

    function runAiSearch(preset, chipEl) {
      timers.forEach(t => clearTimeout(t));
      timers = [];

      document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      if (chipEl) {
        chipEl.classList.add('active');
        document.getElementById('aiQuery').value = preset;
      }

      const stage = document.getElementById('shuffleStage');
      const stepText = document.getElementById('stageText');
      const resultsSection = document.getElementById('resultsSection');
      const carousel = document.getElementById('moviesCarousel');

      resultsSection.classList.remove('show');
      stage.classList.add('show');
      stepText.textContent = 'Перебираю подходящие фильмы...';

      timers.push(setTimeout(() => {
        stepText.textContent = 'Сверяю рейтинги КП и Rotten Tomatoes...';
      }, 900));

      timers.push(setTimeout(() => {
        stage.classList.remove('show');

        carousel.innerHTML = sample10.map((m, idx) => `
          <div class="movie-item">
            <div class="poster-wrap" style="background: ${m.grad};">
              <span class="rank-tag">#${idx + 1}</span>
              <div class="poster-ratings">
                <span class="rt">🍅 ${m.rt}</span>
                <span class="kp">КП ${m.kp}</span>
              </div>
            </div>
            <div class="movie-body">
              <div class="movie-title">${m.title}</div>
              <div class="movie-year">${m.year}</div>
              <div class="ai-reason">${m.reason}</div>
            </div>
          </div>
        `).join('');

        carousel.scrollLeft = 0;
        resultsSection.classList.add('show');
      }, 1900));
    }
  </script>
</body>
</html>
