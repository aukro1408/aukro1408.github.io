<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Настройки</title>
<style>
  /* ===== Страница настроек ===== */
  :root {
    --st-accent: #f7c948;      /* жёлтый акцент */
    --st-ink: #1a1405;         /* тёмный текст на жёлтом */
    --st-bg: #080a10;          /* фон страницы */
    --st-row: #12131a;         /* фон строки */
    --st-muted: #9a9ba3;
    --st-pad: 16px;
  }

  .st { color: #fff; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding-bottom: 24px; }
  .st svg { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* Шапка */
  .st-top { padding: 0 var(--st-pad) 6px; }
  .st-back {
    display: inline-flex; align-items: center; gap: 8px;
    height: 44px; padding: 0 18px 0 14px;
    border-radius: 22px; background: #15161d;
    font-size: 16px; font-weight: 500;
    cursor: pointer; outline: 0;
    transition: transform .18s cubic-bezier(.2, .8, .2, 1), background .18s, color .18s, box-shadow .18s;
  }
  .st-back svg { width: 20px; height: 20px; color: var(--st-accent); transition: color .18s; }
  .st-title { font-size: 26px; font-weight: 500; margin: 14px var(--st-pad) 4px; }

  /* Группы */
  .st-gt { font-size: 15px; color: var(--st-muted); margin: 22px calc(var(--st-pad) + 4px) 10px; }
  .st-group { display: flex; flex-direction: column; gap: 8px; padding: 0 var(--st-pad); }

  /* Строка-пилюля */
  .st-row {
    display: flex; align-items: center; gap: 12px;
    height: 60px; padding: 0 14px 0 10px;
    border-radius: 30px; background: var(--st-row);
    cursor: pointer; outline: 0; user-select: none;
    -webkit-tap-highlight-color: transparent;
    transition: transform .18s cubic-bezier(.2, .8, .2, 1), background .18s, color .18s, box-shadow .18s;
  }
  .st-ic {
    flex: none; width: 40px; height: 40px; border-radius: 50%;
    background: var(--st-accent); color: var(--st-ink);
    display: flex; align-items: center; justify-content: center;
    transition: background .18s, color .18s;
  }
  .st-ic svg { width: 21px; height: 21px; }
  .st-lb { flex: 1; min-width: 0; font-size: 16px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .st-vl { flex: none; font-size: 14px; color: var(--st-muted); transition: color .18s; }
  .st-ch { flex: none; width: 18px; height: 18px; color: #6b6c75; transition: color .18s; }

  /* Переключатель */
  .st-sw { flex: none; position: relative; width: 52px; height: 30px; border-radius: 15px; background: #2a2b33; transition: background .18s; }
  .st-sw::after {
    content: ""; position: absolute; left: 4px; top: 4px;
    width: 22px; height: 22px; border-radius: 50%; background: var(--st-muted);
    transition: transform .2s cubic-bezier(.3, 1.4, .5, 1), background .18s;
  }
  .st-row.on .st-sw { background: var(--st-accent); }
  .st-row.on .st-sw::after { transform: translateX(22px); background: var(--st-ink); }

  /* Фокус (пульт / клавиатура / касание) */
  .st-row:focus, .st-back:focus {
    background: var(--st-accent); color: var(--st-ink);
    transform: scale(1.03); box-shadow: 0 0 0 3px #fff;
  }
  .st-row:focus .st-ic { background: var(--st-ink); color: var(--st-accent); }
  .st-row:focus .st-vl, .st-row:focus .st-ch { color: #5a4510; }
  .st-row:focus .st-sw { background: rgba(26, 20, 5, .22); }
  .st-row.on:focus .st-sw { background: var(--st-ink); }
  .st-row.on:focus .st-sw::after { background: var(--st-accent); }
  .st-back:focus svg { color: var(--st-ink); }
  .st-row:active, .st-back:active { transform: scale(.97); }

  .st-ver { text-align: center; font-size: 13px; color: #6b6c75; margin-top: 24px; }

  /* Всплывающее сообщение */
  .st-toast {
    position: fixed; left: 50%; bottom: 28px;
    transform: translate(-50%, 20px);
    padding: 12px 22px; border-radius: 24px;
    background: var(--st-accent); color: var(--st-ink);
    font: 500 15px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    opacity: 0; pointer-events: none;
    transition: opacity .2s, transform .2s;
  }
  .st-toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (prefers-reduced-motion: reduce) {
    .st-row, .st-back, .st-sw::after, .st-toast { transition: none; }
  }

  /* Только для демо-страницы, в проект не переносить */
  body { margin: 0; padding: 16px 0 0; background: var(--st-bg); }

  /* --- Превью: поля ключей, список TorrServer, колонка ТВ --- */
  .st-input-row { cursor: default; }
  .st-input-row:focus-within { box-shadow: 0 0 0 2px var(--st-accent); }
  .st-input-row:active { transform: none; }
  .st-in, .st-ts-in { flex: 1; min-width: 0; height: 100%; background: transparent; border: 0; outline: 0; color: #fff; font: 400 16px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .st-in::placeholder, .st-ts-in::placeholder { color: #6b6c75; }
  .st-eye { flex: none; width: 40px; height: 40px; border-radius: 50%; background: #22232b; color: var(--st-muted); display: flex; align-items: center; justify-content: center; border: 0; cursor: pointer; }
  .st-eye svg { width: 20px; height: 20px; }
  .st-flabel { font-size: 14px; color: var(--st-muted); margin: 0 0 6px 14px; }
  #ts-list { display: flex; flex-direction: column; gap: 8px; }
  .st-ts-row { display: flex; align-items: center; gap: 10px; height: 60px; padding: 0 10px 0 14px; border-radius: 30px; background: var(--st-row); }
  .st-ts-row.def { box-shadow: 0 0 0 1.5px var(--st-accent); }
  .st-radio { flex: none; width: 20px; height: 20px; accent-color: var(--st-accent); cursor: pointer; }
  .st-def { flex: none; font-size: 13px; color: var(--st-accent); }
  .st-del { flex: none; width: 36px; height: 36px; border-radius: 50%; background: #22232b; color: var(--st-muted); display: flex; align-items: center; justify-content: center; border: 0; cursor: pointer; }
  .st-del svg { width: 16px; height: 16px; }
  .st-hint { font-size: 14px; color: var(--st-muted); padding: 4px 14px; }
  .st { padding-bottom: 88px; }
  .st-toast { bottom: 76px; }
  body.tv .st { width: 688px; margin: 0 auto; }
  body.tv .st-group { padding: 0; }
  body.tv .st-top { padding: 0 0 6px; }
  body.tv .st-title { margin: 14px 0 4px; }
  body.tv .st-gt { margin: 22px 4px 10px; }
  .pv-toggle { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); z-index: 100; display: flex; background: rgba(26,26,26,.9); border: 1px solid rgba(255,255,255,.12); border-radius: 999px; padding: 4px; }
  .pv-toggle button { border: 0; background: transparent; color: #9a9ba3; font: 600 14px system-ui, sans-serif; padding: 6px 14px; border-radius: 999px; cursor: pointer; }
  .pv-toggle button.on { background: #f7c948; color: #1a1405; }
</style>
</head>
<body>

<!-- ===== РАЗМЕТКА (строится скриптом из списка SETTINGS) ===== -->
<div class="st" id="st"><div class="st-top"><div class="st-back" id="st-back" tabindex="0" role="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>Назад</div></div><div class="st-title">Настройки</div><div class="st-gt">Ключи</div><div class="st-group"><div class="st-field"><div class="st-flabel">Ключ TMDB</div><div class="st-row st-input-row"><span class="st-ic"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="7.5" cy="16.5" r="4.5"/><path d="M11 13l9-9M15 8l2.5 2.5M18 5l2 2"/></svg></span><input class="st-in" id="k-tmdb" type="password" placeholder="Вставьте ключ TMDB" autocomplete="off" spellcheck="false"><button class="st-eye" data-for="k-tmdb" aria-label="Показать ключ"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6z"/><circle cx="12" cy="12" r="3"/></svg></button></div></div><div class="st-field"><div class="st-flabel">Токен Filmix</div><div class="st-row st-input-row"><span class="st-ic"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="7.5" cy="16.5" r="4.5"/><path d="M11 13l9-9M15 8l2.5 2.5M18 5l2 2"/></svg></span><input class="st-in" id="k-fx-token" type="password" placeholder="Вставьте токен Filmix" autocomplete="off" spellcheck="false"><button class="st-eye" data-for="k-fx-token" aria-label="Показать ключ"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6z"/><circle cx="12" cy="12" r="3"/></svg></button></div></div><div class="st-field"><div class="st-flabel">Прокси Filmix</div><div class="st-row st-input-row"><span class="st-ic"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg></span><input class="st-in" id="k-fx-proxy" type="text" placeholder="Адрес прокси Filmix" autocomplete="off" spellcheck="false"></div></div><div class="st-field"><div class="st-flabel">Адрес парсера</div><div class="st-row st-input-row"><span class="st-ic"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg></span><input class="st-in" id="k-parser-url" type="text" placeholder="Адрес парсера" autocomplete="off" spellcheck="false"></div></div><div class="st-field"><div class="st-flabel">Ключ парсера</div><div class="st-row st-input-row"><span class="st-ic"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="7.5" cy="16.5" r="4.5"/><path d="M11 13l9-9M15 8l2.5 2.5M18 5l2 2"/></svg></span><input class="st-in" id="k-parser-key" type="password" placeholder="Вставьте ключ парсера" autocomplete="off" spellcheck="false"><button class="st-eye" data-for="k-parser-key" aria-label="Показать ключ"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6z"/><circle cx="12" cy="12" r="3"/></svg></button></div></div></div><div class="st-gt">TorrServer</div><div class="st-group"><div id="ts-list"></div><div class="st-row" id="ts-add" tabindex="0" role="button"><span class="st-ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span><span class="st-lb">Добавить адрес</span></div></div><div class="st-ver">pawflix</div></div><div class="st-toast" id="st-toast"></div><div class="pv-toggle" id="pvToggle"><button data-variant="phone" class="on">Телефон</button><button data-variant="tv">ТВ</button></div><script>
(function () {
  var KEY = 'preview_settings';
  var S = { tmdb: '', fxToken: '', fxProxy: '', parserUrl: '', parserKey: '', ts: [], tsDef: -1 };
  try { var o = JSON.parse(localStorage.getItem(KEY)); if (o) Object.assign(S, o); } catch (e) {}
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
  var tEl = document.getElementById('st-toast'), tTimer;
  function toast(text) {
    tEl.textContent = text; tEl.classList.add('show');
    clearTimeout(tTimer); tTimer = setTimeout(function () { tEl.classList.remove('show'); }, 1800);
  }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

  /* Ключевые поля: автозаполнение из сохранённого, автосохранение при вводе */
  [['k-tmdb', 'tmdb'], ['k-fx-token', 'fxToken'], ['k-fx-proxy', 'fxProxy'], ['k-parser-url', 'parserUrl'], ['k-parser-key', 'parserKey']].forEach(function (p) {
    var el = document.getElementById(p[0]);
    el.value = S[p[1]] || '';
    el.addEventListener('input', function () { S[p[1]] = el.value; save(); });
  });
  /* Глаз: показать/скрыть ключ */
  document.querySelectorAll('.st-eye').forEach(function (b) {
    b.addEventListener('click', function () {
      var el = document.getElementById(b.getAttribute('data-for'));
      el.type = (el.type === 'password') ? 'text' : 'password';
      el.focus();
    });
  });

  /* Список TorrServer */
  var list = document.getElementById('ts-list');
  var X = '<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>';
  function renderTS(focusLast) {
    if (!S.ts.length) {
      list.innerHTML = '<div class="st-hint">Пока нет адресов — добавьте первый кнопкой ниже.</div>';
      return;
    }
    list.innerHTML = S.ts.map(function (u, i) {
      return '<div class="st-ts-row' + (i === S.tsDef ? ' def' : '') + '">' +
        '<input class="st-radio" type="radio" name="ts-def" aria-label="По умолчанию"' + (i === S.tsDef ? ' checked' : '') + ' data-i="' + i + '">' +
        '<input class="st-ts-in" type="text" placeholder="http://192.168.1.10:8090" value="' + esc(u) + '" data-i="' + i + '" spellcheck="false">' +
        (i === S.tsDef ? '<span class="st-def">По умолчанию</span>' : '') +
        '<button class="st-del" aria-label="Удалить адрес" data-i="' + i + '">' + X + '</button></div>';
    }).join('');
    list.querySelectorAll('.st-radio').forEach(function (r) {
      r.addEventListener('change', function () {
        S.tsDef = +r.getAttribute('data-i'); save(); renderTS(); toast('TorrServer по умолчанию изменён');
      });
    });
    list.querySelectorAll('.st-ts-in').forEach(function (inp) {
      inp.addEventListener('input', function () { S.ts[+inp.getAttribute('data-i')] = inp.value; save(); });
    });
    list.querySelectorAll('.st-del').forEach(function (b) {
      b.addEventListener('click', function () {
        var i = +b.getAttribute('data-i');
        S.ts.splice(i, 1);
        if (S.tsDef === i) S.tsDef = S.ts.length ? 0 : -1;
        else if (S.tsDef > i) S.tsDef--;
        save(); renderTS(); toast('Адрес удалён');
      });
    });
    if (focusLast) { var ins = list.querySelectorAll('.st-ts-in'); ins[ins.length - 1].focus(); }
  }
  document.getElementById('ts-add').addEventListener('click', function () {
    S.ts.push('');
    if (S.tsDef === -1) S.tsDef = 0;
    save(); renderTS(true); toast('Поле добавлено');
  });
  renderTS();

  /* Назад */
  document.getElementById('st-back').addEventListener('click', function () { if (history.length > 1) history.back(); });

  /* Переключатель превью Телефон/ТВ */
  var btns = document.querySelectorAll('#pvToggle button');
  btns.forEach(function (b) {
    b.addEventListener('click', function () {
      btns.forEach(function (x) { x.classList.remove('on'); });
      b.classList.add('on');
      document.body.classList.toggle('tv', b.getAttribute('data-variant') === 'tv');
    });
  });
})();
</script></body>
</html>
