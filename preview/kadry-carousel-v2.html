<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090909"><title>Cinema Frames</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:22px 0 30px;background:radial-gradient(ellipse at top,#2b2418,#090909 65%);color:#f7f3e9;font-family:Arial, sans-serif}.shell{max-width:960px;margin:auto;padding:0 16px}
.title-row{display:flex;align-items:end;justify-content:space-between;margin-bottom:15px}h1{font-size:23px;margin:0}.counter{color:#e5c47c;font-size:12px;letter-spacing:1px}
.track{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;padding:4px 3px 17px;scrollbar-width:none;overscroll-behavior-x:contain}.track::-webkit-scrollbar{display:none}
.frame{position:relative;flex:0 0 min(78vw,620px);height:clamp(190px,35vw,340px);border:1px solid #ffffff24;border-radius:21px;overflow:hidden;scroll-snap-align:center;background:#191612;padding:0;color:white;text-align:left;cursor:pointer;opacity:.72;transform:scale(.96);transition:opacity .35s,transform .4s,border-color .35s,box-shadow .35s;isolation:isolate}
.frame.active{opacity:1;transform:scale(1);border-color:#d9b96d99;box-shadow:0 15px 38px #000b,0 0 0 1px #d9b96d22}
.frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;transition:transform .7s}.frame.active img{transform:scale(1.045)}
.shade{position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,#0008,transparent 38%,#000b 100%),linear-gradient(90deg,#0005,transparent 75%)}
.top{position:absolute;top:14px;left:15px;right:15px;display:flex;justify-content:space-between;align-items:center}.tag{border:1px solid #e5c47c88;background:#0b0a08a8;color:#f0d69c;border-radius:7px;padding:6px 9px;font-size:9px;font-weight:bold;letter-spacing:1.3px;backdrop-filter:blur(8px)}.time{font-size:11px;text-shadow:0 1px 8px #000}
.bottom{position:absolute;left:17px;right:15px;bottom:16px;display:flex;align-items:end;justify-content:space-between}.name{font-size:clamp(18px,3vw,25px);font-weight:800;text-shadow:0 2px 12px #000}.open{width:32px;height:32px;border:1px solid #ffffff80;border-radius:50%;display:grid;place-items:center;color:#f0d69c;background:#09090966;font-size:18px}
.controls{display:flex;align-items:center;gap:12px;margin:2px 2px 0}.nav{width:38px;height:38px;border:1px solid #b18a4b77;border-radius:50%;background:linear-gradient(145deg,#211d16,#0c0c0b);color:#e9cb8a;font-size:22px;cursor:pointer}.nav:active{transform:scale(.9)}.dots{flex:1;display:flex;justify-content:center;gap:6px}.dot{width:6px;height:6px;border:0;border-radius:10px;padding:0;background:#5c5549;transition:all .25s}.dot.active{width:23px;background:linear-gradient(90deg,#a77c3d,#f0d99f)}
.frame:focus-visible,.nav:focus-visible,.dot:focus-visible,.close:focus-visible{outline:3px solid #f0d99f;outline-offset:3px}.frame:focus-visible{border-color:#f0d99f}
.viewer{position:fixed;inset:0;background:#000e;backdrop-filter:blur(12px);display:none;align-items:center;justify-content:center;padding:20px;z-index:5}.viewer.show{display:flex}.viewerbox{width:min(100%,1000px);position:relative}.viewer img{width:100%;max-height:78vh;object-fit:contain;border-radius:12px}.caption{display:flex;justify-content:space-between;margin-top:10px;font-size:13px}.caption span{color:#e5c47c}.close{position:absolute;right:0;top:-42px;border:1px solid #777;border-radius:50%;width:34px;height:34px;background:#171717;color:white;font-size:22px}
@media(max-width:520px){body{padding-top:17px}.frame{flex-basis:84vw;height:210px;border-radius:18px}.frame .top{top:12px;left:12px;right:12px}.bottom{left:14px;bottom:13px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style></head><body><main class="shell">
<div class="title-row"><div><h1>Галерея сцен</h1></div><div class="counter" id="counter">01 / 07</div></div>
<div class="track" id="track">
<button class="frame active" data-title="Город не спит" data-time="00:18:42"><img src="https://images.unsplash.com/photo-1519608487953-e999c86e7455?auto=format&fit=crop&w=1400&q=85"><span class="shade"></span><span class="top"><span class="tag">НОЧНАЯ СЦЕНА</span><span class="time">00:18:42</span></span><span class="bottom"><span class="name">Город не спит</span><span class="open">↗</span></span></button>
<button class="frame" data-title="Последний поезд" data-time="00:31:09"><img src="https://images.unsplash.com/photo-1474487548417-781cb71495f3?auto=format&fit=crop&w=1400&q=85"><span class="shade"></span><span class="top"><span class="tag">ДРАМА</span><span class="time">00:31:09</span></span><span class="bottom"><span class="name">Последний поезд</span><span class="open">↗</span></span></button>
<button class="frame" data-title="За горизонтом" data-time="00:46:27"><img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1400&q=85"><span class="shade"></span><span class="top"><span class="tag">ПРИКЛЮЧЕНИЕ</span><span class="time">00:46:27</span></span><span class="bottom"><span class="name">За горизонтом</span><span class="open">↗</span></span></button>
<button class="frame" data-title="Тёплый вечер" data-time="01:02:15"><img src="https://images.unsplash.com/photo-1519608487953-e999c86e7455?auto=format&fit=crop&w=1400&q=85"><span class="shade"></span><span class="top"><span class="tag">РОМАНТИКА</span><span class="time">01:02:15</span></span><span class="bottom"><span class="name">Тёплый вечер</span><span class="open">↗</span></span></button>
<button class="frame" data-title="Глубина" data-time="01:17:53"><img src="https://images.unsplash.com/photo-1518837695005-2083093ee35b?auto=format&fit=crop&w=1400&q=85"><span class="shade"></span><span class="top"><span class="tag">ТРИЛЛЕР</span><span class="time">01:17:53</span></span><span class="bottom"><span class="name">Глубина</span><span class="open">↗</span></span></button>
<button class="frame" data-title="Последний свет" data-time="01:39:08"><img src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?auto=format&fit=crop&w=1400&q=85"><span class="shade"></span><span class="top"><span class="tag">ФИНАЛ</span><span class="time">01:39:08</span></span><span class="bottom"><span class="name">Последний свет</span><span class="open">↗</span></span></button>
<button class="frame" data-title="Точка возврата" data-time="01:51:36"><img src="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=1400&q=85"><span class="shade"></span><span class="top"><span class="tag">ВОСПОМИНАНИЕ</span><span class="time">01:51:36</span></span><span class="bottom"><span class="name">Точка возврата</span><span class="open">↗</span></span></button>
</div>
<div class="controls"><button class="nav" id="prev">‹</button><div class="dots" id="dots"></div><button class="nav" id="next">›</button></div>
</main>
<div class="viewer" id="viewer"><div class="viewerbox"><button class="close" id="close">×</button><img id="big" alt=""><div class="caption"><strong id="cap"></strong><span id="stamp"></span></div></div></div>
<script>
const track=document.getElementById('track'),frames=[...document.querySelectorAll('.frame')],dots=document.getElementById('dots'),counter=document.getElementById('counter');let index=0,timer;
frames.forEach((f,i)=>{let d=document.createElement('button');d.className='dot'+(!i?' active':'');d.addEventListener('click',()=>go(i));dots.append(d)});
const dotEls=[...dots.children];
function paint(){frames.forEach((f,i)=>f.classList.toggle('active',i===index));dotEls.forEach((d,i)=>d.classList.toggle('active',i===index));counter.textContent=String(index+1).padStart(2,'0')+' / '+String(frames.length).padStart(2,'0')}
function go(i){index=(i+frames.length)%frames.length;frames[index].scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});paint();if(viewer.classList.contains('show')){showBig()}else{frames[index].focus({preventScroll:true})}}
document.getElementById('prev').onclick=()=>go(index-1);document.getElementById('next').onclick=()=>go(index+1);
track.addEventListener('scroll',()=>{clearTimeout(timer);timer=setTimeout(()=>{let center=track.getBoundingClientRect().left+track.clientWidth/2,best=0,dist=Infinity;frames.forEach((f,i)=>{let r=f.getBoundingClientRect(),d=Math.abs(r.left+r.width/2-center);if(d<dist){dist=d;best=i}});index=best;paint()},80)});
const viewer=document.getElementById('viewer');function showBig(){const f=frames[index];document.getElementById('big').src=f.querySelector('img').src;document.getElementById('cap').textContent=f.dataset.title;document.getElementById('stamp').textContent=f.dataset.time}frames.forEach((f,i)=>f.addEventListener('click',()=>{index=i;paint();showBig();viewer.classList.add('show');document.getElementById('close').focus()}));
function closeViewer(){viewer.classList.remove('show');frames[index].focus({preventScroll:true})}document.getElementById('close').onclick=closeViewer;viewer.addEventListener('click',e=>{if(e.target===viewer)closeViewer()});window.addEventListener('keydown',e=>{if(e.key==='Escape')closeViewer();if(e.key==='ArrowRight')go(index+1);if(e.key==='ArrowLeft')go(index-1)});paint();frames[0].focus({preventScroll:true});
</script></body></html>
