*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
html{color-scheme:light}
html[data-theme="dark"]{color-scheme:dark}
body{
font-family:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
background:var(--bg);color:var(--ink);font-size:15px;min-height:100%;
transition:background .4s,color .4s;overflow-x:hidden}
:root{
--bg:#E9E4F6;--ink:#191923;--muted:#8A86A0;--faint:#B9B4D4;
--hero:#D6BBFD;--panel:#FFFFFF;--line:#DCD6F0;--input:#F2EEFB;
--accent:#6C5CE7;--nav:#17171F;--shadow:0 20px 45px -22px rgba(90,70,160,.35);
}
[data-theme="dark"]{
--bg:#14131B;--ink:#F2F0FA;--muted:#8F8AA8;--faint:#55516B;
--hero:#4A3F6E;--panel:#1F1E28;--line:#2E2D3D;--input:#23222F;
--accent:#9B8CFF;--nav:#0C0C12;--shadow:0 20px 45px -22px rgba(0,0,0,.7);
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select{font:inherit;color:inherit}
img{display:block}
.app{max-width:430px;margin:0 auto;padding:0 20px calc(120px + env(safe-area-inset-bottom))}
.screen{display:none}
.screen.active{display:block;animation:fadein .4s cubic-bezier(.22,1,.36,1)}
@keyframes fadein{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}

/* ---------- header ---------- */
.topbar{display:flex;align-items:center;gap:12px;padding:20px 0 4px}
.avatar{width:48px;height:48px;border-radius:50%;flex:none;display:grid;place-items:center;
font-weight:800;font-size:20px;color:#fff;background:linear-gradient(135deg,#FF9E57,#F06BA8);
box-shadow:0 8px 18px -8px rgba(240,107,168,.6)}
.hello{flex:1;min-width:0}
.hello b{display:block;font-size:17px;font-weight:800;letter-spacing:-.01em}
.hello span{font-size:12.5px;color:var(--muted);font-weight:700}
.iconbtn{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;flex:none;
transition:transform .25s cubic-bezier(.34,1.56,.64,1)}
.iconbtn:active{transform:scale(.88)}
.iconbtn.dark{background:var(--nav);color:#fff;box-shadow:0 10px 22px -10px rgba(0,0,0,.5)}
.iconbtn svg{width:22px;height:22px}

/* ---------- hero ---------- */
.hero{margin-top:16px;background:var(--hero);border-radius:30px;padding:22px;position:relative;
overflow:hidden;min-height:178px;display:flex;box-shadow:var(--shadow);
animation:rise .6s cubic-bezier(.22,1,.36,1) both}
.hero-txt{position:relative;z-index:2;max-width:62%}
.hero-txt h1{margin:0;font-size:29px;line-height:1.05;font-weight:800;letter-spacing:-.02em;color:#221D33}
[data-theme="dark"] .hero-txt h1{color:#F2F0FA}
.hero-txt p{margin:8px 0 0;font-size:13px;font-weight:700;color:rgba(34,29,51,.62)}
[data-theme="dark"] .hero-txt p{color:rgba(242,240,250,.65)}
.stack{display:flex;margin-top:14px;align-items:center}
.stk{width:34px;height:34px;border-radius:50%;border:2.5px solid #fff;overflow:hidden;margin-left:-10px;background:#fff;flex:none}
.stk:first-child{margin-left:0}
.stk img{width:100%;height:100%;object-fit:cover}
.stk.more{background:#191923;color:#fff;font-size:11.5px;font-weight:800;display:grid;place-items:center;border-color:#fff}
.hero-img{position:absolute;right:-14px;bottom:-6px;height:168px;width:auto;z-index:1;
-webkit-mask-image:radial-gradient(115% 115% at 62% 45%,#000 58%,transparent 80%);
mask-image:radial-gradient(115% 115% at 62% 45%,#000 58%,transparent 80%);
animation:float 7s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-9px) rotate(2deg)}}

/* ---------- week strip ---------- */
.week{display:flex;gap:10px;overflow-x:auto;margin:18px -20px 0;padding:12px 20px 6px;
scrollbar-width:none;-webkit-overflow-scrolling:touch}
.week::-webkit-scrollbar{display:none}
.day{flex:none;min-width:57px;border:1.5px solid var(--line);border-radius:999px;background:transparent;
padding:9px 0;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative;
transition:transform .25s cubic-bezier(.34,1.56,.64,1),background .25s,border-color .25s}
.day:active{transform:scale(.9)}
.day .dow{font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.day .num{font-size:16px;font-weight:800;font-variant-numeric:tabular-nums}
.day .hdot{position:absolute;top:-8px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:var(--faint)}
.day.today{border-color:var(--accent)}
.day.today .num{color:var(--accent)}
.day.sel{background:var(--nav);border-color:var(--nav);color:#fff;box-shadow:0 10px 20px -10px rgba(0,0,0,.45)}
.day.sel .dow{color:rgba(255,255,255,.6)}
.day.sel .num{color:#fff}
.day.sel .hdot{background:var(--accent)}

/* ---------- section title ---------- */
.sect{font-size:20px;font-weight:800;letter-spacing:-.02em;margin:22px 0 12px}

/* ---------- plan cards ---------- */
.cards{columns:2;column-gap:12px}
.pcard{break-inside:avoid;margin:0 0 12px;border-radius:26px;padding:16px;color:#1D1B28;position:relative;
overflow:hidden;animation:rise .55s cubic-bezier(.22,1,.36,1) both;box-shadow:0 14px 30px -18px rgba(60,45,110,.35)}
.pcard-top{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:2}
.pill{background:rgba(255,255,255,.6);padding:5px 12px;border-radius:999px;font-size:12px;font-weight:800;font-variant-numeric:tabular-nums}
.px{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:17px;line-height:1;
color:rgba(29,27,40,.4);transition:background .2s,transform .2s}
.px:active{transform:scale(.85);background:rgba(0,0,0,.08)}
.pcard h3{margin:12px 0 4px;font-size:16.5px;font-weight:800;letter-spacing:-.01em;line-height:1.25;position:relative;z-index:2}
.pcard .meta{margin:0;font-size:12.5px;font-weight:700;color:rgba(29,27,40,.6);position:relative;z-index:2}
.pcard-bot{display:flex;align-items:center;justify-content:space-between;margin-top:14px;position:relative;z-index:2}
.cat{width:42px;height:42px;border-radius:50%;object-fit:cover;background:#fff;box-shadow:0 6px 14px -8px rgba(0,0,0,.4)}
.donebtn{width:42px;height:42px;border-radius:50%;border:2px solid rgba(29,27,40,.28);display:grid;place-items:center;
color:transparent;transition:all .3s cubic-bezier(.34,1.56,.64,1);background:rgba(255,255,255,.35)}
.donebtn:active{transform:scale(.85)}
.donebtn svg{width:20px;height:20px}
.pcard.done{opacity:.55}
.pcard.done h3{text-decoration:line-through;text-decoration-thickness:2px}
.pcard.done .donebtn{background:#191923;border-color:#191923;color:#fff}
.pcard .deco{position:absolute;right:-18px;bottom:-14px;height:110px;width:auto;z-index:1;pointer-events:none;
-webkit-mask-image:radial-gradient(110% 110% at 60% 50%,#000 55%,transparent 80%);
mask-image:radial-gradient(110% 110% at 60% 50%,#000 55%,transparent 80%)}
.pcard.focuscard{background:#C9DDE8;min-height:150px}
.pcard.focuscard h3{max-width:70%}
.playbtn{width:46px;height:46px;border-radius:50%;background:#191923;color:#fff;display:grid;place-items:center;
box-shadow:0 10px 20px -8px rgba(0,0,0,.5);transition:transform .25s cubic-bezier(.34,1.56,.64,1)}
.playbtn:active{transform:scale(.88)}
.playbtn svg{width:20px;height:20px;margin-left:2px}
.pcard.minicard{background:linear-gradient(135deg,#F7C3DC,#F0A4C9)}
.bignum{font-size:34px;font-weight:800;letter-spacing:-.03em;margin:10px 0 2px;position:relative;z-index:2}
.minibar{height:7px;border-radius:99px;background:rgba(255,255,255,.5);overflow:hidden;margin-top:10px;position:relative;z-index:2}
.minibar i{display:block;height:100%;border-radius:99px;background:#191923;transition:width .8s cubic-bezier(.22,1,.36,1)}
.empty{columns:1;text-align:center;padding:26px 10px;color:var(--muted)}
.empty img{width:130px;margin:0 auto 14px;
-webkit-mask-image:radial-gradient(110% 110% at 50% 50%,#000 60%,transparent 82%);
mask-image:radial-gradient(110% 110% at 50% 50%,#000 60%,transparent 82%)}
.empty p{font-weight:700;margin:0 0 16px}

/* ---------- navbar ---------- */
.navbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom));z-index:40;
width:min(380px,calc(100% - 44px));background:var(--nav);border-radius:999px;display:flex;align-items:center;
justify-content:space-around;padding:9px;box-shadow:0 22px 45px -16px rgba(0,0,0,.55)}
.navi{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;color:rgba(255,255,255,.42);
transition:all .3s cubic-bezier(.34,1.56,.64,1)}
.navi svg{width:24px;height:24px}
.navi:active{transform:scale(.88)}
.navi.active{background:#fff;color:#17171F;box-shadow:0 8px 18px -6px rgba(255,255,255,.35)}

/* ---------- page headers ---------- */
.pagehead{padding:24px 0 4px}
.pagehead h1{margin:0;font-size:30px;font-weight:800;letter-spacing:-.02em}
.pagehead p{margin:6px 0 0;color:var(--muted);font-weight:700;font-size:13.5px}

/* ---------- focus ---------- */
.fcard{margin-top:18px;background:#1B1B26;border-radius:32px;padding:30px 24px;text-align:center;color:#fff;
box-shadow:0 26px 55px -24px rgba(0,0,0,.6);animation:rise .6s cubic-bezier(.22,1,.36,1) both;position:relative;overflow:hidden}
.fcard::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 0%,rgba(155,140,255,.22),transparent 60%);pointer-events:none}
.ftime{font-size:74px;font-weight:800;letter-spacing:-.04em;font-variant-numeric:tabular-nums;position:relative}
.flabel{color:rgba(255,255,255,.55);font-weight:700;font-size:13px;margin-top:2px;position:relative}
.fring{width:150px;height:150px;margin:6px auto 0;position:relative;display:grid;place-items:center}
.fring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.fring .bg{fill:none;stroke:rgba(255,255,255,.12);stroke-width:9}
.fring .fg{fill:none;stroke:#B9A8F0;stroke-width:9;stroke-linecap:round;stroke-dasharray:440;stroke-dashoffset:440;transition:stroke-dashoffset .5s linear}
.fring b{font-size:40px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.fpresets{display:flex;gap:8px;justify-content:center;margin:20px 0 6px;position:relative}
.fpre{padding:9px 16px;border-radius:999px;background:rgba(255,255,255,.09);color:#fff;font-weight:800;font-size:13.5px;transition:all .25s}
.fpre.on{background:#fff;color:#1B1B26}
.fbtns{display:flex;gap:10px;justify-content:center;margin-top:16px;position:relative}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;font-weight:800;
padding:15px 30px;font-size:15.5px;transition:transform .25s cubic-bezier(.34,1.56,.64,1)}
.btn:active{transform:scale(.94)}
.btn.light{background:#fff;color:#1B1B26}
.btn.ghost{background:rgba(255,255,255,.1);color:#fff}
.btn.dark{background:var(--nav);color:#fff;box-shadow:0 14px 26px -12px rgba(0,0,0,.5)}
.btn.wide{width:100%}
.btn svg{width:18px;height:18px}

/* ---------- stats ---------- */
.statgrid{margin-top:18px;background:var(--panel);border-radius:28px;padding:22px;box-shadow:var(--shadow);animation:rise .6s cubic-bezier(.22,1,.36,1) both}
.bars{display:flex;align-items:flex-end;gap:10px;height:150px;margin-top:6px}
.bcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end}
.track{width:100%;max-width:30px;flex:1;border-radius:10px;background:var(--input);position:relative;overflow:hidden;display:flex;align-items:flex-end}
.fill{width:100%;border-radius:10px;background:linear-gradient(180deg,#9B8CFF,#6C5CE7);transition:height 1s cubic-bezier(.22,1,.36,1);min-height:0}
.bcol span{font-size:11px;font-weight:800;color:var(--muted)}
.bcol.todayb .track{outline:2px solid var(--accent);outline-offset:2px}
.statrow{display:flex;gap:12px;margin-top:12px}
.statbox{flex:1;background:var(--panel);border-radius:24px;padding:18px;box-shadow:var(--shadow);animation:rise .6s cubic-bezier(.22,1,.36,1) .08s both}
.statbox b{font-size:30px;font-weight:800;letter-spacing:-.02em;display:block}
.statbox span{font-size:12.5px;color:var(--muted);font-weight:700}

/* ---------- settings ---------- */
.prof{margin-top:18px;background:var(--panel);border-radius:28px;padding:20px;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow);animation:rise .6s cubic-bezier(.22,1,.36,1) both}
.prof .avatar{width:56px;height:56px;font-size:24px}
.prof b{font-size:17px;font-weight:800;display:block}
.prof span{font-size:12.5px;color:var(--muted);font-weight:700}
.setcard{margin-top:12px;background:var(--panel);border-radius:24px;box-shadow:var(--shadow);overflow:hidden;animation:rise .6s cubic-bezier(.22,1,.36,1) .06s both}
.srow{display:flex;align-items:center;gap:14px;padding:16px 18px;width:100%;text-align:left;transition:background .2s}
.srow:active{background:var(--input)}
.srow + .srow{border-top:1px solid var(--line)}
.srow .sic{width:42px;height:42px;border-radius:14px;background:var(--input);display:grid;place-items:center;flex:none;color:var(--ink)}
.srow .sic svg{width:21px;height:21px}
.srow .st{flex:1;min-width:0}
.srow .st b{display:block;font-size:15px;font-weight:800}
.srow .st small{color:var(--muted);font-weight:700;font-size:12.5px}
.srow.danger .st b{color:#E5484D}
.switch{width:54px;height:32px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .3s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;
box-shadow:0 2px 6px rgba(0,0,0,.25);transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
.switch.on{background:#191923}
[data-theme="dark"] .switch.on{background:#9B8CFF}
.switch.on::after{transform:translateX(22px)}
.ver{text-align:center;color:var(--faint);font-size:12px;font-weight:700;margin:26px 0 0}

/* ---------- sheet ---------- */
.backdrop{position:fixed;inset:0;background:rgba(20,16,35,.45);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);opacity:0;visibility:hidden;pointer-events:none;transition:opacity .28s,visibility .28s;z-index:1000}
.backdrop.show{opacity:1;visibility:visible;pointer-events:auto}
.sheet{position:fixed;left:50%;transform:translate3d(-50%,110%,0);bottom:0;z-index:1001;width:min(480px,100%);
background:var(--panel);border-radius:32px 32px 0 0;padding:14px 24px calc(28px + env(safe-area-inset-bottom));
box-shadow:0 -20px 60px rgba(40,30,90,.3);transition:transform .42s cubic-bezier(.22,1,.36,1);max-height:88vh;max-height:88dvh;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.sheet.show{transform:translate3d(-50%,0,0)}
.grip{width:44px;height:5px;border-radius:99px;background:var(--line);margin:2px auto 18px}
.sheet h2{margin:0 0 18px;font-size:22px;font-weight:800;letter-spacing:-.02em}
.field{margin-bottom:14px}
.field > span{display:block;font-size:12.5px;font-weight:800;color:var(--muted);margin-bottom:8px;text-transform:uppercase;letter-spacing:.05em}
.field input{width:100%;background:var(--input);border:0;border-radius:16px;padding:15px 16px;font-size:16px;font-weight:700;outline:none}
.field input:focus{box-shadow:0 0 0 2px var(--accent)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pick{display:flex;gap:10px;flex-wrap:wrap}
.pick button{width:56px;height:56px;border-radius:50%;overflow:hidden;border:2.5px solid transparent;transition:all .25s cubic-bezier(.34,1.56,.64,1);background:#fff;padding:0}
.pick button img{width:100%;height:100%;object-fit:cover}
.pick button.on{border-color:var(--nav);transform:scale(1.08);box-shadow:0 8px 16px -8px rgba(0,0,0,.4)}
.pick button:active{transform:scale(.92)}

/* ---------- toasts ---------- */
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(104px + env(safe-area-inset-bottom));z-index:60;
display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:calc(100% - 40px)}
.toast{background:var(--nav);color:#fff;padding:13px 22px;border-radius:999px;font-size:14px;font-weight:800;
box-shadow:0 14px 30px -10px rgba(0,0,0,.5);animation:toastin .45s cubic-bezier(.34,1.56,.64,1)}
.toast.out{animation:toastout .4s forwards}
@keyframes toastin{from{opacity:0;transform:translateY(16px) scale(.9)}to{opacity:1;transform:none}}
@keyframes toastout{to{opacity:0;transform:translateY(10px) scale(.92)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- layout tune: equal feature tiles + wide reminder cards ---------- */
.cards{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  column-gap:12px;
  row-gap:12px;
  columns:unset;
  align-items:stretch;
}
.cards > .pcard{
  box-sizing:border-box;
  min-width:0;
  margin:0;
  width:auto;
}
.cards > .pcard.focuscard,
.cards > .pcard.minicard{
  height:190px;
  min-height:190px;
  display:flex;
  flex-direction:column;
}
.cards > .pcard.focuscard .pcard-bot{margin-top:auto}
.cards > .pcard.minicard .minibar{margin-top:auto}
.cards > .pcard:not(.focuscard):not(.minicard){
  grid-column:1 / -1;
  min-height:142px;
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  grid-template-rows:auto 1fr auto;
  align-items:center;
  column-gap:12px;
}
.cards > .pcard:not(.focuscard):not(.minicard) .pcard-top{
  grid-column:1 / -1;
  grid-row:1;
}
.cards > .pcard:not(.focuscard):not(.minicard) h3{
  grid-column:1;
  grid-row:2;
  align-self:end;
  margin:10px 0 3px;
}
.cards > .pcard:not(.focuscard):not(.minicard) .meta{
  grid-column:1;
  grid-row:3;
  align-self:start;
}
.cards > .pcard:not(.focuscard):not(.minicard) .pcard-bot{
  grid-column:2;
  grid-row:2 / 4;
  align-self:center;
  margin:0;
  gap:8px;
}
@media (max-width:360px){
  .cards{column-gap:9px;row-gap:10px}
  .cards > .pcard.focuscard,
  .cards > .pcard.minicard{height:178px;min-height:178px}
  .cards > .pcard:not(.focuscard):not(.minicard){min-height:132px}
}

/* ---------- light-only polish: frosted navigation + vivid accent ---------- */
:root{
  color-scheme:light !important;
  --bg:#F0EDF8;
  --ink:#191923;
  --muted:#77758B;
  --faint:#AAA6BD;
  --panel:rgba(255,255,255,.92);
  --line:rgba(104,91,150,.18);
  --input:#F7F5FC;
  --accent:#7057E8;
  --nav:rgba(255,255,255,.62);
  --shadow:0 18px 42px -24px rgba(64,48,120,.30);
}
html,body{background:linear-gradient(145deg,#F0EDF8 0%,#E8F1FA 52%,#F7EDF5 100%) !important}
html[data-theme="dark"]{color-scheme:light !important}
[data-theme="dark"]{
  --bg:#F0EDF8 !important;--ink:#191923 !important;--muted:#77758B !important;
  --faint:#AAA6BD !important;--hero:#D6BBFD !important;--panel:rgba(255,255,255,.92) !important;
  --line:rgba(104,91,150,.18) !important;--input:#F7F5FC !important;
  --accent:#7057E8 !important;--nav:rgba(255,255,255,.62) !important;
}
[data-theme="dark"] .hero-txt h1{color:#221D33 !important}
[data-theme="dark"] .hero-txt p{color:rgba(34,29,51,.62) !important}
#rowTheme{display:none !important}
.navbar{
  background:rgba(255,255,255,.56) !important;
  -webkit-backdrop-filter:blur(24px) saturate(165%) !important;
  backdrop-filter:blur(24px) saturate(165%) !important;
  border:1px solid rgba(255,255,255,.78);
  box-shadow:0 12px 36px rgba(55,43,92,.16),inset 0 1px 0 rgba(255,
